<script>
// 診斷用：若頁面發生任何 JS 錯誤，直接在畫面上顯示出來（手機瀏覽器看不到主控台）
window.addEventListener('error', function(e) {
  var msg = (e && e.message) ? e.message : String(e);
  var src = (e && e.filename) ? e.filename.split('/').pop() : '';
  var line = (e && e.lineno) ? e.lineno : '';
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#c0392b;color:#fff;padding:10px 14px;font-size:13px;font-family:monospace;line-height:1.5;white-space:pre-wrap;word-break:break-all;';
  box.textContent = '⚠ 頁面錯誤: ' + msg + (src ? (' (' + src + ':' + line + ')') : '');
  document.body.prepend(box);
});
window.addEventListener('unhandledrejection', function(e) {
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#c0392b;color:#fff;padding:10px 14px;font-size:13px;font-family:monospace;line-height:1.5;white-space:pre-wrap;word-break:break-all;';
  box.textContent = '⚠ 未處理的 Promise 錯誤: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  document.body.prepend(box);
});
</script>

// ── 字型載入 ─────────────────────────────────────────────────
// 用 fetch() + FontFace API：
//   fetch() 在 Safari file:// 下仍可跨域抓 CDN（不像 CSS @font-face 受同源限制）
//   拿到 ArrayBuffer 後用 FontFace 注入，保證 canvas 可用
const fontReady  = { sans: false, pixel: false };

async function ensureFontLoaded(fontKey) {
  if (fontReady[fontKey]) return;

  if (fontKey === 'pixel') {
    // base64 內嵌字型：用多個大小觸發載入，確保 Safari 在所有 fSize 都能用
    const sizes = [12, 28, 56, 84];
    await Promise.all(sizes.map(sz =>
      document.fonts.load(sz + 'px "Fusion Pixel"').catch(() => {})
    ));
    await document.fonts.ready.catch(() => {});
  } else {
    const sizes = [12, 28, 56, 84];
    await Promise.all(sizes.map(sz =>
      document.fonts.load(sz + 'px "Noto Sans SC"').catch(() => {})
    ));
  }
  fontReady[fontKey] = true;
}
// ─────────────────────────────────────────────────────────────

async function initApp() {
  try { buildStyleBtn(); } catch (e) { console.error('buildStyleBtn failed', e); }
  try { bindFontBtn(); } catch (e) { console.error('bindFontBtn failed', e); }
  try { bindAllEvent(); } catch (e) { console.error('bindAllEvent failed', e); }
  try { updateSliderValues(); } catch (e) { console.error('updateSliderValues failed', e); }
  // 字型載入最多等 3 秒，避免網路字型卡住而讓預設圖片永遠無法顯示
  try {
    await Promise.race([
      ensureFontLoaded('sans'),
      new Promise(resolve => setTimeout(resolve, 3000))
    ]);
  } catch (e) { console.error('ensureFontLoaded failed', e); }
  // 等待一個 rAF，確保 iOS 上 previewWrap 已完成 layout 再計算尺寸
  requestAnimationFrame(() => {
    try { loadDefaultPic(); } catch (e) { console.error('loadDefaultPic failed', e); }
  });
}

// 這段 <script> 位於 </body> 結尾前，執行到這裡時 DOM 已經解析完成，
// 不需要也不應該依賴 DOMContentLoaded / window.onload 等事件——
// 任何一個外部資源（例如 Google Fonts）在特殊網路環境下卡住不動，
// 都可能導致事件永遠不觸發，讓按鈕、預設圖等初始化永遠無法執行。
// 因此這裡直接同步呼叫，不等待任何事件。
initApp();

// ── canvas 尺寸設定：exportCanvas 用原始圖尺寸（無 dpr 縮放）
//   previewCanvas 用縮放後的 CSS 顯示尺寸（同樣無 dpr，靠 style 縮放）
//   這樣 drawAll 直接把 exportCanvas 縮放貼到 previewCanvas，不會重複 dpr
function setExportSize() {
  exportCanvas.width  = originalImg.width;
  exportCanvas.height = originalImg.height;
  exportCtx.setTransform(1, 0, 0, 1, 0, 0);
}

let previewScale = 1;
function calcPreviewScale() {
  const rect = previewWrap.getBoundingClientRect();
  const iw = originalImg.width, ih = originalImg.height;
  // getBoundingClientRect 在某些 iOS 情況下回傳 0，改用 offsetWidth/offsetHeight 保底
  const ww = rect.width  || previewWrap.offsetWidth  || 320;
  const wh = rect.height || previewWrap.offsetHeight || 320;
  previewScale = Math.min(ww / iw, wh / ih);
  if (!previewScale || previewScale <= 0) previewScale = ww / iw; // 最後保底
  previewCanvas.width  = Math.round(iw * previewScale * dpr);
  previewCanvas.height = Math.round(ih * previewScale * dpr);
  previewCanvas.style.width  = Math.round(iw * previewScale) + 'px';
  previewCanvas.style.height = Math.round(ih * previewScale) + 'px';
  previewCtx.setTransform(1, 0, 0, 1, 0, 0);
}

function drawCore(ctx, cw, ch) {
  const txt    = dialogueText.value.trim() || ' ';
  const col    = textColor.value;
  const op     = +boxOpacity.value;
  const mar    = (bottomMarginSlider.value / 100) * ch;
  const szRate = textSizeSlider.value / 100;
  const sty    = styleMap[currentStyle];
  const s      = Math.min(cw, ch) / 1000;  // A: 以短邊為基準，大圖時對話框/字體不會過小

  const boxW   = cw * BASE.BOX_RATE;
  const pad    = Math.max(25, BASE.BASE_PAD * s);
  const maxW   = boxW - pad * 2;

  let fSize     = Math.max(BASE.MIN_FONT, BASE.BASE_FONT * s * szRate);
  const letterW = BASE.BASE_LETTER * s;

  const fontStr = currentFont === 'sans' ? '"Noto Sans SC",sans-serif' : '"Fusion Pixel",monospace';
  // 確保當前實際使用的字體大小已經被瀏覽器「暖機」載入過，
  // 避免字體大小超出原本預先載入的範圍時，畫布繪製悄悄退回成預設字體
  (function warmUpFontAtSize() {
    const family = currentFont === 'sans' ? 'Noto Sans SC' : 'Fusion Pixel';
    const q = Math.ceil(fSize) + 'px "' + family + '"';
    if (!document.fonts.check(q)) {
      document.fonts.load(q).then(() => { drawAll(); }).catch(() => {});
    }
  })();
  ctx.textBaseline = 'alphabetic';

  function getLineMetrics(size) {
    ctx.font = size + 'px ' + fontStr;
    // 用 'Hg|' 量測：H 取 ascent，g 取 descent，| 輔助，各字型都有且跨平台穩定
    const m = ctx.measureText('Hg|');
    const ascent  = m.actualBoundingBoxAscent  != null ? m.actualBoundingBoxAscent  : size * 0.78;
    const descent = m.actualBoundingBoxDescent != null ? m.actualBoundingBoxDescent : size * 0.22;
    return { ascent, descent, height: ascent + descent };
  }

  function calcLines(size) {
    ctx.font = size + 'px ' + fontStr;
    const ls = [];
    // 先按手動換行符切段，每段再做自動斷行
    txt.split('\n').forEach(para => {
      let cur = '', curW = 0;
      [...para].forEach(c => {
        const w = ctx.measureText(c).width;
        if (curW + w <= maxW) { cur += c; curW += w; }
        else { if (cur) ls.push(cur); cur = c; curW = w; }
      });
      ls.push(cur); // 每段結尾強制換行（空段也推入，保留空白行）
    });
    return ls;
  }

  let lines   = calcLines(fSize);
  let metrics = getLineMetrics(fSize);
  let lineH   = fSize * BASE.BASE_LINE;

  // 框高由文字決定：文字佔多高，框就多高（加 padding）
  const boxH     = lines.length * lineH + pad * 2;
  const maxInnerH = boxH - pad * 2;

  const bl = (cw - boxW) / 2 + boxX;
  let   bt = ch - boxH - mar + boxY;
  bt = Math.max(10, Math.min(bt, ch - boxH - 10));

  ctx.save();
  ctx.globalAlpha = op;
  ctx.fillStyle   = sty.bg;
  ctx.strokeStyle = sty.border;
  ctx.lineWidth   = Math.max(2, 6 * s);
  if (currentStyle === 'style14') {
    const g = ctx.createLinearGradient(bl, bt, bl, bt + boxH);
    g.addColorStop(0, '#87CEFA'); g.addColorStop(1, '#E0F7FF');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, 12 * s); ctx.fill(); ctx.stroke();
  } else if (currentStyle === 'ani2') {
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, 16 * s); ctx.fill(); ctx.stroke();
  } else if (currentStyle === 'glass') {
    const r = 14 * s;
    // 底層：半透明藍色玻璃主體
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, r); ctx.fill();
    // 光澤層：上半部白色漸層，模擬透光感
    const gloss = ctx.createLinearGradient(bl, bt, bl, bt + boxH * 0.55);
    gloss.addColorStop(0,   'rgba(255,255,255,0.22)');
    gloss.addColorStop(0.5, 'rgba(255,255,255,0.06)');
    gloss.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = gloss;
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH * 0.55, [r, r, 0, 0]); ctx.fill();
    // 邊框：藍白色半透明
    ctx.strokeStyle = sty.border;
    ctx.lineWidth   = Math.max(1.5, 3 * s);
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, r); ctx.stroke();
    // 內側細線：增加玻璃厚度感
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth   = Math.max(1, 1.5 * s);
    ctx.beginPath(); ctx.roundRect(bl + 3*s, bt + 3*s, boxW - 6*s, boxH - 6*s, r - 2*s); ctx.stroke();
  } else if (currentStyle === 'new3') {
    // 浪漫：粉色圓角框 + 小愛心裝飾（避開文字區）
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, 10*s); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = op * 0.55;
    const hearts = [{x:0.04,y:0.18},{x:0.93,y:0.22},{x:0.88,y:0.72},{x:0.06,y:0.75},{x:0.97,y:0.48},{x:0.01,y:0.48}];
    hearts.forEach(h => {
      const hx = bl + boxW * h.x, hy = bt + boxH * h.y, hr = 7 * s;
      ctx.fillStyle = '#FF8FAB'; ctx.strokeStyle = 'none';
      ctx.beginPath();
      ctx.moveTo(hx, hy + hr * 0.3);
      ctx.bezierCurveTo(hx, hy - hr * 0.3, hx - hr, hy - hr * 0.3, hx - hr, hy + hr * 0.2);
      ctx.bezierCurveTo(hx - hr, hy + hr * 0.7, hx, hy + hr * 1.1, hx, hy + hr * 1.3);
      ctx.bezierCurveTo(hx, hy + hr * 1.1, hx + hr, hy + hr * 0.7, hx + hr, hy + hr * 0.2);
      ctx.bezierCurveTo(hx + hr, hy - hr * 0.3, hx, hy - hr * 0.3, hx, hy + hr * 0.3);
      ctx.fill();
    });
  } else if (currentStyle === 'new8') {
    // 甜蜜：粉框 + 星星與愛心點綴
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, 10*s); ctx.fill(); ctx.stroke();
    const decos = [{x:0.03,y:0.25,t:'h'},{x:0.96,y:0.25,t:'h'},{x:0.03,y:0.72,t:'h'},{x:0.96,y:0.72,t:'h'},
                   {x:0.08,y:0.5,t:'s'},{x:0.92,y:0.5,t:'s'},{x:0.5,y:0.08,t:'s'},{x:0.5,y:0.88,t:'s'}];
    decos.forEach(d => {
      const dx = bl + boxW * d.x, dy = bt + boxH * d.y, dr = 6 * s;
      ctx.globalAlpha = op * 0.5;
      if (d.t === 'h') {
        ctx.fillStyle = '#F9A8D4';
        ctx.beginPath();
        ctx.moveTo(dx, dy + dr*0.3);
        ctx.bezierCurveTo(dx, dy-dr*0.3, dx-dr, dy-dr*0.3, dx-dr, dy+dr*0.2);
        ctx.bezierCurveTo(dx-dr, dy+dr*0.7, dx, dy+dr*1.1, dx, dy+dr*1.3);
        ctx.bezierCurveTo(dx, dy+dr*1.1, dx+dr, dy+dr*0.7, dx+dr, dy+dr*0.2);
        ctx.bezierCurveTo(dx+dr, dy-dr*0.3, dx, dy-dr*0.3, dx, dy+dr*0.3);
        ctx.fill();
      } else {
        ctx.fillStyle = '#FDE68A';
        for (let p = 0; p < 5; p++) {
          const a1 = (p*72 - 90) * Math.PI/180, a2 = (p*72 - 54) * Math.PI/180;
          ctx.beginPath(); ctx.moveTo(dx, dy);
          ctx.lineTo(dx + dr*Math.cos(a1), dy + dr*Math.sin(a1));
          ctx.lineTo(dx + dr*0.4*Math.cos(a2), dy + dr*0.4*Math.sin(a2));
          ctx.closePath(); ctx.fill();
        }
      }
    });
  } else if (currentStyle === 'new12') {
    // 藍波雲：連續波浪邊框，用弧形序列構成封閉雲朵輪廓
    const rx = bl, ry = bt, rw = boxW, rh = boxH;
    const bump = Math.max(7, Math.min(18, rw * 0.032)); // 每個波浪弧半徑
    const lw = Math.max(2, 3 * s);

    // 沿一條邊畫連續弧形（交替上凸/下凸，形成波浪）
    // 從 (x0,y0) 到 (x1,y1)，凸出方向由 sign 決定（+1 或 -1）
    // 固定凸出到法線方向
    function wavyEdge(x0, y0, x1, y1, outwardSign) {
      const dx = x1-x0, dy = y1-y0;
      const len = Math.sqrt(dx*dx+dy*dy);
      const n = Math.max(2, Math.round(len/(bump*2)));
      // 法線方向（朝外）
      const nx = -dy/len * outwardSign;
      const ny =  dx/len * outwardSign;
      for (let i=0; i<n; i++) {
        const t1 = (i+1)/n;
        const ex = x0 + dx*t1, ey = y0 + dy*t1;
        const mx = x0 + dx*(i+0.5)/n + nx*bump;
        const my = y0 + dy*(i+0.5)/n + ny*bump;
        ctx.quadraticCurveTo(mx, my, ex, ey);
      }
    }

    // 圓角半徑（四角用弧銜接，確保圓潤）
    const cr = bump * 1.1;
    function buildWavyCloud() {
      ctx.beginPath();
      // 左上角 → 上邊起點
      ctx.moveTo(rx + cr, ry);
      // 上邊（向上凸，sign=-1）
      wavyEdge(rx+cr, ry, rx+rw-cr, ry, -1);
      // 右上圓角
      ctx.arcTo(rx+rw, ry, rx+rw, ry+cr, cr);
      // 右邊（向右凸，sign=-1）
      wavyEdge(rx+rw, ry+cr, rx+rw, ry+rh-cr, -1);
      // 右下圓角
      ctx.arcTo(rx+rw, ry+rh, rx+rw-cr, ry+rh, cr);
      // 下邊（向下凸，sign=1，從右到左方向 sign 反轉）
      wavyEdge(rx+rw-cr, ry+rh, rx+cr, ry+rh, -1);
      // 左下圓角
      ctx.arcTo(rx, ry+rh, rx, ry+rh-cr, cr);
      // 左邊（向左凸，sign=-1，從下到上）
      wavyEdge(rx, ry+rh-cr, rx, ry+cr, -1);
      // 左上圓角
      ctx.arcTo(rx, ry, rx+cr, ry, cr);
      ctx.closePath();
    }

    buildWavyCloud(); ctx.fill();
    ctx.strokeStyle = sty.border;
    ctx.lineWidth = lw;
    buildWavyCloud(); ctx.stroke();
  } else if (currentStyle === 'sum1') {
    // 夏日清涼：漸層背景 + 水滴/雪花點綴
    const sg = ctx.createLinearGradient(bl, bt, bl + boxW, bt + boxH);
    sg.addColorStop(0, '#B2F5EA'); sg.addColorStop(1, '#E0F7FA');
    ctx.fillStyle = sg;
    const sumR = 12 * s;
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, sumR); ctx.fill();
    ctx.strokeStyle = sty.border; ctx.lineWidth = Math.max(2, 6*s);
    ctx.beginPath(); ctx.roundRect(bl, bt, boxW, boxH, sumR); ctx.stroke();
    const drops = [{x:0.04,y:0.3},{x:0.96,y:0.3},{x:0.04,y:0.7},{x:0.96,y:0.7},{x:0.5,y:0.1},{x:0.5,y:0.88}];
    drops.forEach(d => {
      const dx = bl + boxW * d.x, dy = bt + boxH * d.y, dr = 5 * s;
      ctx.globalAlpha = op * 0.45; ctx.fillStyle = '#67E8F9';
      ctx.beginPath();
      ctx.moveTo(dx, dy - dr*1.3);
      ctx.bezierCurveTo(dx + dr*0.8, dy, dx + dr*0.8, dy + dr*0.6, dx, dy + dr*0.8);
      ctx.bezierCurveTo(dx - dr*0.8, dy + dr*0.6, dx - dr*0.8, dy, dx, dy - dr*1.3);
      ctx.fill();
    });
  } else if (currentStyle === 'pea1') {
    // 水蜜桃：底色框 + 像素風小水蜜桃
    ctx.fillRect(bl, bt, boxW, boxH); ctx.strokeRect(bl, bt, boxW, boxH);
    // 桃子大小固定（不隨 s 縮放），保證各裝置都看得到
    const ps = Math.max(4, Math.min(10, boxH * 0.045));
    const peachW = 4 * ps, peachH = 5 * ps;
    const peachPixels = [
      [1,0,'#A8E6A3'],[2,0,'#A8E6A3'],
      [0,1,'#FFBFA3'],[1,1,'#FF9A7B'],[2,1,'#FFBFA3'],[3,1,'#FFBFA3'],
      [0,2,'#FF8C66'],[1,2,'#FF7043'],[2,2,'#FF7043'],[3,2,'#FF8C66'],
      [0,3,'#FFBFA3'],[1,3,'#FF8C66'],[2,3,'#FF8C66'],[3,3,'#FFBFA3'],
      [1,4,'#FFCBA4'],[2,4,'#FFCBA4'],
    ];
    function drawPixelPeach(px, py) {
      ctx.globalAlpha = op * 0.42;
      peachPixels.forEach(([gx,gy,c2]) => {
        ctx.fillStyle = c2;
        ctx.fillRect(px + gx*ps, py + gy*ps, ps, ps);
      });
    }
    // LCG 偽隨機
    function seededRand(seed) {
      let sv = (Math.abs(Math.floor(seed)) * 1664525 + 1013904223) & 0x7FFFFFFF;
      return sv / 0x7FFFFFFF;
    }
    // 文字佔據區域（絕對座標）
    const lineOff = (lineH - metrics.height) / 2;
    const txtTop = bt + pad + lineOff;
    const txtBot = bt + pad + lines.length * lineH - lineOff;
    const txtL   = bl + pad * 0.8;
    const txtR   = bl + boxW - pad * 0.8;
    // 把框分成上下左右四個邊緣區塊，各放幾個桃子，保證數量
    const zones = [
      // 上方帶（框頂 ~ 文字頂）
      { x0: bl + pad*0.3, x1: bl+boxW-pad*0.3-peachW, y0: bt+pad*0.2, y1: txtTop-peachH*0.5 },
      // 下方帶（文字底 ~ 框底）
      { x0: bl + pad*0.3, x1: bl+boxW-pad*0.3-peachW, y0: txtBot+peachH*0.2, y1: bt+boxH-peachH-pad*0.2 },
      // 左側帶
      { x0: bl + 2, x1: txtL - peachW - 2, y0: bt+pad*0.3, y1: bt+boxH-peachH-pad*0.3 },
      // 右側帶
      { x0: txtR + 2, x1: bl+boxW-peachW-2, y0: bt+pad*0.3, y1: bt+boxH-peachH-pad*0.3 },
    ];
    let seed = 37;
    zones.forEach((z, zi) => {
      const zw = z.x1 - z.x0, zh = z.y1 - z.y0;
      if (zw < peachW || zh < peachH) return; // 空間不夠就跳過
      const count = Math.max(2, Math.floor((zw * zh) / (peachW * peachH * 3.5)));
      for (let i = 0; i < count; i++) {
        seed = (seed * 1664525 + 1013904223) & 0x7FFFFFFF;
        const px = z.x0 + seededRand(seed + zi*100) * zw;
        seed = (seed * 1664525 + 1013904223) & 0x7FFFFFFF;
        const py = z.y0 + seededRand(seed + zi*200) * zh;
        drawPixelPeach(px, py);
      }
    });
  } else if (currentStyle === 'new7' || currentStyle === 'school1') {
    // 信紙咖 / 信紙藍：底色 + 橫線（固定間距，線條多且不壓文字）
    ctx.fillRect(bl, bt, boxW, boxH); ctx.strokeRect(bl, bt, boxW, boxH);
    const lineColor = currentStyle === 'new7' ? 'rgba(168,144,120,0.4)' : 'rgba(96,165,250,0.35)';
    ctx.strokeStyle = lineColor; ctx.lineWidth = Math.max(0.8, 1.2*s);
    // 固定間距：約 fSize*0.75，確保行數夠多
    const lineSpacing = Math.max(8*s, fSize * 0.75);
    const marginX = pad * 0.6;
    for (let ly = bt + lineSpacing; ly < bt + boxH - 2; ly += lineSpacing) {
      // 檢查這條線是否落在文字行上（若是則跳過，避免壓字）
      const relY = ly - (bt + pad);
      const lineOffset2 = (lineH - metrics.height) / 2;
      let onText = false;
      for (let li = 0; li < lines.length; li++) {
        const textTop = li * lineH + lineOffset2;
        const textBot = textTop + metrics.height;
        if (relY >= textTop - 1 && relY <= textBot + 1) { onText = true; break; }
      }
      if (onText) continue;
      ctx.beginPath(); ctx.moveTo(bl + marginX, ly); ctx.lineTo(bl + boxW - marginX, ly); ctx.stroke();
    }
  } else {
    ctx.fillRect(bl, bt, boxW, boxH);
    ctx.strokeRect(bl, bt, boxW, boxH);
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle   = col;
  ctx.font = fSize + 'px ' + fontStr;

  // 垂直居中：以 ascent 為基準對齊，讓字形實際視覺區塊置中於框內
  // 垂直居中：框內正中間，用 alphabetic baseline + ascent 定位
  // boxH = blockH + pad*2，所以文字區塊頂部 = bt + pad
  // 再加上 (lineH - metrics.height)/2 讓每行文字在行高中垂直置中
  const lineOffset = (lineH - metrics.height) / 2;
  const startY = bt + pad + metrics.ascent + lineOffset;
  lines.forEach((l, i) => {
    let x = bl + pad;
    [...l].forEach(c => { ctx.fillText(c, x, startY + i * lineH); x += ctx.measureText(c).width + letterW; });
  });
  ctx.restore();
}

function drawAll() {
  if (!originalImg) return;
  const iw = originalImg.width, ih = originalImg.height;

  // 每次繪製前確保 smoothing 設定一致（不同裝置預設不同）
  exportCtx.imageSmoothingEnabled  = true;
  exportCtx.imageSmoothingQuality  = 'high';
  previewCtx.imageSmoothingEnabled = true;
  previewCtx.imageSmoothingQuality = 'high';

  exportCtx.clearRect(0, 0, iw, ih);
  exportCtx.drawImage(originalImg, 0, 0, iw, ih);
  drawCore(exportCtx, iw, ih);

  const pw = previewCanvas.width;
  const ph = previewCanvas.height;
  previewCtx.clearRect(0, 0, pw, ph);
  previewCtx.drawImage(exportCanvas, 0, 0, iw, ih, 0, 0, pw, ph);
}

function buildStyleBtn() {
  Object.keys(styleGroups).forEach(g => {
    const wrap = document.querySelector('[data-group="' + g + '"]');
    styleGroups[g].forEach(it => {
      const d = document.createElement('div');
      d.className = 'style-card'; d.dataset.style = it.key; d.innerText = it.name;
      d.onclick = () => { currentStyle = d.dataset.style; highLightStyle(); autoFontColor(); drawAll(); };
      wrap.append(d);
    });
  });
  highLightStyle(); autoFontColor();
}
function highLightStyle() { document.querySelectorAll('.style-card').forEach(d => d.classList.toggle('active', d.dataset.style === currentStyle)); }

function bindFontBtn() {
  document.querySelectorAll('.font-card').forEach(d => {
    d.onclick = async () => {
      const newFont = d.dataset.font;
      document.querySelectorAll('.font-card').forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      currentFont = newFont;
      await ensureFontLoaded(newFont);
      drawAll();
    };
  });
}

function autoFontColor() { textColor.value = styleMap[currentStyle].dark ? '#fff' : '#000'; }

function updateSliderValues() {
  boxOpacityValue.textContent  = Math.round(boxOpacity.value * 100) + '%';
  textSizeValue.textContent    = textSizeSlider.value + '%';
  bottomMarginValue.textContent = bottomMarginSlider.value + '%';
}

function bindAllEvent() {
  imageUpload.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = ev => {
      const img = new Image();
      img.onload = () => { originalImg = img; boxX = boxY = 0; setExportSize(); calcPreviewScale(); drawAll(); emptyHint.style.display = 'none'; downloadBtn.disabled = false; };
      img.src = ev.target.result;
    };
    fr.readAsDataURL(f);
  };
  resetPosition.onclick = () => { boxX = boxY = 0; drawAll(); };
  moveUp.onclick    = () => { boxY -= BASE.STEP; drawAll(); };
  moveDown.onclick  = () => { boxY += BASE.STEP; drawAll(); };
  moveLeft.onclick  = () => { boxX -= BASE.STEP; drawAll(); };
  moveRight.onclick = () => { boxX += BASE.STEP; drawAll(); };

  downloadBtn.onclick = async () => {
    exportCanvas.toBlob(async blob => {
      const filename = 'dialog_' + Date.now() + '.png';
      const file = new File([blob], filename, { type: 'image/png' });

      // Web Share API：iOS Safari 16.4+ / Android Chrome 支援直接分享/存相簿
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: '對話框圖片' });
          return;
        } catch (e) {
          if (e.name === 'AbortError') return; // 使用者取消，不 fallback
        }
      }

      // Fallback：傳統下載連結（桌面瀏覽器）
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.target = '_blank';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 500);
    }, 'image/png');
  };

  boxOpacity.addEventListener('input',       () => { updateSliderValues(); drawAll(); });
  textSizeSlider.addEventListener('input',   () => { updateSliderValues(); drawAll(); });
  bottomMarginSlider.addEventListener('input', () => { updateSliderValues(); drawAll(); });
  [dialogueText, textColor].forEach(el => el.oninput = drawAll);
}
</script>
</body>
</html>
