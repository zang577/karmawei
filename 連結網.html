<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#b9e3fd" />
  <title>KARMAWEI_</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 1.2px; }
    html, body { width: 100%; min-height: 100dvh; margin: 0; padding: 0; background-color: #b9e3fd; display: flex; justify-content: center; align-items: center; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sky-container {
      width: 100%; max-width: 480px; min-height: 85dvh; margin: 20px 16px;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 45%),
        radial-gradient(circle at 80% 60%, rgba(255, 255, 255, 0.9) 0%, transparent 50%),
        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 40%),
        linear-gradient(135deg, #a8d8fc 0%, #d8f0ff 50%, #eef6ff 100%);
      border-radius: 36px; border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 40px rgba(148, 163, 184, 0.25); padding: 28px 16px;
      display: flex; flex-direction: column; align-items: center;
    }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 400px; justify-items: center; }
    .card {
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border-radius: 14px; border: 1px solid var(--glass-border);
      padding: 8px 6px; display: flex; flex-direction: column; align-items: center;
      text-decoration: none; color: var(--text-main); box-shadow: var(--glass-shadow);
      width: 100%; max-width: 95px;
      transform: none !important; transition: none !important;
    }
    .card-img-wrapper {
      width: 48px; height: 48px; border-radius: 8px; margin-bottom: 5px;
      overflow: hidden; background: rgba(255,255,255,0.8);
      border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
    }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 0.72rem; font-weight: 600; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  </style>
</head>
