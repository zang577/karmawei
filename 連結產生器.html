<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KARMAWEI_</title>
  <!-- Cropper.js CSS (裁切工具) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 1.2px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    /* 3D 擬物風格低調藍天白雲背景質感 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.7) 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(186, 230, 253, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 960px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .controls {
      display: flex;
      gap: 20px; /* 確保兩個按鈕之間有舒適的間隔 */
      align-items: center;
      justify-content: center;
    }

    /* 全白液態玻璃 3D 擬物風格按鈕 */
    .btn {
      padding: 8px 20px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(148, 163, 184, 0.1), inset 0 1px 1px rgba(255, 255, 255, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(148, 163, 184, 0.18), inset 0 1px 2px rgba(255, 255, 255, 1);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: 10px;
    }

    /* 卡片網格與間距 */
    .grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }

    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--glass-shadow);
      transform: none !important;
      transition: none !important;
    }

    .card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 3px;
      z-index: 2;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      box-shadow: 0 2px 6px rgba(148, 163, 184, 0.1);
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: #ffffff;
      transform: scale(1.1);
    }

    .icon-btn.delete:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    /* Modal 視窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(148, 163, 184, 0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-sub);
    }

    .form-group input[type="text"],
    .form-group input[type="url"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255, 255, 255, 0.85);
      outline: none;
      font-size: 0.9rem;
    }

    .form-group input:focus {
      border-color: rgba(51, 65, 85, 0.4);
      background: #ffffff;
    }

    .file-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .crop-container {
      width: 100%;
      max-height: 240px;
      margin-top: 8px;
      background: rgba(0,0,0,0.05);
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .crop-container img {
      max-width: 100%;
      display: block;
    }

    .crop-actions {
      display: none;
      gap: 6px;
      margin-top: 8px;
      justify-content: flex-end;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    /* Toast 提示 */
    .toast {
      position: fixed;
      bottom: 24px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(148, 163, 184, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="controls">
        <button class="btn" id="addBtn">新增連結</button>
        <button class="btn" id="copyCodeBtn">複製代碼</button>
      </div>
    </header>

    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- 新增/編輯 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">新增連結</h2>
      <form id="cardForm">
        <input type="hidden" id="cardId">
        <div class="form-group">
          <label for="inputName">名稱</label>
          <input type="text" id="inputName" required />
        </div>
        <div class="form-group">
          <label for="inputUrl">網址</label>
          <input type="url" id="inputUrl" required />
        </div>
        <div class="form-group">
          <label>圖片</label>
          <div class="file-input-wrapper">
            <button type="button" class="btn btn-sm" onclick="document.getElementById('fileInput').click()">選擇手機/電腦圖片</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
          </div>
          <input type="url" id="inputImg" placeholder="或貼上圖片網址" />
          
          <div class="crop-container" id="cropContainer">
            <img id="cropImage" src="" alt="Cropper">
          </div>
          <div class="crop-actions" id="cropActions">
            <button type="button" class="btn btn-sm" id="rotateBtn">旋轉 90°</button>
            <button type="button" class="btn btn-sm" id="resetCropBtn">重置區塊</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">取消</button>
          <button type="submit" class="btn" id="saveBtn">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">複製成功</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    let cards = [];
    try {
      cards = JSON.parse(localStorage.getItem('generator_cards')) || [
        { id: '1', name: 'Google', url: 'https://www.google.com', img: 'https://www.google.com/favicon.ico' },
        { id: '2', name: 'GitHub', url: 'https://github.com', img: 'https://github.githubassets.com/favicons/favicon.png' }
      ];
    } catch(e) {
      cards = [
        { id: '1', name: 'Google', url: 'https://www.google.com', img: 'https://www.google.com/favicon.ico' },
        { id: '2', name: 'GitHub', url: 'https://github.com', img: 'https://github.githubassets.com/favicons/favicon.png' }
      ];
    }

    const cardGrid = document.getElementById('cardGrid');
    const addBtn = document.getElementById('addBtn');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const cardForm = document.getElementById('cardForm');
    const cancelBtn = document.getElementById('cancelBtn');
    const toast = document.getElementById('toast');
    
    const fileInput = document.getElementById('fileInput');
    const inputImg = document.getElementById('inputImg');
    const cropContainer = document.getElementById('cropContainer');
    const cropImage = document.getElementById('cropImage');
    const cropActions = document.getElementById('cropActions');
    const rotateBtn = document.getElementById('rotateBtn');
    const resetCropBtn = document.getElementById('resetCropBtn');

    let cropper = null;
    let originalRawImage = '';

    function saveLocal() {
      localStorage.setItem('generator_cards', JSON.stringify(cards));
    }

    function moveCard(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= cards.length) return;
      const temp = cards[index];
      cards[index] = cards[newIndex];
      cards[newIndex] = temp;
      saveLocal();
      render();
    }

    function render() {
      cardGrid.innerHTML = '';
      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        const imgSrc = card.croppedImg || card.img || `https://www.google.com/s2/favicons?domain=${card.url}&sz=128`;

        cardEl.innerHTML = `
          <div class="card-actions">
            ${index > 0 ? `<button class="icon-btn" onclick="moveCard(${index}, -1)" title="左移/前移">◄</button>` : ''}
            ${index < cards.length - 1 ? `<button class="icon-btn" onclick="moveCard(${index}, 1)" title="右移/後移">►</button>` : ''}
            <button class="icon-btn" onclick="editCard('${card.id}')">✏️</button>
            <button class="icon-btn delete" onclick="deleteCard('${card.id}')">✕</button>
          </div>
          <div class="card-img-wrapper">
            <img class="card-img" src="${imgSrc}" alt="${card.name}" onerror="this.src='https://via.placeholder.com/150/ffffff/808080?text=Link'">
          </div>
          <div class="card-title">${card.name}</div>
        `;
        cardGrid.appendChild(cardEl);
      });
    }

    function initCropper(imageSrc) {
      if (cropper) cropper.destroy();
      cropImage.src = imageSrc;
      cropContainer.style.display = 'block';
      cropActions.style.display = 'flex';

      cropper = new Cropper(cropImage, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 1,
        background: false,
        responsive: true
      });
    }

    function destroyCropper() {
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      cropContainer.style.display = 'none';
      cropActions.style.display = 'none';
      cropImage.src = '';
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          originalRawImage = event.target.result;
          inputImg.value = '';
          initCropper(originalRawImage);
        };
        reader.readAsDataURL(file);
      }
    });

    inputImg.addEventListener('change', () => {
      const url = inputImg.value.trim();
      if (url) {
        originalRawImage = url;
        initCropper(url);
      }
    });

    rotateBtn.addEventListener('click', () => { if (cropper) cropper.rotate(90); });
    resetCropBtn.addEventListener('click', () => { if (cropper) cropper.reset(); });

    function openModal(card = null) {
      modalOverlay.classList.add('active');
      destroyCropper();
      originalRawImage = '';

      if (card) {
        document.getElementById('modalTitle').textContent = '編輯連結';
        document.getElementById('cardId').value = card.id;
        document.getElementById('inputName').value = card.name;
        document.getElementById('inputUrl').value = card.url;
        document.getElementById('inputImg').value = card.img || '';
        originalRawImage = card.originalRawImage || card.img || card.croppedImg || '';
        if (originalRawImage) initCropper(originalRawImage);
      } else {
        document.getElementById('modalTitle').textContent = '新增連結';
        cardForm.reset();
        document.getElementById('cardId').value = '';
      }
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      cardForm.reset();
      destroyCropper();
    }

    window.editCard = function(id) {
      const card = cards.find(c => c.id === id);
      if (card) openModal(card);
    };

    window.deleteCard = function(id) {
      cards = cards.filter(c => c.id !== id);
      saveLocal();
      render();
    };

    cardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('cardId').value;
      const name = document.getElementById('inputName').value;
      const url = document.getElementById('inputUrl').value;
      const rawImgUrl = document.getElementById('inputImg').value;

      let croppedDataUrl = '';
      if (cropper) {
        croppedDataUrl = cropper.getCroppedCanvas({ width: 300, height: 300 }).toDataURL('image/jpeg', 0.85);
      }

      const finalOriginalImage = originalRawImage || rawImgUrl;

      if (id) {
        const card = cards.find(c => c.id === id);
        if (card) {
          card.name = name;
          card.url = url;
          card.img = rawImgUrl;
          card.croppedImg = croppedDataUrl || card.croppedImg;
          card.originalRawImage = finalOriginalImage;
        }
      } else {
        cards.push({
          id: Date.now().toString(),
          name,
          url,
          img: rawImgUrl,
          croppedImg: croppedDataUrl,
          originalRawImage: finalOriginalImage
        });
      }

      saveLocal();
      render();
      closeModal();
    });

    addBtn.addEventListener('click', () => openModal());
    cancelBtn.addEventListener('click', closeModal);

    // 生成最終產出的乾淨代碼
    copyCodeBtn.addEventListener('click', () => {
      const generatedHtml = `<!DOCTYPE html>

  <style>

      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
    }

    html, body { width: 100%; height: 100%; overflow-x: hidden; }

      background: var(--bg-gradient);

      padding: 24px 16px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255,
