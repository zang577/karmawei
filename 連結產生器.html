<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>連結產生器</title>

  <!-- Cropper.js CSS for image cropping -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

  <style>
    :root {
      --bg-color: #f3f5f8;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-btn-bg: rgba(255, 255, 255, 0.85);
      --glass-btn-hover: rgba(255, 255, 255, 0.98);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
      --glass-glow: rgba(255, 255, 255, 0.9);
      --text-main: #2d3748;
      --text-sub: #718096;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景流動光暈 (Liquid Background Blobs) */
    .liquid-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.7;
      animation: float 14s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .blob-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(224, 231, 255, 0.9) 0%, rgba(255, 255, 255, 0) 70%);
      top: -120px;
      left: -120px;
    }

    .blob-2 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(241, 245, 249, 1) 0%, rgba(226, 232, 240, 0) 70%);
      bottom: -180px;
      right: -120px;
      animation-delay: -7s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.08); }
    }

    .container {
      width: 100%;
      max-width: 1100px;
      z-index: 1;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      padding: 20px 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .header-title h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 22px;
      border: 1px solid var(--glass-border);
      background: var(--glass-btn-bg);
      color: var(--text-main);
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: var(--glass-btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 1);
      border-color: rgba(255, 255, 255, 1);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.5);
    }

    /* 網格與卡片排版 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 1280px) { .grid { grid-template-columns: repeat(6, 1fr); } }

    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 22px;
      border: 1px solid var(--glass-border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--glass-shadow);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 0 20px var(--glass-glow);
      border-color: rgba(255, 255, 255, 1);
    }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: all 0.2s;
    }

    .icon-btn:hover {
      transform: scale(1.15);
      background: #ffffff;
    }

    .icon-btn.delete:hover {
      background: var(--danger);
      color: white;
    }

    /* 圖片 1:1 正方形統一尺寸 + 裁切預覽展示 */
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 2px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-url {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.8;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      width: 100%;
      max-width: 460px;
      padding: 28px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.12);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 18px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .form-group input[type="text"],
    .form-group input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255, 255, 255, 0.7);
      outline: none;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: rgba(255, 255, 255, 1);
      background: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    /* 圖片上傳區塊 */
    .image-input-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-select-btn {
      width: 100%;
      position: relative;
      cursor: pointer;
    }

    .file-select-btn input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* 裁切容器 */
    .cropper-wrapper {
      width: 100%;
      height: 240px;
      background: #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
      position: relative;
    }

    .cropper-wrapper img {
      max-width: 100%;
      max-height: 100%;
    }

    .cropper-toolbar {
      display: none;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .cropper-toolbar .btn {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* Toast 提示通知 */
    .toast {
      position: fixed;
      bottom: 30px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: var(--text-main);
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="liquid-blob blob-1"></div>
  <div class="liquid-blob blob-2"></div>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>連結產生器</h1>
      </div>
      <div class="controls">
        <button class="btn" id="addBtn">新增連結</button>
        <button class="btn" id="copyCodeBtn">複製代碼</button>
      </div>
    </header>

    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- 新增/編輯 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">新增連結</h2>
      <form id="cardForm">
        <input type="hidden" id="cardId">
        
        <div class="form-group">
          <label for="inputName">名稱</label>
          <input type="text" id="inputName" required />
        </div>

        <div class="form-group">
          <label for="inputUrl">網址</label>
          <input type="url" id="inputUrl" required />
        </div>

        <div class="form-group">
          <label>圖片</label>
          <div class="image-input-container">
            <button type="button" class="btn file-select-btn">
              上傳手機/電腦照片
              <input type="file" id="fileInput" accept="image/*" />
            </button>
            <input type="url" id="inputImg" placeholder="或輸入圖片網址" />
          </div>

          <!-- 裁切視窗區塊 -->
          <div class="cropper-wrapper" id="cropperWrapper">
            <img id="cropperImage" src="" alt="Cropper target">
          </div>

          <!-- 裁切輔助工具列 -->
          <div class="cropper-toolbar" id="cropperToolbar">
            <button type="button" class="btn btn-secondary" id="rotateLeftBtn">↺ 旋轉</button>
            <button type="button" class="btn btn-secondary" id="rotateRightBtn">↻ 旋轉</button>
            <button type="button" class="btn btn-secondary" id="resetCropBtn">重置區塊</button>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
          <button type="submit" class="btn">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">複製成功</div>

  <!-- Cropper.js JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script>
    let cards = JSON.parse(localStorage.getItem('generator_cards_v2')) || [
      { id: '1', name: 'Google', url: 'https://www.google.com', img: 'https://www.google.com/favicon.ico', rawImg: 'https://www.google.com/favicon.ico' },
      { id: '2', name: 'YouTube', url: 'https://www.youtube.com', img: 'https://www.youtube.com/s/desktop/f5d23b12/img/favicon.ico', rawImg: 'https://www.youtube.com/s/desktop/f5d23b12/img/favicon.ico' },
      { id: '3', name: 'GitHub', url: 'https://github.com', img: 'https://github.githubassets.com/favicons/favicon.png', rawImg: 'https://github.githubassets.com/favicons/favicon.png' }
    ];

    let cropper = null;
    let currentRawImage = ''; // 儲存原始圖片（Base64 或 URL）以供二次編輯裁切

    const cardGrid = document.getElementById('cardGrid');
    const addBtn = document.getElementById('addBtn');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const cardForm = document.getElementById('cardForm');
    const cancelBtn = document.getElementById('cancelBtn');
    const toast = document.getElementById('toast');

    const fileInput = document.getElementById('fileInput');
    const inputImg = document.getElementById('inputImg');
    const cropperWrapper = document.getElementById('cropperWrapper');
    const cropperImage = document.getElementById('cropperImage');
    const cropperToolbar = document.getElementById('cropperToolbar');

    function saveLocal() {
      localStorage.setItem('generator_cards_v2', JSON.stringify(cards));
    }

    function render() {
      cardGrid.innerHTML = '';
      cards.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        const imgSrc = card.img && card.img.trim() !== '' 
          ? card.img 
          : `https://www.google.com/s2/favicons?domain=${card.url}&sz=128`;

        const displayUrl = card.url.replace(/^https?:\/\//, '').replace(/\/$/, '');

        cardEl.innerHTML = `
          <div class="card-actions">
            <button class="icon-btn" onclick="editCard('${card.id}')">✏️</button>
            <button class="icon-btn delete" onclick="deleteCard('${card.id}')">✕</button>
          </div>
          <div class="card-img-wrapper">
            <img class="card-img" src="${imgSrc}" alt="${card.name}" onerror="this.src='https://via.placeholder.com/150/ffffff/808080?text=Link'">
          </div>
          <div class="card-title">${card.name}</div>
          <div class="card-url">${displayUrl}</div>
        `;
        cardGrid.appendChild(cardEl);
      });
    }

    function initCropper(imageSrc) {
      currentRawImage = imageSrc;
      cropperImage.src = imageSrc;
      cropperWrapper.style.display = 'block';
      cropperToolbar.style.display = 'flex';

      if (cropper) {
        cropper.destroy();
      }

      cropper = new Cropper(cropperImage, {
        aspectRatio: 1, // 保持 1:1 正方形裁切框
        viewMode: 1,
        background: false,
        autoCropArea: 0.9,
        responsive: true
      });
    }

    function destroyCropper() {
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      cropperWrapper.style.display = 'none';
      cropperToolbar.style.display = 'none';
      cropperImage.src = '';
      currentRawImage = '';
    }

    // 處理手機/電腦檔案選擇
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          inputImg.value = ''; // 清空 URL 輸入
          initCropper(evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // 處理 URL 輸入變更
    inputImg.addEventListener('input', (e) => {
      const url = e.target.value.trim();
      if (url) {
        initCropper(url);
      } else if (!currentRawImage) {
        destroyCropper();
      }
    });

    // 旋轉與重置按鈕控制
    document.getElementById('rotateLeftBtn').addEventListener('click', () => cropper && cropper.rotate(-90));
    document.getElementById('rotateRightBtn').addEventListener('click', () => cropper && cropper.rotate(90));
    document.getElementById('resetCropBtn').addEventListener('click', () => cropper && cropper.reset());

    function openModal(card = null) {
      modalOverlay.classList.add('active');
      destroyCropper();

      if (card) {
        document.getElementById('modalTitle').textContent = '編輯連結';
        document.getElementById('cardId').value = card.id;
        document.getElementById('inputName').value = card.name;
        document.getElementById('inputUrl').value = card.url;
        
        const rawSrc = card.rawImg || card.img || '';
        if (rawSrc.startsWith('data:') || rawSrc.startsWith('http')) {
          if (!rawSrc.includes('favicons?domain=')) {
            inputImg.value = rawSrc.startsWith('http') && !rawSrc.startsWith('data:') ? rawSrc : '';
            initCropper(rawSrc);
          }
        }
      } else {
        document.getElementById('modalTitle').textContent = '新增連結';
        cardForm.reset();
        document.getElementById('cardId').value = '';
      }
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      cardForm.reset();
      destroyCropper();
    }

    window.editCard = function(id) {
      const card = cards.find(c => c.id === id);
      if (card) openModal(card);
    };

    window.deleteCard = function(id) {
      cards = cards.filter(c => c.id !== id);
      saveLocal();
      render();
    };

    cardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('cardId').value;
      const name = document.getElementById('inputName').value;
      const url = document.getElementById('inputUrl').value;

      let croppedDataUrl = '';
      if (cropper) {
        // 取得裁切後的圖片（輸出 300x300 正方形圖片以保持高清且輕量）
        croppedDataUrl = cropper.getCroppedCanvas({
          width: 300,
          height: 300
        }).toDataURL('image/jpeg', 0.85);
      } else {
        croppedDataUrl = inputImg.value.trim();
      }

      if (id) {
        const card = cards.find(c => c.id === id);
        if (card) {
          card.name = name;
          card.url = url;
          card.img = croppedDataUrl || card.img;
          if (currentRawImage) card.rawImg = currentRawImage;
        }
      } else {
        cards.push({
          id: Date.now().toString(),
          name,
          url,
          img: croppedDataUrl,
          rawImg: currentRawImage || croppedDataUrl
        });
      }

      saveLocal();
      render();
      closeModal();
    });

    addBtn.addEventListener('click', () => openModal());
    cancelBtn.addEventListener('click', closeModal);

    // 生成並複製乾淨的最終 HTML 代碼
    copyCodeBtn.addEventListener('click', () => {
      const generatedHtml = `<!DOCTYPE html>

    }

    .blob-2 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(241, 245, 249, 1) 0%, rgba(226, 232, 240, 0) 70%); bottom: -180px; right: -120px; animation-delay: -7s; }

      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 22px;
      border: 1px solid var(--glass-border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: var(--glass-shadow);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
      border-radius: 22px 22px 0 0;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 0 20px var(--glass-glow);
      border-color: rgba(255, 255, 255, 1);
    }
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      display: flex; align-items: center; justify-content: center;
    }
    .card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.3s ease;
    }
    .card:hover .card-img { transform: scale(1.05); }
    .card-title {
      font-size: 0.9rem; font-weight: 600; margin-bottom: 2px;
      text-align: center; width: 100%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .card-url {
      font-size: 0.75rem; color: var(--text-sub); text-align: center;
      width: 100%; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="liquid-blob blob-1"></div>
  <div class="liquid-blob blob-2"></div>
  <div class="container">
    <header><h1>常用網站導航</h1></header>
    <div class="grid">
${cards.map(c => {
  const imgSrc = c.img && c.img.trim() !== '' ? c.img : `https://www.google.com/s2/favicons?domain=${c.url}&sz=128`;
  const displayUrl = c.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
  return `      <a href="${c.url}" target="_blank" rel="noopener noreferrer" class="card">
        <div class="card-img-wrapper">
          <img class="card-img" src="${imgSrc}" alt="${c.name}" onerror="this.src='https://via.placeholder.com/150/ffffff/808080?text=Link'">
        </div>
        <div class="card-title">${c.name}</div>
        <div class="card-url">${displayUrl}</div>
      </a>`;
}).join('\n')}
    </div>
  </div>
</body>
</html>`;

      // 相容 GitHub iFrame 剪貼簿複製
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedHtml).then(() => showToast()).catch(() => fallbackCopy(generatedHtml));
      } else {
        fallbackCopy(generatedHtml);
      }
    });

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast();
    }

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    render();
  </script>
</body>
