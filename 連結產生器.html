<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#b9e3fd" />
  <title>KARMAWEI_</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 1.2px;
    }

    /* 關鍵修復：將 html 與 body 底色全面設為天空藍，徹底消除 Safari 彈跳時的任何白色區塊 */
    html, body {
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #b9e3fd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 60%, rgba(255, 255, 255, 0.9) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 35%),
        radial-gradient(ellipse at 10% 70%, rgba(255, 255, 255, 0.8) 0%, transparent 30%),
        linear-gradient(135deg, #b9e3fd 0%, #d8f0ff 50%, #eef6ff 100%);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      -webkit-overflow-scrolling: touch;
    }

    .container {
      width: 100%;
      max-width: 960px;
      z-index: 1;
    }

    .top-controls {
      text-align: center;
      margin-bottom: 24px;
    }

    .controls-box {
      display: inline-flex;
      gap: 16px;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .btn {
      padding: 8px 22px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .btn:hover {
      background: #ffffff;
    }

    /* 網格與放大後的卡片設定 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 650px;
      margin: 0 auto;
      justify-items: center;
    }

    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--glass-shadow);
      width: 100%;
      max-width: 145px;
      transform: none !important;
      transition: none !important;
    }

    .card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }

    /* 放大後的右上角三個小按鈕 */
    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(148, 163, 184, 0.15);
    }

    .icon-btn.delete:hover {
      background: var(--danger);
      color: white;
    }

    .card-img-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    /* Modal 視窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(148, 163, 184, 0.2);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-sub);
    }

    .form-group input[type="text"],
    .form-group input[type="url"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255, 255, 255, 0.85);
      outline: none;
      font-size: 0.9rem;
    }

    /* 圖片網址輸入框與上傳按鈕並排 */
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-row input {
      flex: 1;
    }

    .upload-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .upload-btn:hover {
      background: #ffffff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--glass-border);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(148, 163, 184, 0.15);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-controls">
      <div class="controls-box">
        <button class="btn" id="addBtn">新增連結</button>
        <button class="btn" id="copyCodeBtn">複製代碼</button>
      </div>
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- 新增/編輯 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle" style="margin-bottom:16px;font-size:1.1rem;">新增連結</h2>
      <form id="cardForm">
        <input type="hidden" id="cardId">
        <div class="form-group">
          <label>名稱</label>
          <input type="text" id="inputName" required />
        </div>
        <div class="form-group">
          <label>網址</label>
          <input type="url" id="inputUrl" required />
        </div>
        <div class="form-group">
          <label>連結網址圖片 URL:</label>
          <div class="input-row">
            <input type="url" id="inputImg" placeholder="https://example.com/image.jpg" required />
            <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">📷 上傳圖片</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">取消</button>
          <button type="submit" class="btn">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">複製成功</div>

  <script>
    var defaultCards = [
      { id: '1', name: 'Google', url: 'https://www.google.com', img: 'https://www.google.com/favicon.ico' },
      { id: '2', name: 'GitHub', url: 'https://github.com', img: 'https://github.githubassets.com/favicons/favicon.png' }
    ];

    var cards = [];

    function loadData() {
      try {
        var saved = localStorage.getItem('generator_cards_v23');
        if (saved) {
          var parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (err) {}
      return defaultCards;
    }

    function render() {
      var grid = document.getElementById('cardGrid');
      if (!grid) return;
      grid.innerHTML = '';
      
      if (!Array.isArray(cards)) {
        cards = defaultCards;
      }

      cards.forEach(function(card, index) {
        var el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = [
          '<div class="card-actions">',
            index > 0 ? '<button type="button" class="icon-btn" onclick="moveCard(' + index + ', -1)">◄</button>' : '',
            index < cards.length - 1 ? '<button type="button" class="icon-btn" onclick="moveCard(' + index + ', 1)">►</button>' : '',
            '<button type="button" class="icon-btn" onclick="editCard(\'' + card.id + '\')">✎</button>',
            '<button type="button" class="icon-btn delete" onclick="deleteCard(\'' + card.id + '\')">✕</button>',
          '</div>',
          '<div class="card-img-wrapper">',
            '<img class="card-img" src="' + card.img + '" alt="' + card.name + '" onerror="this.src=\'https://via.placeholder.com/72/ffffff/000000?text=Error\'">',
          '</div>',
          '<div class="card-title">' + card.name + '</div>'
        ].join('');
        grid.appendChild(el);
      });

      try {
        localStorage.setItem('generator_cards_v23', JSON.stringify(cards));
      } catch (e) {}
    }

    window.moveCard = function(index, direction) {
      var target = index + direction;
      if (target < 0 || target >= cards.length) return;
      var temp = cards[index];
      cards[index] = cards[target];
      cards[target] = temp;
      render();
    };

    window.deleteCard = function(id) {
      cards = cards.filter(function(c) { return c.id !== id; });
      render();
    };

    window.openModal = function(card) {
      var overlay = document.getElementById('modalOverlay');
      var title = document.getElementById('modalTitle');
      var idInput = document.getElementById('cardId');
      var nameInput = document.getElementById('inputName');
      var urlInput = document.getElementById('inputUrl');
      var imgInput = document.getElementById('inputImg');
      var form = document.getElementById('cardForm');

      if (!overlay || !form) return;

      overlay.classList.add('active');

      if (card) {
        title.textContent = '編輯連結';
        idInput.value = card.id;
        nameInput.value = card.name;
        urlInput.value = card.url;
        imgInput.value = card.img;
      } else {
        title.textContent = '新增連結';
        form.reset();
        idInput.value = '';
      }
    };

    window.closeModal = function() {
      var overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.classList.remove('active');
    };

    window.editCard = function(id) {
      var card = cards.find(function(c) { return c.id === id; });
      if (card) openModal(card);
    };

    document.getElementById('fileInput').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(event) {
          document.getElementById('inputImg').value = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('addBtn').onclick = function() { openModal(); };
    document.getElementById('cancelBtn').onclick = closeModal;

    document.getElementById('copyCodeBtn').onclick = function() {
      var html = [
'<!DOCTYPE html>',
'<html lang="zh-TW">',
'<head>',
'  <meta charset="UTF-8" />',
'  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />',
'  <meta name="theme-color" content="#b9e3fd" />',
'  <title>KARMAWEI_</title>',
'  <style>',
'    :root {',
'      --glass-bg: rgba(255, 255, 255, 0.75);',
'      --glass-border: rgba(255, 255, 255, 0.95);',
'      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.8);',
'      --text-main: #334155;',
'    }',
'    * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 1.2px; }',
'    html, body { width: 100%; min-height: 100dvh; margin: 0; padding: 0; background-color: #b9e3fd; }',
'    body {',
'      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;',
'      color: var(--text-main); display: flex; flex-direction: column; align-items: center;',
'      padding: 24px 16px;',
'      background-image: ',
'        radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 40%),',
'        radial-gradient(ellipse at 80% 60%, rgba(255, 255, 255, 0.9) 0%, transparent 45%),',
'        radial-gradient(ellipse at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 35%),',
'        radial-gradient(ellipse at 10% 70%, rgba(255, 255, 255, 0.8) 0%, transparent 30%),',
'        linear-gradient(135deg, #b9e3fd 0%, #d8f0ff 50%, #eef6ff 100%);',
'      background-repeat: no-repeat; background-size: cover; background-position: center;',
'      -webkit-overflow-scrolling: touch;',
'    }',
'    .container { max-width: 960px; margin: 0 auto; z-index: 1; position: relative; width: 100%; }',
'    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 650px; margin: 0 auto; justify-items: center; }',
'    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }',
'    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }',
'    .card {',
'      background: var(--glass-bg); backdrop-filter: blur(20px);',
'      border-radius: 18px; border: 1px solid var(--glass-border);',
'      padding: 12px 10px; display: flex; flex-direction: column; align-items: center;',
'      text-decoration: none; color: var(--text-main); box-shadow: var(--glass-shadow);',
'      width: 100%; max-width: 145px;',
'      transform: none !important; transition: none !important;',
'    }',
'    .card-img-wrapper {',
'      width: 72px; height: 72px; border-radius: 12px; margin-bottom: 8px;',
'      overflow: hidden; background: rgba(255,255,255,0.8);',
'      border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;',
'    }',
'    .card-img { width: 100%; height: 100%; object-fit: cover; }',
'    .card-title { font-size: 0.82rem; font-weight: 600; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }',
'  </style>',
'</head>',
'<body>',
'  <div class="container">',
'    <div class="grid">',
cards.map(function(c) {
  return [
'      <a href="' + c.url + '" target="_blank" class="card">',
'        <div class="card-img-wrapper"><img class="card-img" src="' + c.img + '" alt="' + c.name + '" onerror="this.src=\'https://via.placeholder.com/72/ffffff/000000?text=Error\'"></div>',
'        <div class="card-title">' + c.name + '</div>',
'      </a>'
  ].join('\n');
}).join('\n'),
'    </div>',
'  </div>',
'</body>',
'</html>'
      ].join('\n');

      navigator.clipboard.writeText(html).then(function() {
        var toast = document.getElementById('toast');
        if (toast) {
          toast.classList.add('show');
          setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }
      });
    };

    document.getElementById('cardForm').onsubmit = function(e) {
      e.preventDefault();
      var id = document.getElementById('cardId').value;
      var name = document.getElementById('inputName').value;
      var url = document.getElementById('inputUrl').value;
      var img = document.getElementById('inputImg').value;

      if (id) {
        var card = cards.find(function(c) { return c.id === id; });
        if (card) {
          card.name = name;
          card.url = url;
          card.img = img;
        }
      } else {
        cards.push({ id: Date.now().toString(), name, url, img });
      }
      render();
      closeModal();
    };

    cards = loadData();
    render();
  </script>
</body>
</html>
