<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KARMAWEI_</title>
  <!-- Cropper.js CSS (裁切工具) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 1.2px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    /* 3D 擬物風格低調藍天白雲背景質感 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.7) 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(186, 230, 253, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 960px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .controls {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    /* 全白液態玻璃 3D 擬物風格按鈕 */
    .btn {
      padding: 8px 22px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(148, 163, 184, 0.1), inset 0 1px 1px rgba(255, 255, 255, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(148, 163, 184, 0.18), inset 0 1px 2px rgba(255, 255, 255, 1);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: 10px;
    }

    /* 卡片網格與間距 */
    .grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }

    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--glass-shadow);
      transform: none !important;
      transition: none !important;
    }

    .card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 3px;
      z-index: 2;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      box-shadow: 0 2px 6px rgba(148, 163, 184, 0.1);
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: #ffffff;
      transform: scale(1.1);
    }

    .icon-btn.delete:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    /* Modal 視窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(148, 163, 184, 0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-sub);
    }

    .form-group input[type="text"],
    .form-group input[type="url"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255, 255,
