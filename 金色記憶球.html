<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金色記憶球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noto Sans TC：SIL OFL 授權，可商用 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e9eaec;--bg2:#cfd2d6;--glass:rgba(255,255,255,.42);--glass-b:rgba(255,255,255,.7);
  --text:#3b3f45;--sub:#7b8088;--accent:#8d939b;--shadow:rgba(60,66,76,.18);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3a3d42;--bg2:#2a2c30;--glass:rgba(255,255,255,.12);--glass-b:rgba(255,255,255,.25);--text:#ececee;--sub:#a9adb4;--accent:#b8bcc4;--shadow:rgba(0,0,0,.4)}
}
*{box-sizing:border-box;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(var(--safe-t) + 20px)}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);
  background:radial-gradient(circle at 15% 10%,#fff8 0,transparent 40%),radial-gradient(circle at 85% 80%,#fff6 0,transparent 45%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;padding:var(--safe-t) 0 var(--safe-b)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:10px 0 2px;text-align:center;font-weight:700}
.sub{text-align:center;color:var(--sub);font-size:13px;margin:0 0 12px}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:26px;
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:0 10px 30px var(--shadow),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.2)}
.preview{position:sticky;top:calc(var(--safe-t) + 8px);z-index:10;padding:10px;margin-bottom:16px}
.stage{width:min(100%,42vh,440px);aspect-ratio:1;margin:0 auto;border-radius:20px;overflow:hidden;background:#04070d;position:relative}
.stage.clear{background:repeating-conic-gradient(#bbb 0 25%,#ddd 0 50%) 0 0/20px 20px}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hint{text-align:center;font-size:12px;color:var(--sub);margin:8px 0 0}
.panel{padding:18px;margin-bottom:16px}
.row{margin-bottom:14px}
.row label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.row label span{color:var(--sub)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:rgba(120,126,134,.3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(#fff,#e2e4e7);border:1px solid #fff;box-shadow:0 2px 8px var(--shadow)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #fff;box-shadow:0 2px 8px var(--shadow)}
button,.btn{font:inherit;color:var(--text);cursor:pointer;border:1px solid var(--glass-b);border-radius:18px;padding:13px 16px;
  background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.3));box-shadow:0 4px 14px var(--shadow),inset 0 1px 0 #fff;
  font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s}
button:active,.btn:active{transform:scale(.97)}
.full{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px}
.seg button.on{background:linear-gradient(#8d939b,#6f757d);color:#fff;border-color:#9aa0a8}
.primary{background:linear-gradient(#9097a0,#6c727b);color:#fff;border-color:#a9aeb5}
.up{position:relative;overflow:hidden}
.up input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.seg button{padding:10px 4px;font-size:14px}
#refl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#refl button{min-width:0;padding:10px 2px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:10px 18px;border-radius:16px;font-size:14px;transition:.3s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <section class="glass preview">
    <div class="stage" id="stage"><canvas id="c" width="1080" height="1080"></canvas></div>
  </section>

  <section class="glass panel">
    <div class="grid">
      <label class="btn up">上傳圖片<input type="file" id="file" accept="image/*"></label>
      <button id="save">下載圖片</button>
    </div>
  </section>

  <section class="glass panel">
    <div class="row"><label>縮放 <span id="vz">1.00</span></label><input type="range" id="zoom" min="0.5" max="4" step="0.01" value="1"></div>
    <div class="row"><label>水平位置 <span id="vx">0</span></label><input type="range" id="ox" min="-100" max="100" step="1" value="0"></div>
    <div class="row"><label>垂直位置 <span id="vy">0</span></label><input type="range" id="oy" min="-100" max="100" step="1" value="0"></div>
    <div class="row"><label>旋轉 <span id="vr">0°</span></label><input type="range" id="rot" min="-180" max="180" step="1" value="0"></div>
    <div class="row"><label>金黃色調 <span id="vt">90</span></label><input type="range" id="tint" min="0" max="100" step="1" value="90"></div>
    <div class="row"><label>外圍光暈 <span id="vg">80</span></label><input type="range" id="glow" min="0" max="100" step="1" value="80"></div>
    <div class="row"><label>邊緣漸層 <span id="ve">70</span></label><input type="range" id="edge" min="0" max="100" step="1" value="70"></div>
    <div class="row"><label>反光強度 <span id="vs">80</span></label><input type="range" id="rs" min="0" max="100" step="1" value="80"></div>
    <div class="row"><label>反光樣式</label>
      <div class="seg" id="refl"><button data-r="soft" class="on">柔光</button><button data-r="arc">雙弧</button><button data-r="spot">光斑</button><button data-r="top">頂光</button><button data-r="left">左弧</button><button data-r="band">光帶</button><button data-r="tophaze">頂部霧光</button><button data-r="tlbloom">左上暈光</button><button data-r="trrim">右上緣光</button><button data-r="floor">地面暖光</button><button data-r="rimhaze">全緣霧光</button><button data-r="sides">雙側緣光</button><button data-r="bokeh">散景光點</button><button data-r="tlarc">左上弧暈</button><button data-r="core">內核暖光</button><button data-r="vfade">上下漸霧</button><button data-r="ledge">左緣細光</button><button data-r="tedge">上緣亮帶</button><button data-r="lilac">粉紫暈</button><button data-r="bl">左下暖輝</button><button data-r="toporange">頂部橘暈</button><button data-r="water">水面漣漪</button><button data-r="rain">雨絲光</button><button data-r="diag">對角柔光</button><button data-r="none">無</button></div></div>
    <div class="row"><label>背景</label>
      <div class="seg"><button id="bgd" class="on">深色</button><button id="bgc">透明</button></div></div>
    <button class="full" id="reset">恢復預設</button>
  </section>

</div>
<div class="toast glass" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const W=1080,CX=540,CY=540,R=330,D=360;
const off=document.createElement('canvas');off.width=off.height=D;
const octx=off.getContext('2d',{willReadFrequently:true});
let img=null,dark=true;
const ids=['zoom','ox','oy','rot','tint','glow','edge','rs'];
const def={zoom:1,ox:0,oy:0,rot:0,tint:90,glow:80,edge:70,rs:80};

const lerp=(a,b,t)=>a+(b-a)*t;
const C0=[196,108,22],C1=[250,196,84],C2=[255,244,190];

function drawPhoto(){
  octx.clearRect(0,0,D,D);
  const z=+$('zoom').value,iw=img.width,ih=img.height;
  const s=D/Math.min(iw,ih)*z;
  octx.save();
  octx.translate(D/2+$('ox').value/100*D/2,D/2+$('oy').value/100*D/2);
  octx.rotate($('rot').value*Math.PI/180);
  octx.scale(s,s);
  octx.imageSmoothingQuality='high';
  octx.drawImage(img,-iw/2,-ih/2);
  octx.restore();
  // 轉成黃色調漸層映射
  const a=+$('tint').value/100;
  const d=octx.getImageData(0,0,D,D),p=d.data,q=new Uint8ClampedArray(p);
  const h=D/2;
  for(let y=0;y<D;y++)for(let x=0;x<D;x++){
    const u=(x-h)/h,v=(y-h)/h,r=Math.sqrt(u*u+v*v),i=(y*D+x)*4;
    let sx=x,sy=y;
    if(r>0&&r<1){const k=(.72+.28*r*r);sx=Math.round(h+u*k*h);sy=Math.round(h+v*k*h)}
    const j=(sy*D+sx)*4;
    if(!q[j+3]){p[i+3]=0;continue}
    let l=(.299*q[j]+.587*q[j+1]+.114*q[j+2])/255;
    l=Math.min(1,Math.max(0,(l-.5)*.85+.58));
    const t=l<.5?l*2:(l-.5)*2,A=l<.5?C0:C1,B=l<.5?C1:C2;
    for(let c=0;c<3;c++)p[i+c]=lerp(q[j+c],lerp(A[c],B[c],t),a);
    p[i+3]=q[j+3];
  }
  octx.putImageData(d,0,0);
}

function radial(x,y,r0,r1,stops,r0x=x,r0y=y){
  const g=ctx.createRadialGradient(r0x,r0y,r0,x,y,r1);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;
}

let refl='soft';
function softArc(r,a0,a1,w,al){
  ctx.save();ctx.lineCap='round';ctx.shadowColor='rgba(255,248,210,.9)';ctx.shadowBlur=26;
  for(let i=0;i<6;i++){ctx.strokeStyle=`rgba(255,250,222,${al})`;ctx.lineWidth=w*(1-i*.12);
    ctx.beginPath();ctx.arc(CX,CY,r,a0+i*.045,a1-i*.045);ctx.stroke()}
  ctx.restore();
}
function crescent(a0,a1,al){
  const m=(a0+a1)/2,ox=-Math.cos(m)*R*.07,oy=-Math.sin(m)*R*.07;
  ctx.save();ctx.shadowColor='rgba(255,248,210,.95)';ctx.shadowBlur=34;ctx.fillStyle=`rgba(255,250,225,${al})`;
  ctx.beginPath();ctx.arc(CX,CY,R*.93,a0,a1);ctx.arc(CX+ox,CY+oy,R*.89,a1-.05,a0+.05,true);ctx.closePath();ctx.fill();ctx.restore();
}
function sparkle(x,y,r,al){
  ctx.save();ctx.translate(x,y);
  [[1,.07],[.07,1]].forEach(([sx,sy])=>{ctx.save();ctx.scale(sx,sy);
    ctx.fillStyle=radial(0,0,0,r,[[0,`rgba(255,255,255,${.95*al})`],[.4,`rgba(255,250,225,${.4*al})`],[1,'rgba(255,250,225,0)']]);
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.restore()});
  ctx.restore();
}
function blob(x,y,r,col,sx=1,sy=1,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,sy);
  ctx.fillStyle=radial(0,0,0,r,[[0,col],[1,col.replace(/[\d.]+\)$/,'0)')]]);
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawRefl(){ctx.save();ctx.globalAlpha=+$('rs').value/100;drawReflRaw();ctx.restore()}
function drawReflRaw(){
  if(refl==='none')return;
  if(refl==='soft'){
    ctx.save();ctx.translate(CX+R*.42,CY+R*.5);ctx.rotate(.78);ctx.scale(1,.38);
    ctx.fillStyle=radial(0,0,0,R*.6,[[0,'rgba(255,250,225,.5)'],[.55,'rgba(255,245,200,.18)'],[1,'rgba(255,245,200,0)']]);
    ctx.beginPath();ctx.arc(0,0,R*.6,0,Math.PI*2);ctx.fill();ctx.restore();
    softArc(R*.9,.3,.95,22,.05);
  }else if(refl==='moon'){
    ctx.save();ctx.shadowColor='rgba(255,248,210,.95)';ctx.shadowBlur=34;ctx.fillStyle='rgba(255,250,225,.4)';
    ctx.beginPath();ctx.arc(CX,CY,R*.93,.05,1.35);ctx.arc(CX-R*.07,CY-R*.07,R*.89,1.3,.1,true);ctx.closePath();ctx.fill();ctx.restore();
  }else if(refl==='arc'){
    softArc(R*.9,.15,1.2,16,.08);softArc(R*.78,.45,1.0,9,.07);
  }else if(refl==='window'){
    ctx.save();ctx.translate(CX-R*.38,CY-R*.34);ctx.rotate(-.5);ctx.shadowColor='rgba(255,250,225,.9)';ctx.shadowBlur=18;
    ctx.fillStyle='rgba(255,252,235,.32)';const w=R*.2,g=R*.045;
    [[-1,-1],[0,-1],[-1,0],[0,0]].forEach(([i,j])=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(i*(w+g)+g/2,j*(w+g)+g/2,w,w,12):ctx.rect(i*(w+g)+g/2,j*(w+g)+g/2,w,w);ctx.fill()});
    ctx.restore();
  }else if(refl==='star'){
    ctx.save();ctx.translate(CX-R*.46,CY-R*.46);
    [[1,.07],[.07,1]].forEach(([sx,sy])=>{ctx.save();ctx.scale(sx,sy);
      ctx.fillStyle=radial(0,0,0,R*.4,[[0,'rgba(255,255,255,.95)'],[.4,'rgba(255,250,225,.4)'],[1,'rgba(255,250,225,0)']]);
      ctx.beginPath();ctx.arc(0,0,R*.4,0,Math.PI*2);ctx.fill();ctx.restore()});
    ctx.restore();
  }else if(refl==='ring'){
    softArc(R*.93,0,Math.PI*2,16,.07);
  }else if(refl==='top'){
    ctx.save();ctx.translate(CX,CY-R*.6);ctx.scale(1,.3);
    ctx.fillStyle=radial(0,0,0,R*.65,[[0,'rgba(255,255,255,.6)'],[.6,'rgba(255,252,235,.2)'],[1,'rgba(255,252,235,0)']]);
    ctx.beginPath();ctx.arc(0,0,R*.65,0,Math.PI*2);ctx.fill();ctx.restore();
  }else if(refl==='twin'){
    crescent(.05,1.35,.38);crescent(Math.PI+.05,Math.PI+1.05,.26);
  }else if(refl==='left'){
    softArc(R*.9,2.35,3.95,18,.08);
  }else if(refl==='band'){
    ctx.save();ctx.translate(CX-R*.05,CY-R*.08);ctx.rotate(-.7);
    const g=ctx.createLinearGradient(0,-R*.28,0,R*.28);
    g.addColorStop(0,'rgba(255,252,232,0)');g.addColorStop(.5,'rgba(255,252,232,.32)');g.addColorStop(1,'rgba(255,252,232,0)');
    ctx.fillStyle=g;ctx.fillRect(-R,-R*.28,R*2,R*.56);ctx.restore();
  }else if(refl==='bottom'){
    blob(CX,CY+R*.72,R*.7,'rgba(255,250,215,.7)',1,.35);
  }else if(refl==='drop'){
    blob(CX-R*.4,CY-R*.42,R*.32,'rgba(255,255,255,.75)',.42,1,.62);
    blob(CX-R*.52,CY-R*.1,R*.06,'rgba(255,255,255,.8)');
  }else if(refl==='iri'){
    blob(CX+R*.55,CY+R*.55,R*.75,'rgba(255,170,205,.26)');
    blob(CX-R*.55,CY+R*.5,R*.65,'rgba(185,165,255,.24)');
    blob(CX+R*.1,CY-R*.7,R*.5,'rgba(150,215,255,.16)');
  }else if(refl==='twinstar'){
    sparkle(CX-R*.46,CY-R*.46,R*.4,1);sparkle(CX+R*.42,CY+R*.4,R*.22,.85);
  }else if(refl==='dust'){
    [[-.5,-.45,.08],[-.2,-.7,.05],[.3,-.55,.06],[.6,-.1,.05],[.55,.35,.07],[.05,.5,.05],[-.45,.25,.06],[-.7,-.05,.04],[.2,.1,.04],[-.1,-.2,.05],[.35,.65,.04],[-.3,.62,.05]]
      .forEach(([x,y,r])=>blob(CX+R*x,CY+R*y,R*r,'rgba(255,255,240,.85)'));
  }else if(refl==='focus'){
    blob(CX-R*.15,CY-R*.15,R*.6,'rgba(255,255,240,.5)');
  }else if(refl==='inner'){
    softArc(R*.78,0,Math.PI*2,10,.07);
  }else if(refl==='tophaze'){
    blob(CX,CY-R*.8,R*.85,'rgba(255,255,248,.95)',1.15,.5);blob(CX,CY-R*.66,R*.5,'rgba(255,255,255,.7)',1,.4);
  }else if(refl==='tlbloom'){
    blob(CX-R*.42,CY-R*.45,R*.7,'rgba(255,255,245,.85)',1,.8,-.6);blob(CX-R*.5,CY-R*.52,R*.28,'rgba(255,255,255,.9)');
  }else if(refl==='trrim'){
    softArc(R*.92,-1.25,-.2,24,.07);blob(CX+R*.55,CY-R*.55,R*.4,'rgba(255,250,215,.3)',.7,1,.8);
  }else if(refl==='floor'){
    blob(CX,CY+R*.8,R*1.0,'rgba(255,250,205,.98)',1,.42);blob(CX,CY+R*.5,R*.65,'rgba(255,245,170,.5)',1,.6);
  }else if(refl==='rimhaze'){
    ctx.fillStyle=radial(CX,CY,R*.55,R,[[0,'rgba(255,250,225,0)'],[.7,'rgba(255,250,225,.2)'],[1,'rgba(255,252,235,.55)']]);
    ctx.fillRect(CX-R,CY-R,R*2,R*2);
  }else if(refl==='sides'){
    blob(CX-R*.92,CY,R*.65,'rgba(255,255,240,.95)',.55,1.4);blob(CX+R*.92,CY-R*.05,R*.65,'rgba(255,255,240,.95)',.55,1.4);
  }else if(refl==='bokeh'){
    [[-.45,-.45,.3,.7],[.1,-.62,.2,.6],[.5,-.3,.26,.55],[-.1,-.1,.16,.4],[.35,.2,.2,.4],[-.55,.2,.2,.5]]
      .forEach(([x,y,r,a])=>blob(CX+R*x,CY+R*y,R*r,`rgba(255,255,245,${a})`));
  }else if(refl==='tlarc'){
    softArc(R*.88,3.5,5.0,40,.05);softArc(R*.88,3.7,4.8,16,.07);
  }else if(refl==='core'){
    blob(CX,CY+R*.2,R*.65,'rgba(255,242,170,.6)');blob(CX,CY+R*.25,R*.3,'rgba(255,252,215,.5)');
  }else if(refl==='vfade'){
    const g=ctx.createLinearGradient(0,CY-R,0,CY+R);
    g.addColorStop(0,'rgba(255,252,228,.5)');g.addColorStop(.5,'rgba(255,252,228,0)');g.addColorStop(1,'rgba(255,244,180,.45)');
    ctx.fillStyle=g;ctx.fillRect(CX-R,CY-R,R*2,R*2);
  }else if(refl==='ledge'){
    softArc(R*.95,2.4,3.9,34,.07);softArc(R*.96,2.55,3.75,8,.28);
  }else if(refl==='tedge'){
    softArc(R*.95,-2.55,-.6,34,.07);softArc(R*.96,-2.35,-.8,8,.26);
  }else if(refl==='lilac'){
    blob(CX+R*.72,CY+R*.5,R*.75,'rgba(205,175,255,.65)');blob(CX+R*.55,CY+R*.75,R*.5,'rgba(255,175,205,.5)');blob(CX-R*.1,CY-R*.85,R*.45,'rgba(190,175,255,.35)',1.4,.6);
  }else if(refl==='bl'){
    blob(CX-R*.6,CY+R*.65,R*.75,'rgba(255,244,175,.9)');blob(CX-R*.55,CY+R*.7,R*.3,'rgba(255,255,230,.8)');
  }else if(refl==='toporange'){
    blob(CX,CY-R*.85,R*1.0,'rgba(215,105,28,.55)',1.25,.62);
  }else if(refl==='water'){
    blob(CX,CY+R*.48,R*.85,'rgba(255,246,190,.8)',1,.24);
    ctx.save();ctx.shadowColor='rgba(255,250,220,.9)';ctx.shadowBlur=10;ctx.lineWidth=3;
    [[.55,.1,.4],[.4,.07,.5],[.25,.04,.6]].forEach(([rx,ry,a])=>{ctx.strokeStyle=`rgba(255,252,225,${a})`;ctx.beginPath();ctx.ellipse(CX,CY+R*.5,R*rx,R*ry,0,0,Math.PI*2);ctx.stroke()});ctx.restore();
  }else if(refl==='rain'){
    ctx.save();ctx.shadowColor='rgba(255,250,220,.8)';ctx.shadowBlur=6;ctx.lineCap='round';ctx.lineWidth=2.5;
    for(let i=0;i<42;i++){const x=CX+R*(((i*53)%100)/50-1)*.92,y=CY+R*(((i*37)%100)/50-1)*.8,l=R*(.08+((i*17)%10)/100);
      ctx.strokeStyle=`rgba(255,252,230,${.2+((i*7)%5)/20})`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-l*.15,y+l);ctx.stroke()}
    ctx.restore();
  }else if(refl==='diag'){
    const g=ctx.createLinearGradient(CX-R,CY-R,CX+R*.3,CY+R*.3);
    g.addColorStop(0,'rgba(255,255,245,.85)');g.addColorStop(.5,'rgba(255,252,230,.25)');g.addColorStop(1,'rgba(255,252,230,0)');
    ctx.fillStyle=g;ctx.fillRect(CX-R,CY-R,R*2,R*2);
  }else if(refl==='spot'){
    [[.45,.42,.2,.5],[.2,.62,.1,.4],[.62,.18,.07,.35]].forEach(([x,y,r,a])=>{
      ctx.fillStyle=radial(CX+R*x,CY+R*y,0,R*r,[[0,`rgba(255,250,225,${a})`],[1,'rgba(255,250,225,0)']]);
      ctx.beginPath();ctx.arc(CX+R*x,CY+R*y,R*r,0,Math.PI*2);ctx.fill()});
  }
}
$('refl').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;refl=b.dataset.r;
  [...$('refl').children].forEach(x=>x.classList.toggle('on',x===b));render();
});
function render(){
  ctx.clearRect(0,0,W,W);
  if(dark){ctx.fillStyle=radial(CX,CY,0,W*.75,[[0,'#0b1220'],[1,'#02040a']]);ctx.fillRect(0,0,W,W)}
  const gl=+$('glow').value/100;
  // 外圍光暈：金橘 → 粉 → 淡紫
  ctx.fillStyle=radial(CX,CY,R*.85,R*1.62,[[0,`rgba(255,215,95,${.95*gl})`],[.18,`rgba(255,185,70,${.6*gl})`],[.4,`rgba(255,150,120,${.38*gl})`],[.65,`rgba(175,140,255,${.22*gl})`],[1,'rgba(160,130,255,0)']]);
  ctx.fillRect(0,0,W,W);

  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();
  // 琥珀底色
  ctx.fillStyle=radial(CX,CY-30,0,R,[[0,'#ffe08a'],[.65,'#fabb3c'],[1,'#e9892a']]);
  ctx.fillRect(CX-R,CY-R,R*2,R*2);
  if(img){drawPhoto();ctx.globalAlpha=.88;ctx.imageSmoothingQuality='high';ctx.drawImage(off,CX-R,CY-R,R*2,R*2);ctx.globalAlpha=1}
  // 金色罩染：邊緣較深，像厚玻璃
  ctx.fillStyle=radial(CX,CY,0,R,[[0,'rgba(255,225,130,.22)'],[.7,'rgba(250,190,70,.2)'],[1,'rgba(235,140,30,.3)']]);
  ctx.fillRect(CX-R,CY-R,R*2,R*2);
  ctx.fillStyle='rgba(255,226,140,.16)';ctx.fillRect(CX-R,CY-R,R*2,R*2);
  // 底部聚光（玻璃折射的暖光）
  ctx.fillStyle=radial(CX,CY+R*.62,0,R*.75,[[0,'rgba(255,246,190,.75)'],[1,'rgba(255,230,140,0)']]);
  ctx.fillRect(CX-R,CY-R,R*2,R*2);
  // 邊緣漸層：橘黃 → 黃 → 淡黃白 → 白（柔和過渡）
  const e=+$('edge').value/100,k=Math.min(1,e*1.3);
  ctx.fillStyle=radial(CX,CY,R*(.92-.4*e),R,[[0,'rgba(255,165,35,0)'],[.3,`rgba(255,172,45,${.34*k})`],[.6,`rgba(255,214,85,${.5*k})`],[.85,`rgba(255,244,190,${.76*k})`],[1,`rgba(255,255,248,${.95*k})`]]);
  ctx.fillRect(CX-R,CY-R,R*2,R*2);
  drawRefl();
  ctx.restore();

  // 外緣細光環
  ctx.save();ctx.shadowColor='rgba(255,240,180,.9)';ctx.shadowBlur=14;ctx.strokeStyle=`rgba(255,248,215,${.4*k})`;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();ctx.restore();


  if(!img){ctx.fillStyle='rgba(90,50,5,.55)';ctx.font='500 38px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillText('請上傳照片',CX,CY+12)}
}

function sync(){
  $('vz').textContent=(+$('zoom').value).toFixed(2);$('vx').textContent=$('ox').value;$('vy').textContent=$('oy').value;
  $('vr').textContent=$('rot').value+'°';$('vt').textContent=$('tint').value;$('vg').textContent=$('glow').value;$('ve').textContent=$('edge').value;$('vs').textContent=$('rs').value;
  render();
}
ids.forEach(i=>$(i).addEventListener('input',sync));
let isDefault=true;
$('reset').onclick=()=>{ids.forEach(i=>$(i).value=def[i]);if(isDefault)$('oy').value=30;sync()};

$('file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onerror=()=>toast('無法讀取檔案');
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      try{img=im;isDefault=false;ids.forEach(i=>$(i).value=def[i]);sync();toast('圖片已載入')}
      catch(err){toast('處理失敗：'+err.message)}
    };
    im.onerror=()=>toast('不支援此圖片格式');
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
  e.target.value='';
});

// 背景切換
function setBg(d){dark=d;$('bgd').classList.toggle('on',d);$('bgc').classList.toggle('on',!d);$('stage').classList.toggle('clear',!d);render()}
$('bgd').onclick=()=>setBg(true);$('bgc').onclick=()=>setBg(false);

// 拖曳 / 滾輪
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!drag||!img)return;
  const k=W/cv.getBoundingClientRect().width;
  const f=v=>Math.max(-100,Math.min(100,v));
  $('ox').value=f(+$('ox').value+(e.clientX-drag.x)*k/R*100);
  $('oy').value=f(+$('oy').value+(e.clientY-drag.y)*k/R*100);
  drag={x:e.clientX,y:e.clientY};sync();
});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null;cv.style.cursor='grab'}));
cv.addEventListener('wheel',e=>{e.preventDefault();$('zoom').value=Math.max(.5,Math.min(4,+$('zoom').value-e.deltaY*.002));sync()},{passive:false});

// 儲存 / 下載
function getBlob(){return new Promise(r=>cv.toBlob(r,'image/png'))}
async function save(){
  if(!img){toast('請先上傳圖片');return}
  const b=await getBlob(),file=new File([b],'金色記憶球.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'金色記憶球'});return}catch(e){if(e.name==='AbortError')return}
  }
  download(b);
}
function download(b){
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='金色記憶球.png';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('已下載圖片');
}
$('save').onclick=save;
