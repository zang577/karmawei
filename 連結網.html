<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網站導航</title>
  <style>
    :root {
      --bg-color: #f3f5f8;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
      --glass-glow: rgba(255, 255, 255, 0.9);
      --text-main: #2d3748;
      --text-sub: #718096;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }
    .liquid-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.7;
      animation: float 14s infinite alternate ease-in-out;
      pointer-events: none;
    }
    .blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(224, 231, 255, 0.9) 0%, rgba(255, 255, 255, 0) 70%); top: -120px; left: -120px; }
    .blob-2 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(241, 245, 249, 1) 0%, rgba(226, 232, 240, 0) 70%); bottom: -180px; right: -120px; animation-delay: -7s; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 50px) scale(1.08); } }
    .container { width: 100%; max-width: 1100px; z-index: 1; }
    header {
      margin-bottom: 30px;
      padding: 20px 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      text-align: center;
    }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 1280px) { .grid { grid-template-columns: repeat(6, 1fr); } }
    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 22px;
      border: 1px solid var(--glass-border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: var(--glass-shadow);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
      border-radius: 22px 22px 0 0;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 0 20px var(--glass-glow);
      border-color: rgba(255, 255, 255, 1);
    }
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      display: flex; align-items: center; justify-content: center;
    }
    .card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.3s ease;
    }
    .card:hover .card-img { transform: scale(1.05); }
    .card-title {
      font-size: 0.9rem; font-weight: 600; margin-bottom: 2px;
      text-align: center; width: 100%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .card-url {
      font-size: 0.75rem; color: var(--text-sub); text-align: center;
      width: 100%; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; opacity: 0.8;
    }
  </style>
</head>
