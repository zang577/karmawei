  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 1.2px; }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 60%, rgba(255, 255, 255, 0.9) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 35%),
        radial-gradient(ellipse at 10% 70%, rgba(255, 255, 255, 0.8) 0%, transparent 30%),
        linear-gradient(135deg, #b9e3fd 0%, #d8f0ff 50%, #eef6ff 100%);
      background-attachment: fixed; background-size: cover; color: var(--text-main);
      display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
    }
    .container { max-width: 960px; margin: 0 auto; z-index: 1; position: relative; width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 650px; margin: 0 auto; justify-items: center; }
    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card {
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border-radius: 18px; border: 1px solid var(--glass-border);
      padding: 12px 10px; display: flex; flex-direction: column; align-items: center;
      text-decoration: none; color: var(--text-main); box-shadow: var(--glass-shadow);
      width: 100%; max-width: 145px;
      transform: none !important; transition: none !important;
    }
    .card-img-wrapper {
      width: 72px; height: 72px; border-radius: 12px; margin-bottom: 8px;
      overflow: hidden; background: rgba(255,255,255,0.8);
      border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
    }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 0.82rem; font-weight: 600; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  </style>
