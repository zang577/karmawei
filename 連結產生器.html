<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>連結產生器</title>
  <!-- Cropper.js CSS (裁切工具) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <style>
    :root {
      --bg-color: #f0f2f5;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    /* 背景流動光暈 */
    .liquid-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      animation: float 12s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(219, 234, 254, 1) 0%, rgba(255, 255, 255, 0) 70%);
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(243, 244, 246, 1) 0%, rgba(229, 231, 235, 0) 70%);
      bottom: -150px;
      right: -100px;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.08); }
    }

    .container {
      width: 100%;
      max-width: 1100px;
      z-index: 1;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      padding: 20px 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .header-title h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    /* 全白液態玻璃風格按鈕 */
    .btn {
      padding: 10px 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 1);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 10px;
    }

    /* 網格與卡片排版 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 1280px) { .grid { grid-template-columns: repeat(6, 1fr); } }

    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--glass-shadow);
      overflow: hidden;
    }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: #ffffff;
      transform: scale(1.1);
    }

    .icon-btn.delete:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    /* 正方形裁切圖片容器 (修正產生器內圖片過大問題) */
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 2px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal 視窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      width: 100%;
      max-width: 460px;
      padding: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .form-group input[type="text"],
    .form-group input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.75);
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: rgba(0, 0, 0, 0.3);
      background: #ffffff;
    }

    .file-input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    /* 裁切預覽區域 */
    .crop-container {
      width: 100%;
      max-height: 280px;
      margin-top: 10px;
      background: rgba(0,0,0,0.05);
      border-radius: 14px;
      overflow: hidden;
      display: none;
    }

    .crop-container img {
      max-width: 100%;
      display: block;
    }

    .crop-actions {
      display: none;
      gap: 8px;
      margin-top: 8px;
      justify-content: flex-end;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* Toast 提示通知 */
    .toast {
      position: fixed;
      bottom: 30px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="liquid-blob blob-1"></div>
  <div class="liquid-blob blob-2"></div>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>連結產生器</h1>
      </div>
      <div class="controls">
        <button class="btn" id="addBtn">新增連結</button>
        <button class="btn" id="copyCodeBtn">複製代碼</button>
      </div>
    </header>

    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- 新增/編輯 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">新增連結</h2>
      <form id="cardForm">
        <input type="hidden" id="cardId">
        <div class="form-group">
          <label for="inputName">名稱</label>
          <input type="text" id="inputName" required />
        </div>
        <div class="form-group">
          <label for="inputUrl">網址</label>
          <input type="url" id="inputUrl" required />
        </div>
        <div class="form-group">
          <label>圖片</label>
          <div class="file-input-wrapper">
            <button type="button" class="btn btn-sm" onclick="document.getElementById('fileInput').click()">選擇手機/電腦圖片</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
          </div>
          <input type="url" id="inputImg" placeholder="或貼上圖片網址" />
          
          <!-- 圖片裁切畫布容器 -->
          <div class="crop-container" id="cropContainer">
            <img id="cropImage" src="" alt="Cropper">
          </div>
          <div class="crop-actions" id="cropActions">
            <button type="button" class="btn btn-sm" id="rotateBtn">旋轉 90°</button>
            <button type="button" class="btn btn-sm" id="resetCropBtn">重置區塊</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">取消</button>
          <button type="submit" class="btn" id="saveBtn">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">複製成功</div>

  <!-- Cropper.js JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    let cards = JSON.parse(localStorage.getItem('generator_cards')) || [];

    const cardGrid = document.getElementById('cardGrid');
    const addBtn = document.getElementById('addBtn');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const cardForm = document.getElementById('cardForm');
    const cancelBtn = document.getElementById('cancelBtn');
    const toast = document.getElementById('toast');
    
    const fileInput = document.getElementById('fileInput');
    const inputImg = document.getElementById('inputImg');
    const cropContainer = document.getElementById('cropContainer');
    const cropImage = document.getElementById('cropImage');
    const cropActions = document.getElementById('cropActions');
    const rotateBtn = document.getElementById('rotateBtn');
    const resetCropBtn = document.getElementById('resetCropBtn');

    let cropper = null;
    let originalRawImage = ''; // 保存原始未裁切圖片

    function saveLocal() {
      localStorage.setItem('generator_cards', JSON.stringify(cards));
    }

    function render() {
      cardGrid.innerHTML = '';
      cards.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        const imgSrc = card.croppedImg || card.img || `https://www.google.com/s2/favicons?domain=${card.url}&sz=128`;

        cardEl.innerHTML = `
          <div class="card-actions">
            <button class="icon-btn" onclick="editCard('${card.id}')">✏️</button>
            <button class="icon-btn delete" onclick="deleteCard('${card.id}')">✕</button>
          </div>
          <div class="card-img-wrapper">
            <img class="card-img" src="${imgSrc}" alt="${card.name}" onerror="this.src='https://via.placeholder.com/150/ffffff/808080?text=Link'">
          </div>
          <div class="card-title">${card.name}</div>
        `;
        cardGrid.appendChild(cardEl);
      });
    }

    function initCropper(imageSrc) {
      if (cropper) {
        cropper.destroy();
      }
      cropImage.src = imageSrc;
      cropContainer.style.display = 'block';
      cropActions.style.display = 'flex';

      cropper = new Cropper(cropImage, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 1,
        background: false,
        responsive: true
      });
    }

    function destroyCropper() {
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      cropContainer.style.display = 'none';
      cropActions.style.display = 'none';
      cropImage.src = '';
    }

    // 處理手機/電腦 本地圖片上傳
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          originalRawImage = event.target.result;
          inputImg.value = '';
          initCropper(originalRawImage);
        };
        reader.readAsDataURL(file);
      }
    });

    // 處理貼上 URL 圖片
    inputImg.addEventListener('change', () => {
      const url = inputImg.value.trim();
      if (url) {
        originalRawImage = url;
        initCropper(url);
      }
    });

    rotateBtn.addEventListener('click', () => {
      if (cropper) cropper.rotate(90);
    });

    resetCropBtn.addEventListener('click', () => {
      if (cropper) cropper.reset();
    });

    function openModal(card = null) {
      modalOverlay.classList.add('active');
      destroyCropper();
      originalRawImage = '';

      if (card) {
        document.getElementById('modalTitle').textContent = '編輯連結';
        document.getElementById('cardId').value = card.id;
        document.getElementById('inputName').value = card.name;
        document.getElementById('inputUrl').value = card.url;
        document.getElementById('inputImg').value = card.img || '';
        originalRawImage = card.originalRawImage || card.img || card.croppedImg || '';
        
        if (originalRawImage) {
          initCropper(originalRawImage);
        }
      } else {
        document.getElementById('modalTitle').textContent = '新增連結';
        cardForm.reset();
        document.getElementById('cardId').value = '';
      }
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      cardForm.reset();
      destroyCropper();
    }

    window.editCard = function(id) {
      const card = cards.find(c => c.id === id);
      if (card) openModal(card);
    };

    window.deleteCard = function(id) {
      cards = cards.filter(c => c.id !== id);
      saveLocal();
      render();
    };

    cardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('cardId').value;
      const name = document.getElementById('inputName').value;
      const url = document.getElementById('inputUrl').value;
      const rawImgUrl = document.getElementById('inputImg').value;

      let croppedDataUrl = '';
      if (cropper) {
        croppedDataUrl = cropper.getCroppedCanvas({
          width: 400,
          height: 400
        }).toDataURL('image/jpeg', 0.88);
      }

      const finalOriginalImage = originalRawImage || rawImgUrl;

      if (id) {
        const card = cards.find(c => c.id === id);
        if (card) {
          card.name = name;
          card.url = url;
          card.img = rawImgUrl;
          card.croppedImg = croppedDataUrl || card.croppedImg;
          card.originalRawImage = finalOriginalImage;
        }
      } else {
        cards.push({
          id: Date.now().toString(),
          name,
          url,
          img: rawImgUrl,
          croppedImg: croppedDataUrl,
          originalRawImage: finalOriginalImage
        });
      }

      saveLocal();
      render();
      closeModal();
    });

    addBtn.addEventListener('click', () => openModal());
    cancelBtn.addEventListener('click', closeModal);

    // 生成最終 HTML 代碼
    copyCodeBtn.addEventListener('click', () => {
      const generatedHtml = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KARMAWEI_</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
      --text-main: #2c3e50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }
    .liquid-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      animation: float 12s infinite alternate ease-in-out;
      pointer-events: none;
    }
    .blob-1 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(219, 234, 254, 1) 0%, rgba(255, 255, 255, 0) 70%); top: -100px; left: -100px; }
    .blob-2 { width: 550px; height: 550px; background: radial-gradient(circle, rgba(243, 244, 246, 1) 0%, rgba(229, 231, 235, 0) 70%); bottom: -150px; right: -100px; animation-delay: -6s; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 40px) scale(1.08); } }
    .container { width: 100%; max-width: 1100px; z-index: 1; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 1280px) { .grid { grid-template-columns: repeat(6, 1fr); } }
    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      /* 點擊不位移 */
      transform: none !important;
      transition: none !important;
    }
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
    }
    .card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .card-title {
      font-size: 0.95rem; font-weight: 600; margin-top: 2px;
      text-align: center; width: 100%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="liquid-blob blob-1"></div>
  <div class="liquid-blob blob-2"></div>
  <div class="container">
    <div class="grid">
${cards.map(c => {
  const imgSrc = c.croppedImg || c.img || `https://www.google.com/s2/favicons?domain=${c.url}&sz=128`;
  return `      <a href="${c.url}" target="_blank" rel="noopener noreferrer" class="card">
        <div class="card-img-wrapper">
          <img class="card-img" src="${imgSrc}" alt="${c.name}" onerror="this.src='https://via.placeholder.com/150/ffffff/808080?text=Link'">
        </div>
        <div class="card-title">${c.name}</div>
      </a>`;
}).join('\n')}
    </div>
  </div>
</body>
</html>`;

      navigator.clipboard.writeText(generatedHtml).then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      });
    });

    render();
  </script>
</body>
</html>
