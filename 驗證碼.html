<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>驗證碼產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Anton&family=Architects+Daughter&family=Baloo+2:wght@500;600;700;800&family=Bangers&family=Caveat:wght@600;700&family=Comfortaa:wght@600;700&family=Fredoka:wght@500;600;700&family=Kalam:wght@400;700&family=Luckiest+Guy&family=Noto+Sans+TC:wght@300;400;500;600;700;800;900&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Pacifico&family=Patrick+Hand&family=Permanent+Marker&family=Poppins:wght@600;700;800&family=Righteous&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#e6e8eb;
    --bg-2:#f3f4f6;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.78);
    --glass-border:rgba(255,255,255,0.92);
    --ink:#34383c;
    --ink-soft:#787e84;
    --accent:#585d64;
    --accent-soft:rgba(88,93,100,0.10);
    --shadow:rgba(28,32,36,0.14);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1:#1b1c1e;
      --bg-2:#242527;
      --glass:rgba(255,255,255,0.07);
      --glass-strong:rgba(255,255,255,0.12);
      --glass-border:rgba(255,255,255,0.16);
      --ink:#edeef0;
      --ink-soft:#9a9ea3;
      --accent:#c6c9cd;
      --accent-soft:rgba(255,255,255,0.09);
      --shadow:rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg-1:#1b1c1e;
    --bg-2:#242527;
    --glass:rgba(255,255,255,0.07);
    --glass-strong:rgba(255,255,255,0.12);
    --glass-border:rgba(255,255,255,0.16);
    --ink:#edeef0;
    --ink-soft:#9a9ea3;
    --accent:#c6c9cd;
    --accent-soft:rgba(255,255,255,0.09);
    --shadow:rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
    color:var(--ink);
    background:var(--bg-1);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    z-index:0;
    pointer-events:none;
    opacity:.55;
  }
  body::before{
    width:420px;height:420px;
    top:-120px;left:-140px;
    background:radial-gradient(circle, #c9cdd2, transparent 70%);
  }
  body::after{
    width:380px;height:380px;
    bottom:-140px;right:-120px;
    background:radial-gradient(circle, #dfe1e4, transparent 70%);
  }
  :root[data-theme="dark"] body::before,
  :root[data-theme="dark"] body::after{opacity:.25;}

  .shell{
    max-width:480px;
    margin:0 auto;
    position:relative;
    z-index:1;
    min-height:100vh;
  }

  /* 頂部懸浮預覽區 */
  .preview-zone{
    position:sticky;
    top:0;
    z-index:10;
    padding:16px 16px 12px;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border-bottom:1px solid var(--glass-border);
    box-shadow:0 8px 24px var(--shadow);
  }
  .canvas-frame{
    position:relative;
    width:100%;
    aspect-ratio:3/1;
    border-radius:0;
    overflow:hidden;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px var(--shadow);
  }
  .canvas-frame canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .preview-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .btn{
    appearance:none;
    border:1px solid var(--glass-border);
    background:var(--glass-strong);
    color:var(--ink);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:10px 14px;
    border-radius:var(--radius-sm);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 2px 8px var(--shadow);
  }
  .btn:active{transform:scale(.96);}
  .btn.primary{
    background:var(--ink);
    color:var(--bg-2);
    border-color:var(--ink);
  }
  .btn.primary#downloadBtn{
    background:#ffffff;
    color:#2b2f33;
    border-color:rgba(0,0,0,0.10);
    letter-spacing:.12em;
  }
  .btn.ghost{flex:0 0 auto;}
  .btn.primary{flex:1;}
  .btn svg{width:16px;height:16px;flex:none;}

  /* 可捲動內容區 */
  .content{
    padding:20px 16px 48px;
    position:relative;
    z-index:1;
  }
  .card{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:0 4px 16px var(--shadow);
    margin-bottom:16px;
  }
  .card h2{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 10px;
    letter-spacing:.03em;
  }
  .text-input{
    width:100%;
    border:1px solid var(--glass-border);
    background:var(--glass-strong);
    color:var(--ink);
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    outline:none;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.06);
  }
  .text-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  .style-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    min-width:0;
  }

  .style-btn{
    border:1.5px solid var(--glass-border);
    background:var(--glass-strong);
    border-radius:var(--radius-sm);
    padding:6px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    min-width:0;
    max-width:100%;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
  }
  .style-btn canvas{
    width:100%;
    min-width:0;
    max-width:100%;
    aspect-ratio:16/10;
    border-radius:8px;
    display:block;
  }
  .style-btn span{
    font-size:10px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }
  .style-btn:active{transform:scale(.95);}
  .style-btn.active{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .style-btn.active span{color:var(--ink);}

  .font-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .font-btn{
    flex:0 0 auto;
    border:1.5px solid var(--glass-border);
    background:var(--glass-strong);
    border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
  }
  .font-btn .fname{
    font-size:13px;
    line-height:1;
    color:var(--ink);
    white-space:nowrap;
  }
  .font-btn:active{transform:scale(.95);}
  .font-btn.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .font-btn.active .fname{color:var(--ink);font-weight:700;}

  @media (min-width:481px){
    .shell{
      margin-top:24px;
      min-height:calc(100vh - 24px);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 20px 60px var(--shadow);
      margin-bottom:24px;
    }
    .preview-zone{top:0;border-radius:28px 28px 0 0;}
  }
</style>
</head>
<body>
<div class="shell">
<div id="fontPreload" aria-hidden="true" style="position:fixed;left:-9999px;top:-9999px;opacity:0;pointer-events:none;white-space:nowrap;font-size:10px;"></div>

  <div class="preview-zone">
    <div class="canvas-frame">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div class="preview-actions">
      <button class="btn ghost" id="shuffleBtn" aria-label="換一個樣式變化">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      </button>
      <button class="btn primary" id="downloadBtn">
        下載圖片
      </button>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <h2>輸入文字</h2>
      <input class="text-input" id="textInput" maxlength="14" placeholder="輸入想產生的文字" value="歲月靜好">
    </div>

    <div class="card">
      <div class="style-grid" id="styleRow"></div>
    </div>

    <div class="card">
      <h2>字型</h2>
      <div class="font-grid" id="fontGrid"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 可重現的隨機數產生器 ---------- */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hexToRgba(hex, alpha){
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16);
    const g = parseInt(c.substring(2,4),16);
    const b = parseInt(c.substring(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  const CJK_RE = /[\u3400-\u9FFF\u3040-\u30FF\uF900-\uFAFF]/;

  /* ---------- 色票組合 ---------- */
  const PAL = {
    rainbow: ['#e4572e','#f3a712','#3a86ff','#2f9e44','#c2255c','#7048e8','#087f8c'],
    pastelRainbow: ['#e07a5f','#3d5a80','#81b29a','#f2cc8f','#9d4edd','#118ab2'],
    neon: ['#ff5da2','#7dd3fc','#facc15','#a3e635','#c084fc'],
    earth: ['#7a4a2b','#8a5a3b','#5e3a20','#93602f'],
    inkDark: ['#2b2f33','#3d2b56','#1f4b3f','#4a2c17','#2a3d66'],
    navy: ['#22304a','#1c2c40'],
  };

  /* ---------- 背景產生函式 ---------- */
  function bgGradientMesh(ctx,w,h,rng){
    ctx.fillStyle = '#f1efe9'; ctx.fillRect(0,0,w,h);
    const blobs = ['#ffd6a5','#caffbf','#a0c4ff','#ffadad','#bdb2ff','#fdffb6'];
    for(let i=0;i<5;i++){
      const cx=rng()*w, cy=rng()*h, r=(0.35+rng()*0.55)*Math.max(w,h);
      const col=blobs[Math.floor(rng()*blobs.length)];
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,hexToRgba(col,0.5));
      g.addColorStop(1,hexToRgba(col,0));
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }
  }
  function bgDotHalftone(ctx,w,h,rng){
    ctx.fillStyle = '#e9e9ec'; ctx.fillRect(0,0,w,h);
    const step = h/9;
    for(let y=step/2;y<h;y+=step){
      for(let x=step/2;x<w;x+=step){
        const jx=x+(rng()-0.5)*step*0.4, jy=y+(rng()-0.5)*step*0.4;
        const rad=step*0.16+rng()*step*0.14;
        ctx.beginPath();
        ctx.arc(jx,jy,rad,0,Math.PI*2);
        ctx.fillStyle = `rgba(70,75,80,${0.10+rng()*0.16})`;
        ctx.fill();
      }
    }
  }
  function bgDiagonalStripe(ctx,w,h,rng){
    ctx.fillStyle='#f4f1ec'; ctx.fillRect(0,0,w,h);
    const stripeColors=['#e7dfce','#e0e8e2','#e3e0ea','#efe6d8'];
    ctx.save();
    const diag=Math.sqrt(w*w+h*h);
    ctx.translate(w/2,h/2); ctx.rotate(-0.4); ctx.translate(-diag/2,-diag/2);
    let x=0;
    while(x<diag){
      const sw = diag*0.06 + rng()*diag*0.05;
      ctx.fillStyle = stripeColors[Math.floor(rng()*stripeColors.length)];
      ctx.fillRect(x,0,sw,diag);
      x+=sw;
    }
    ctx.restore();
  }
  function bgGridPaper(ctx,w,h,rng){
    ctx.fillStyle = '#f6efe2'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(140,120,90,0.22)';
    ctx.lineWidth=1;
    const step=h/7;
    for(let x=0;x<=w;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(let y=0;y<=h;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  }
  function bgNoiseStatic(ctx,w,h,rng){
    ctx.fillStyle = '#232527'; ctx.fillRect(0,0,w,h);
    const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.7);
    g.addColorStop(0,'rgba(80,85,92,0.5)'); g.addColorStop(1,'rgba(20,22,24,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    const n = Math.floor(w*h/26);
    for(let i=0;i<n;i++){
      const x=rng()*w, y=rng()*h, s=rng()*1.6;
      ctx.fillStyle = `rgba(255,255,255,${rng()*0.18})`;
      ctx.fillRect(x,y,s,s);
    }
  }
  function bgBubbleWave(ctx,w,h,rng){
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#bcdff2'); g.addColorStop(1,'#8fc4e6');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    for(let b=0;b<3;b++){
      const baseY=h*(0.25+b*0.28);
      ctx.beginPath();
      ctx.moveTo(0,baseY);
      for(let x=0;x<=w;x+=w/12){
        const yy=baseY+Math.sin(x*0.02+b*2+rng())* (h*0.05);
        ctx.lineTo(x,yy);
      }
      ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
      ctx.fillStyle=`rgba(255,255,255,${0.10+b*0.06})`;
      ctx.fill();
    }
    for(let i=0;i<10;i++){
      ctx.beginPath();
      ctx.arc(rng()*w, rng()*h, rng()*6+2, 0, Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.15+rng()*0.25})`;
      ctx.fill();
    }
  }
  function bgConfetti(ctx,w,h,rng){
    ctx.fillStyle='#f4eef2'; ctx.fillRect(0,0,w,h);
    const colors=['#f3c4d3','#c9e4de','#f6e27a','#c6def1','#dbcdf0'];
    for(let i=0;i<28;i++){
      const x=rng()*w, y=rng()*h, s=6+rng()*10;
      ctx.save();
      ctx.translate(x,y); ctx.rotate(rng()*Math.PI);
      ctx.fillStyle=colors[Math.floor(rng()*colors.length)];
      const shape=Math.floor(rng()*3);
      ctx.beginPath();
      if(shape===0){ ctx.arc(0,0,s*0.4,0,Math.PI*2); }
      else if(shape===1){ ctx.rect(-s*0.4,-s*0.2,s*0.8,s*0.4); }
      else { ctx.moveTo(0,-s*0.4); ctx.lineTo(s*0.4,s*0.3); ctx.lineTo(-s*0.4,s*0.3); ctx.closePath(); }
      ctx.fill();
      ctx.restore();
    }
  }
  function bgCrosshatch(ctx,w,h,rng){
    ctx.fillStyle='#efe9de'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(60,70,90,0.16)';
    ctx.lineWidth=1;
    const step=h/9;
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip();
    for(let x=-h;x<w+h;x+=step){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+h,h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+h,0); ctx.lineTo(x,h); ctx.stroke();
    }
    ctx.restore();
  }
  function bgOcean(ctx,w,h,rng){
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#3fc1e0'); g.addColorStop(0.5,'#17a3d6'); g.addColorStop(1,'#0868a8');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    for(let b=0;b<4;b++){
      const baseY=h*(0.18+b*0.24);
      ctx.beginPath();
      ctx.moveTo(0,baseY);
      for(let x=0;x<=w;x+=w/14){
        const yy=baseY+Math.sin(x*0.03+b*1.7+rng()*2)*(h*0.045);
        ctx.lineTo(x,yy);
      }
      ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
      ctx.fillStyle=`rgba(255,255,255,${0.10+b*0.05})`;
      ctx.fill();
    }
    for(let i=0;i<14;i++){
      ctx.beginPath();
      ctx.arc(rng()*w, rng()*h, rng()*4+1.5, 0, Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.15+rng()*0.3})`;
      ctx.fill();
    }
  }

  // 海洋：只保留幅度小的幾何波浪線，數量少、偏透明，畫在文字上方
  function oceanOverlay(ctx,w,h,rng){
    ctx.save();
    ctx.lineCap='round';
    ctx.lineJoin='round';
    const deep='rgba(8,58,92,', light='rgba(255,255,255,';
    const n = 3+Math.floor(rng()*2);
    for(let i=0;i<n;i++){
      const y0 = h*(0.10+rng()*0.80);
      const amp = h*(0.010+rng()*0.016);
      const wl = w/(3.5+rng()*3.5);
      const ph = rng()*Math.PI*2;
      const xs = rng()*w*0.5, xe = Math.min(w, xs + w*(0.35+rng()*0.45));
      ctx.beginPath();
      for(let x=xs;x<=xe;x+=2){
        const yy = y0+Math.sin((x/wl)*Math.PI*2+ph)*amp;
        if(x===xs) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.strokeStyle = (rng()<0.5?deep:light)+(0.16+rng()*0.12).toFixed(2)+')';
      ctx.lineWidth = 1+rng()*0.9;
      ctx.stroke();
    }
    ctx.restore();
  }

  function bgForest(ctx,w,h,rng){
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#bfe89a'); g.addColorStop(1,'#7fc157');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    const leafGreens=['#8fd15f','#a8e072','#c3ee94','#6fb349','#d8f0a8'];
    // 短短小小的線條（取代原本的碎小橢圓色塊）
    ctx.lineCap='round';
    for(let i=0;i<46;i++){
      const x=rng()*w, y=rng()*h, len=4+rng()*9, ang=rng()*Math.PI*2;
      ctx.strokeStyle=leafGreens[Math.floor(rng()*leafGreens.length)];
      ctx.globalAlpha=0.6+rng()*0.35;
      ctx.lineWidth=0.9+rng()*1.3;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(ang)*len, y+Math.sin(ang)*len);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    for(let i=0;i<7;i++){
      const x=rng()*w;
      const barH=h*(0.18+rng()*0.35);
      const y=rng()*(h-barH);
      ctx.fillStyle='rgba(120,90,50,0.20)';
      ctx.fillRect(x, y, w*0.015+rng()*3.5, barH);
    }
  }
  function drawGrassBlades(ctx,w,h,rng,count){
    const blades=['#4c8a34','#5fa53f','#3d7228','#6fb84a'];
    for(let i=0;i<count;i++){
      const x=rng()*w, y=h*(0.1+rng()*0.9);

      const dirAngle = -Math.PI/2 + (rng()-0.5)*Math.PI*0.9;
      const tipX = x + Math.cos(dirAngle)*bh;
      const tipY = y + Math.sin(dirAngle)*bh;
      const ctrlX = x + Math.cos(dirAngle)*bh*0.5 + (rng()-0.5)*bh*0.35;
      const ctrlY = y + Math.sin(dirAngle)*bh*0.5;
      ctx.strokeStyle=blades[Math.floor(rng()*blades.length)];
      ctx.lineWidth=1.0+rng()*1.6;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.quadraticCurveTo(ctrlX,ctrlY,tipX,tipY);
      ctx.stroke();

  function bgRain(ctx,w,h,rng){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#eaf7fb'); g.addColorStop(0.5,'#bfe3ee'); g.addColorStop(1,'#8fcbdb');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    const blobs=['#d8f2f8','#a9dced','#6fb8cf','#ffffff'];
    for(let i=0;i<4;i++){
      const cx=rng()*w, cy=rng()*h, r=(0.3+rng()*0.5)*Math.max(w,h);
      const col=blobs[Math.floor(rng()*blobs.length)];
      const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      grad.addColorStop(0,hexToRgba(col,0.45));
      grad.addColorStop(1,hexToRgba(col,0));
      ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
    }
    for(let i=0;i<16;i++){
      const dx=rng()*w, dy=rng()*h, r=2+rng()*4;
      ctx.beginPath();
      ctx.ellipse(dx,dy,r*0.7,r,0,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.35+rng()*0.35})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(dx-r*0.25, dy-r*0.3, r*0.25, 0, Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.fill();
    }
    ctx.save();
    ctx.strokeStyle='#2a93b0';
    ctx.lineWidth=Math.max(2, h*0.035);

  function bgYarn(ctx,w,h,rng){

  function yarnOverlay(ctx,w,h,rng){
    const colors=['#ffffff','#f4d35e','#ef8354','#8ecae6','#d1495b','#7a9e7e'];
    const strands = 3+Math.floor(rng()*2);
    for(let s=0;s<strands;s++){
      const col = colors[Math.floor(rng()*colors.length)];
      const y0 = h*(0.15+rng()*0.7);
      const points=[];
      let x=-10;
      while(x<w+10){
        points.push({x, y:y0+Math.sin(x*0.03+rng()*3)*h*0.18+(rng()-0.5)*h*0.06});
        x+=w/8;
      }
      ctx.beginPath();
      ctx.moveTo(points[0].x,points[0].y);
      for(let i=1;i<points.length;i++){
        const midX=(points[i-1].x+points[i].x)/2, midY=(points[i-1].y+points[i].y)/2;
        ctx.quadraticCurveTo(points[i-1].x,points[i-1].y,midX,midY);
      }
      ctx.strokeStyle=col;
      ctx.lineWidth = h*0.020+rng()*h*0.010;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.globalAlpha=0.92;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(points[0].x,points[0].y-h*0.004);
      for(let i=1;i<points.length;i++){
        const midX=(points[i-1].x+points[i].x)/2, midY=(points[i-1].y+points[i].y)/2-h*0.004;
        ctx.quadraticCurveTo(points[i-1].x,points[i-1].y-h*0.004,midX,midY);
      }
      ctx.strokeStyle='rgba(255,255,255,0.5)';
      ctx.lineWidth = h*0.007;
      ctx.stroke();
      ctx.globalAlpha=1;
    }
  }

  function bgCake(ctx,w,h,rng){
    const seq = ['sponge','cream','caramel','cream','sponge','cream'];
    const bandH = h/seq.length;
    seq.forEach((type,i)=>{
      const yBase = i*bandH;
      const waveAmp = bandH*0.14;
      ctx.beginPath();
      ctx.moveTo(0, yBase);
      for(let x=0;x<=w;x+=w/10){
        const yy=yBase+Math.sin(x*0.02+i*1.7+rng())*waveAmp;
        ctx.lineTo(x,yy);
      }
      ctx.lineTo(w, yBase+bandH+waveAmp);
      for(let x=w;x>=0;x-=w/10){
        const yy=yBase+bandH+Math.sin(x*0.02+i*1.7+rng()+1)*waveAmp;
        ctx.lineTo(x,yy);
      }
      ctx.closePath();
      const fillCol = type==='sponge' ? '#e7c363' : (type==='cream' ? '#fbf3e3' : '#8a5a2c');
      ctx.fillStyle=fillCol;
      ctx.fill();
      if(type==='sponge'){
        for(let k=0;k<40;k++){
          const px=rng()*w, py=yBase+rng()*bandH;
          ctx.beginPath();
          ctx.arc(px,py,0.6+rng()*1.2,0,Math.PI*2);
          ctx.fillStyle=`rgba(180,120,40,${0.15+rng()*0.2})`;
          ctx.fill();
        }
      } else if(type==='caramel'){
        for(let k=0;k<30;k++){
          const px=rng()*w, py=yBase+rng()*bandH;
          ctx.beginPath();
          ctx.ellipse(px,py,1+rng()*2,0.6+rng()*1.2,rng()*Math.PI,0,Math.PI*2);
          ctx.fillStyle = rng()<0.5 ? 'rgba(60,32,10,0.5)' : 'rgba(200,150,70,0.4)';
          ctx.fill();
        }
      }
    });
  }

  function bgCream(ctx,w,h,rng){

    for(let i=0;i<bands;i++){
      const yBase=i*bandH;
      const waveAmp=bandH*0.16;
      ctx.beginPath();
      ctx.moveTo(0,yBase);
      for(let x=0;x<=w;x+=w/10){
        const yy=yBase+Math.sin(x*0.025+i*1.4+rng())*waveAmp;

        ctx.lineTo(x,yy);

  // 格紋產生器：依傳入的色票與格子大小畫出交錯條紋，供 5 款格紋樣式共用
  function makePlaidBg(palette, cellRatio){
    return function(ctx,w,h,rng){
      ctx.fillStyle = palette.bg;
      ctx.fillRect(0,0,w,h);
      const cell = h*cellRatio;
      for(let x=-cell; x<w+cell; x+=cell){
        const stripeW = cell*(0.32+rng()*0.22);
        ctx.fillStyle = hexToRgba(palette.line1, 0.55);
        ctx.fillRect(x, 0, stripeW, h);
      }
      for(let y=-cell; y<h+cell; y+=cell){
        const stripeH = cell*(0.32+rng()*0.22);
        ctx.fillStyle = hexToRgba(palette.line2, 0.5);
        ctx.fillRect(0, y, w, stripeH);
      }
      ctx.strokeStyle = hexToRgba(palette.accent, 0.6);
      ctx.lineWidth = Math.max(1, cell*0.06);
      for(let x=cell/2; x<w; x+=cell){
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
      }
      for(let y=cell/2; y<h; y+=cell){
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
      }
    };
  }

  function bgPicasso(ctx,w,h,rng){
    const palette = ['#1a1a1a','#e8dcc0','#c94c4c','#3a6ea5','#e0a72e','#f5f0e6'];
    ctx.fillStyle = palette[Math.floor(rng()*palette.length)];
    ctx.fillRect(0,0,w,h);
    const shapes = 10+Math.floor(rng()*4);
    for(let i=0;i<shapes;i++){
      const cx=rng()*w, cy=rng()*h;
      const sides = 3+Math.floor(rng()*3);
      const r = h*(0.25+rng()*0.5);
      ctx.beginPath();
      for(let s=0;s<sides;s++){
        const ang = (s/sides)*Math.PI*2 + rng()*0.6;
        const rad = r*(0.6+rng()*0.6);
        const px = cx+Math.cos(ang)*rad, py=cy+Math.sin(ang)*rad;
        if(s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle = hexToRgba(palette[Math.floor(rng()*palette.length)], 0.85);
      ctx.fill();
      ctx.strokeStyle='rgba(20,20,20,0.5)';
      ctx.lineWidth=1.5;
      ctx.stroke();
    }
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(rng()*w, rng()*h);
      ctx.lineTo(rng()*w, rng()*h);
      ctx.strokeStyle='rgba(15,15,15,0.4)';
      ctx.lineWidth=2+rng()*2;
      ctx.stroke();
    }
  }

  function bgWood(ctx,w,h,rng){

  // 五角星繪製輔助函式，供彩格紋等樣式使用
  function drawStar(ctx,cx,cy,r,color,rotation){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rotation);
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const outerAngle = (i/5)*Math.PI*2 - Math.PI/2;
      const innerAngle = outerAngle + Math.PI/5;
      const ox = Math.cos(outerAngle)*r, oy=Math.sin(outerAngle)*r;
      const ix = Math.cos(innerAngle)*r*0.42, iy=Math.sin(innerAngle)*r*0.42;
      if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
      ctx.lineTo(ix,iy);
    }
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
    ctx.restore();
  }

  function bgColorPlaid(ctx,w,h,rng){
    const palette = ['#5bb3e0','#f4e04d','#8cc63f','#2e9e4f','#f472a0','#f4906b','#f9c96b','#7fd3e8'];
    const cols = 4, rows = 6;
    const cellW = w/cols, cellH = h/rows;
    ctx.save();
    ctx.filter = 'blur(6px)';
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        ctx.fillStyle = palette[Math.floor(rng()*palette.length)];
        ctx.fillRect(c*cellW-4, r*cellH-4, cellW+8, cellH+8);
      }
    }
    ctx.restore();
    const starColors = ['#ffe066','#ff9f45','#5bc0eb','#e0507a','#8bd450'];
    const starCount = 14+Math.floor(rng()*6);
    for(let i=0;i<starCount;i++){
      drawStar(ctx, rng()*w, rng()*h, 4+rng()*6, starColors[Math.floor(rng()*starColors.length)], rng()*Math.PI);
    }
  }

      ctx.arc(rng()*w, rng()*h, 0.8+rng()*1.6, 0, Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.4+rng()*0.4})`;

  function bgSpray(ctx,w,h,rng){
    ctx.fillStyle = '#fbfbfa'; ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.filter = 'blur(10px)';
    const mistColors = ['#1c5ea8','#2f7fc4','#0f3d66'];
    for(let i=0;i<4;i++){
      const cx=rng()*w, cy=rng()*h, r=h*(0.22+rng()*0.28);
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = hexToRgba(mistColors[Math.floor(rng()*mistColors.length)], 0.16+rng()*0.12);
      ctx.fill();
    }
    ctx.restore();
    for(let i=0;i<90;i++){
      const x=rng()*w, y=rng()*h;
      ctx.beginPath();
      ctx.arc(x,y,0.4+rng()*1.2,0,Math.PI*2);
      ctx.fillStyle=`rgba(30,85,170,${0.05+rng()*0.10})`;
      ctx.fill();
    }
    for(let i=0;i<4;i++){
      const x=rng()*w;
      const y0=rng()*h*0.5;
      const len=h*(0.1+rng()*0.25);
      const dx=(rng()-0.5)*4;
      ctx.strokeStyle=`rgba(20,70,140,${0.15+rng()*0.15})`;
      ctx.lineWidth=1+rng()*1.5;
      ctx.beginPath();
      ctx.moveTo(x,y0);
      ctx.lineTo(x+dx, y0+len);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x+dx, y0+len, 1.5+rng()*1.5, 0, Math.PI*2);
      ctx.fillStyle=`rgba(20,70,140,${0.2+rng()*0.15})`;
      ctx.fill();
    }
  }

  function bgAlien(ctx,w,h,rng){
    ctx.fillStyle = '#f7faf5'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<4;i++){
      const cx=rng()*w, cy=rng()*h, r=(0.25+rng()*0.4)*Math.max(w,h);
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,'rgba(150,255,80,0.18)');
      g.addColorStop(1,'rgba(150,255,80,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }
    for(let i=0;i<10;i++){
      const x=rng()*w, y=rng()*h, r=2+rng()*5;
      ctx.beginPath();
      ctx.ellipse(x,y,r,r*1.3,0,0,Math.PI*2);
      ctx.fillStyle=`rgba(120,220,60,${0.15+rng()*0.2})`;
      ctx.fill();
    }
  }

  function bgStars(ctx,w,h,rng){
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#e6e7e6'); g.addColorStop(1,'#cfd2d1');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    for(let i=0;i<7;i++){
      const cx=rng()*w, cy=rng()*h, r=h*(0.14+rng()*0.10);
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(rng()*Math.PI*2);
      ctx.beginPath();
      for(let k=0;k<5;k++){
        const outerAngle=(k/5)*Math.PI*2-Math.PI/2;
        const innerAngle=outerAngle+Math.PI/5;
        const ox=Math.cos(outerAngle)*r, oy=Math.sin(outerAngle)*r;
        const ix=Math.cos(innerAngle)*r*0.42, iy=Math.sin(innerAngle)*r*0.42;
        if(k===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
        ctx.lineTo(ix,iy);
      }
      ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fill();
      ctx.strokeStyle='rgba(120,125,125,0.6)';
      ctx.lineWidth=1.2;
      ctx.stroke();
      ctx.restore();
    }
    for(let i=0;i<22;i++){
      drawStar(ctx, rng()*w, rng()*h, 2+rng()*3, 'rgba(130,132,130,0.55)', rng()*Math.PI);
    }

  function starsOverlay(ctx,w,h,rng){
    const count = 3+Math.floor(rng()*3);
    for(let i=0;i<count;i++){
      const y = rng()*h;
      const len = w*(0.22+rng()*0.62);
      const x0 = rng()*(w-len);
      const tilt = (rng()-0.5)*h*0.08;
      ctx.strokeStyle='rgba(100,103,101,0.5)';
      ctx.lineWidth=1+rng()*1.8;
      ctx.beginPath();
      ctx.moveTo(x0,y);
      ctx.lineTo(x0+len, y+tilt);
      ctx.stroke();
    }
  }

  // 彌散光背景產生器：模糊光暈色塊 + 迷幻漸層，供 4 款彌散光樣式共用
  function makeDiffuseBg(base, blobs){
    return function(ctx,w,h,rng){
      ctx.fillStyle = base; ctx.fillRect(0,0,w,h);
      ctx.save();
      ctx.filter = 'blur(26px)';
      const n = blobs.length + 2;
      for(let i=0;i<n;i++){
        const col = blobs[i % blobs.length];
        const cx = rng()*w, cy = rng()*h;
        const r = h*(0.65+rng()*0.55);
        const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        g.addColorStop(0, hexToRgba(col, 0.85));
        g.addColorStop(1, hexToRgba(col, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0,0,w,h);
      }
      ctx.restore();
    };
  }
  const bgDiffusePastel = makeDiffuseBg('#f5f2ea', ['#fff3a0','#a8d8ea','#f8b6c4','#c9f2d8']);
  const bgDiffuseSunset = makeDiffuseBg('#f7ede8', ['#ffd6a5','#caa8e8','#ff9ecb','#ffe8d6']);
  const bgDiffuseLilac  = makeDiffuseBg('#f0edf7', ['#c9b8ff','#a8e6d0','#ffb8de','#e0d4ff']);
  const bgDiffusePeach  = makeDiffuseBg('#fbeee2', ['#ffcba4','#ffe0ac','#ffb4a2','#fff0d9']);

  // 彌散光專用疊加層：用漸層色的細小線條取代雜訊碎點，線條會蓋在文字上方形成干擾
  function makeDiffuseLinesOverlay(colors){
    return function(ctx,w,h,rng){
      const count = 45+Math.floor(rng()*30);
      for(let i=0;i<count;i++){
        const x=rng()*w, y=rng()*h;
        const len = h*(0.04+rng()*0.07);
        const ang = rng()*Math.PI*2;
        const c1 = colors[Math.floor(rng()*colors.length)];
        const c2 = colors[Math.floor(rng()*colors.length)];
        const x2 = x+Math.cos(ang)*len, y2 = y+Math.sin(ang)*len;
        const g = ctx.createLinearGradient(x,y,x2,y2);
        g.addColorStop(0, hexToRgba(c1, 0.5+rng()*0.3));
        g.addColorStop(1, hexToRgba(c2, 0.5+rng()*0.3));
        ctx.strokeStyle = g;
        ctx.lineWidth = 0.7+rng()*1.1;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x2,y2);
        ctx.stroke();
      }
    };
  }
  const diffusePastelOverlay = makeDiffuseLinesOverlay(['#fff3a0','#a8d8ea','#f8b6c4','#c9f2d8']);
  const diffuseSunsetOverlay = makeDiffuseLinesOverlay(['#ffd6a5','#caa8e8','#ff9ecb','#ffe8d6']);
  const diffuseLilacOverlay  = makeDiffuseLinesOverlay(['#c9b8ff','#a8e6d0','#ffb8de','#e0d4ff']);
  const diffusePeachOverlay  = makeDiffuseLinesOverlay(['#ffcba4','#ffe0ac','#ffb4a2','#fff0d9']);

  // 手繪線條輔助函式：用二次貝茲曲線的隨機抖動模擬手繪筆觸
  function drawHandLine(ctx,x1,y1,x2,y2,rng,wobble,strokeStyle,lineWidth){
    const midX=(x1+x2)/2+(rng()-0.5)*wobble;
    const midY=(y1+y2)/2+(rng()-0.5)*wobble;
    ctx.strokeStyle=strokeStyle;
    ctx.lineWidth=lineWidth;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.quadraticCurveTo(midX,midY,x2,y2);
    ctx.stroke();
  }
  function drawSixStar(ctx,cx,cy,r,rng,fillCol,strokeCol){
    ctx.save();
    ctx.translate(cx,cy);
    const wob = r*0.07;
    for(let tri=0;tri<2;tri++){
      ctx.save();
      ctx.rotate(tri===0?0:Math.PI);
      ctx.beginPath();
      for(let i=0;i<3;i++){
        const ang=(i/3)*Math.PI*2-Math.PI/2;
        const px=Math.cos(ang)*r+(rng()-0.5)*wob;
        const py=Math.sin(ang)*r+(rng()-0.5)*wob;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.globalAlpha=0.92;
      ctx.fillStyle=fillCol;
      ctx.fill();
      ctx.lineWidth=r*0.10;
      ctx.lineJoin='round';
      ctx.strokeStyle=strokeCol;
      ctx.stroke();
      ctx.globalAlpha=1;
      ctx.restore();
    }
    ctx.restore();
  }
  function bgHandGeo(ctx,w,h,rng){
    ctx.fillStyle = '#f3ead9'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<6;i++){
      const x1=rng()*w, y1=rng()*h;
      const x2=x1+(rng()-0.5)*w*0.35, y2=y1+(rng()-0.5)*h*0.35;
      drawHandLine(ctx,x1,y1,x2,y2,rng,h*0.06,'rgba(150,40,40,0.32)',1.3);
    }
    for(let i=0;i<5;i++){
      const cx=rng()*w, cy=rng()*h, r=h*(0.04+rng()*0.05);
      ctx.beginPath();
      for(let a=0;a<=Math.PI*2+0.4;a+=0.45){
        const rr=r+(rng()-0.5)*r*0.18;
        const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
        if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle='rgba(30,50,90,0.38)';
      ctx.lineWidth=1.2;
      ctx.stroke();
    }
    const starCount = 1+Math.floor(rng()*2);
    for(let i=0;i<starCount;i++){
      drawSixStar(ctx, w*(0.2+rng()*0.6), h*(0.2+rng()*0.6), h*(0.16+rng()*0.08), rng, '#c0392b', '#f3ead9');
    }
  }

  function bgTVStatic(ctx,w,h,rng){
    ctx.fillStyle = '#111'; ctx.fillRect(0,0,w,h);
    const cell = Math.max(1.5, h*0.014);
    for(let y=0;y<h;y+=cell){
      for(let x=0;x<w;x+=cell){
        const r=Math.floor(rng()*255), g=Math.floor(rng()*255), b=Math.floor(rng()*255);
        ctx.fillStyle = `rgba(${r},${g},${b},${0.5+rng()*0.5})`;
        ctx.fillRect(x,y,cell,cell);
      }
    }
    for(let i=0;i<4;i++){
      const y0 = rng()*h;
      const bh = h*(0.02+rng()*0.05);
      ctx.fillStyle = `rgba(${Math.floor(rng()*255)},${Math.floor(rng()*255)},${Math.floor(rng()*255)},0.5)`;
      ctx.fillRect(0,y0,w,bh);
    }
    ctx.strokeStyle='rgba(0,0,0,0.25)';
    ctx.lineWidth=1;
    for(let y=0;y<h;y+=3){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }
  }

  function bgPsychedelic(ctx,w,h,rng){
    ctx.fillStyle = '#060607'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<3;i++){
      const cx=rng()*w, cy=rng()*h, r=h*(0.3+rng()*0.4);
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,'rgba(40,120,100,0.14)');
      g.addColorStop(1,'rgba(40,120,100,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  function bgWaterRipple(ctx,w,h,rng){
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#dceefa'); g.addColorStop(1,'#a8d4ec');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    for(let i=0;i<8;i++){
      const cx=rng()*w, cy=rng()*h;
      const rings = 2+Math.floor(rng()*3);
      for(let r=0;r<rings;r++){
        const rad = h*(0.05+r*0.045+rng()*0.02);
        ctx.beginPath();
        ctx.arc(cx,cy,rad,0,Math.PI*2);
        ctx.strokeStyle=`rgba(255,255,255,${0.25+rng()*0.25})`;
        ctx.lineWidth=1+rng()*1.2;
        ctx.stroke();
      }
    }
    for(let i=0;i<6;i++){
      const y0=rng()*h;
      ctx.beginPath();
      ctx.moveTo(0,y0);
      for(let x=0;x<=w;x+=w/10){
        const yy=y0+Math.sin(x*0.04+i+rng()*2)*h*0.02;
        ctx.lineTo(x,yy);
      }
      ctx.strokeStyle=`rgba(255,255,255,${0.15+rng()*0.2})`;
      ctx.lineWidth=1+rng();

  function bgMemory(ctx,w,h,rng){
    ctx.fillStyle = '#f3d94a'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,0.35)';
    ctx.lineWidth=1;
    const step=h*0.14;
    for(let x=-h;x<w+h;x+=step){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+h,h); ctx.stroke();
    }
    const blockColors=['#e8577a','#f0923a','#4a90c4','#7fbf5f'];
    for(let i=0;i<4;i++){
      const bw=w*(0.12+rng()*0.08), bh=h*(0.20+rng()*0.12);
      const bx=rng()*(w-bw), by=rng()*(h-bh);
      ctx.save();
      ctx.translate(bx+bw/2, by+bh/2);
      ctx.rotate((rng()-0.5)*0.3);
      ctx.fillStyle=blockColors[Math.floor(rng()*blockColors.length)];
      ctx.globalAlpha=0.85;
      ctx.fillRect(-bw/2,-bh/2,bw,bh);
      ctx.restore();
    }
    ctx.globalAlpha=1;
    const inset = h*0.10;
    ctx.strokeStyle='#3d2a6b';
    ctx.lineWidth=Math.max(4, h*0.07);
    ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
    ctx.strokeStyle='rgba(255,255,255,0.8)';
    ctx.lineWidth=1.5;
    ctx.strokeRect(inset,inset,w-inset*2,h-inset*2);
    const stripeColors=['#8fbf3f','#f0d43a'];
    for(let i=0;i<3;i++){
      ctx.fillStyle=stripeColors[i%2];
      ctx.fillRect(w-inset*0.85-i*(h*0.035), inset*0.6, h*0.028, h-inset*1.2);
    }
  }

  function bgGlass(ctx,w,h,rng){
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#bfe0f5'); g.addColorStop(1,'#7fb8dc');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,0.35)';
    ctx.lineWidth=1;
    const step=h*0.18;
    for(let y=-step;y<h+step;y+=step){
      ctx.beginPath();
      for(let x=0;x<=w+step;x+=step){
        const yy = y + (Math.floor(x/step)%2===0 ? 0 : step*0.5);
        if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    for(let i=0;i<3;i++){
      const gx=rng()*w, gy=rng()*h, gw=w*(0.15+rng()*0.15), gh=h*(0.3+rng()*0.3);
      ctx.save();
      ctx.translate(gx,gy);
      ctx.rotate((rng()-0.5)*0.5);
      ctx.fillStyle='rgba(255,255,255,0.18)';
      ctx.fillRect(-gw/2,-gh/2,gw,gh);
      ctx.restore();
    }
  }
  function glassOverlay(ctx,w,h,rng){
    const count = 10+Math.floor(rng()*8);
    for(let i=0;i<count;i++){
      const x=rng()*w, y=rng()*h;
      const len=h*(0.06+rng()*0.14);
      const ang=rng()*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(x,y);

      ctx.strokeStyle=`rgba(255,255,255,${0.35+rng()*0.35})`;
      ctx.lineWidth=0.6+rng()*0.8;
      ctx.stroke();
    }

  function drawTapeStrip(ctx,w,h,rng){
    const colors = ['rgba(255,214,102,0.45)','rgba(255,153,172,0.4)','rgba(140,200,255,0.4)','rgba(178,255,178,0.4)','rgba(230,200,255,0.4)'];
    const cx=rng()*w, cy=rng()*h;
    const len = w*(0.15+rng()*0.35);
    const wth = h*(0.08+rng()*0.10);
    const ang = (rng()-0.5)*Math.PI*0.6;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(ang);
    ctx.fillStyle = colors[Math.floor(rng()*colors.length)];
    ctx.fillRect(-len/2,-wth/2,len,wth);
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=1;
    ctx.strokeRect(-len/2,-wth/2,len,wth);

  function bgTape(ctx,w,h,rng){
    ctx.fillStyle='#faf7f0'; ctx.fillRect(0,0,w,h);

    for(let i=0;i<count;i++){ drawTapeStrip(ctx,w,h,rng); }

  function tapeOverlay(ctx,w,h,rng){

  function makeGradientBg(colors){
    return function(ctx,w,h,rng){
      const angle = Math.PI/4 + (rng()-0.5)*0.4;
      const dx=Math.cos(angle), dy=Math.sin(angle);
      const x1 = w/2 - dx*w, y1 = h/2 - dy*h;
      const x2 = w/2 + dx*w, y2 = h/2 + dy*h;
      const g = ctx.createLinearGradient(x1,y1,x2,y2);
      colors.forEach((c,i)=>{ g.addColorStop(i/(colors.length-1), c); });
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    };
  }
  const bgGradDusk = makeGradientBg(['#4a2c6b','#c94c7a','#f0923a']);
  const bgGradMint = makeGradientBg(['#7fe0c9','#4a9fd8']);
  const bgGradBerry = makeGradientBg(['#f4a6c9','#8a4a9e']);
  const bgGradRainbow = makeGradientBg(['#ff4d4d','#ff9f4d','#ffe14d','#4dff88','#4dc9ff','#9f4dff']);


  /* ---------- 黑夜樣式：鳥剪影 + 迷幻夜空 ---------- */
  // 單隻鳥的剪影：k 控制翅膀拍動幅度，flip 控制左右翻轉
  function drawBirdSilhouette(ctx,x,y,s,rot,k,flip,color){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(flip?-1:1,1);
    const tipY = s*(0.18-0.22*k);
    ctx.beginPath();
    ctx.moveTo(0,s*0.10);
    ctx.bezierCurveTo(-s*0.22,-s*0.30*k, -s*0.68,-s*0.38*k, -s,tipY);
    ctx.bezierCurveTo(-s*0.68,-s*0.10*k, -s*0.32,s*0.02, -s*0.04,s*0.26);
    ctx.lineTo(s*0.05,s*0.30);
    ctx.bezierCurveTo(s*0.32,s*0.02, s*0.68,-s*0.10*k, s,tipY);
    ctx.bezierCurveTo(s*0.68,-s*0.38*k, s*0.22,-s*0.30*k, 0,s*0.10);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    // 小小的頭與尾
    ctx.beginPath();
    ctx.ellipse(s*0.02,s*0.06,s*0.07,s*0.10,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function scatterBirds(ctx,w,h,rng,count,minR,maxR,baseAlpha){
    for(let i=0;i<count;i++){
      const x = rng()*w, y = rng()*h;
      const s = h*(minR + Math.pow(rng(),1.8)*(maxR-minR));
      const rot = (rng()-0.5)*0.9;
      const k = 0.35 + rng()*1.0;
      const a = baseAlpha + rng()*(1-baseAlpha);
      drawBirdSilhouette(ctx,x,y,s,rot,k,rng()<0.5,`rgba(3,4,8,${a.toFixed(2)})`);
    }
  }
  function bgNight(ctx,w,h,rng){
    // 剛入夜的天空：頂部近黑 → 深藍 → 灰藍 → 地平線偏灰 → 底部壓黑
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#04050b');
    g.addColorStop(0.30,'#0c1838');
    g.addColorStop(0.58,'#2b3a5e');
    g.addColorStop(0.78,'#5a6272');
    g.addColorStop(1,'#101116');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

    // 迷幻光暈：模糊的紫、青、洋紅色塊
    ctx.save();
    ctx.filter = 'blur(22px)';
    const glowCols = ['#1f5f8a','#1f7a99','#2a4fb0','#3a6a8a'];
    for(let i=0;i<5;i++){
      const cx = rng()*w, cy = rng()*h, r = h*(0.45+rng()*0.5);
      const col = glowCols[Math.floor(rng()*glowCols.length)];
      const rg = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,hexToRgba(col,0.42));
      rg.addColorStop(1,hexToRgba(col,0));
      ctx.fillStyle=rg; ctx.fillRect(0,0,w,h);
    }
    ctx.restore();

    // 短而長短不一的細線
    const waveCols = ['rgba(110,150,255,','rgba(90,220,230,','rgba(120,190,240,','rgba(200,205,215,'];
    const streakN = Math.floor(w*h/1500);
    ctx.lineCap='round';
    for(let i=0;i<streakN;i++){
      const x = rng()*w, y = rng()*h;
      const len = h*(0.02+Math.pow(rng(),2)*0.16);
      const ang = (rng()-0.5)*1.6;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(ang)*len, y+Math.sin(ang)*len);
      ctx.strokeStyle = waveCols[Math.floor(rng()*waveCols.length)] + (0.10+rng()*0.18).toFixed(2) + ')';
      ctx.lineWidth = 0.6+rng()*1.2;
      ctx.stroke();
    }

    // 星點
    const starN = Math.floor(w*h/9000);
    for(let i=0;i<starN;i++){
      const sx = rng()*w, sy = rng()*h*0.75, sr = 0.4+rng()*1.1;
      ctx.beginPath();
      ctx.arc(sx,sy,sr,0,Math.PI*2);
      const tint = rng();
      ctx.fillStyle = tint<0.6 ? `rgba(255,255,255,${0.25+rng()*0.5})`
                    : (tint<0.8 ? `rgba(170,200,255,${0.3+rng()*0.4})` : `rgba(150,225,235,${0.3+rng()*0.4})`);
      ctx.fill();
    }

    // 隨機分佈的大量鳥剪影（遠近大小不一）
    const birdCount = Math.max(8, Math.floor(w*h/2300));
    scatterBirds(ctx,w,h,rng,birdCount,0.045,0.19,0.62);
  }
  function nightOverlay(ctx,w,h,rng){
    // 少量小鳥飛在文字前方，增加干擾與層次
    scatterBirds(ctx,w,h,rng,3+Math.floor(rng()*3),0.035,0.07,0.9);
  }


  /* ---------- 吐司樣式：參考實物吐司切片（金黃烤面 + 橘褐吐司邊 + 氣孔） ---------- */
  // 吐司切片外形：接近方形、上方兩側微微外凸、頂部中央微凹、四角圓潤
  function toastShapePath(ctx,w,h){
    const m = h*0.03, L=m, R=w-m, T=m, B=h-m;
    const ov = h*0.045;                 // 兩側上方外凸量
    const xl = L+ov, xr = R-ov;
    const rb = h*0.13;                  // 底部圓角
    const rt = h*0.20;                  // 頂部圓角
    ctx.moveTo(xl+rb,B);
    ctx.lineTo(xr-rb,B);
    ctx.quadraticCurveTo(xr,B,xr,B-rb);
    ctx.lineTo(xr,h*0.46);
    ctx.bezierCurveTo(xr,h*0.38, R,h*0.36, R,h*0.24);
    ctx.bezierCurveTo(R,h*0.10, R-rt*0.30,T, R-rt,T);
    ctx.bezierCurveTo(w*0.66,T, w*0.58,T+h*0.05, w*0.5,T+h*0.05);
    ctx.bezierCurveTo(w*0.42,T+h*0.05, w*0.34,T, L+rt,T);
    ctx.bezierCurveTo(L+rt*0.30,T, L,h*0.10, L,h*0.24);
    ctx.bezierCurveTo(L,h*0.36, xl,h*0.38, xl,h*0.46);
    ctx.lineTo(xl,B-rb);
    ctx.quadraticCurveTo(xl,B,xl+rb,B);
    ctx.closePath();
  }
  // 以畫面中心為基準等距內縮的輪廓；dy 可上下偏移，讓上下的邊厚度不同
  function toastInsetPath(ctx,w,h,inset,dy){
    ctx.save();
    ctx.translate(w/2,h/2+(dy||0));
    ctx.scale((w-2*inset)/w,(h-2*inset)/h);
    ctx.translate(-w/2,-h/2);
    toastShapePath(ctx,w,h);
    ctx.restore();
  }
  // 柔邊色塊：以放射漸層從中心淡出到透明，疊在一起時不會出現明顯邊界
  function toastSoftBlob(ctx,cx,cy,rx,ry,rot,rgb,alpha){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot);
    ctx.scale(rx,ry);
    const g = ctx.createRadialGradient(0,0,0,0,0,1);
    g.addColorStop(0,`rgba(${rgb},${alpha.toFixed(3)})`);
    g.addColorStop(0.35,`rgba(${rgb},${(alpha*0.72).toFixed(3)})`);
    g.addColorStop(0.7,`rgba(${rgb},${(alpha*0.28).toFixed(3)})`);
    g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(-1,-1,2,2);
    ctx.restore();
  }
  function bgToast(ctx,w,h,rng){
    const t = Math.max(4, h*0.045);        // 吐司邊厚度（底部會比上方再厚一些）
    const dy = -t*0.35;

    // 1) 背景與吐司投影
    const plate = ctx.createRadialGradient(w/2,h/2,h*0.2,w/2,h/2,w*0.7);
    plate.addColorStop(0,'#eceae4');
    plate.addColorStop(1,'#d3d1c8');
    ctx.fillStyle = plate; ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.shadowColor = 'rgba(60,40,20,0.35)';
    ctx.shadowBlur = h*0.05;
    ctx.shadowOffsetY = h*0.02;
    ctx.beginPath(); toastShapePath(ctx,w,h);
    ctx.fillStyle = '#d98f3a';
    ctx.fill();
    ctx.restore();

    // 2) 吐司內部：靠邊較淺的奶油色，中央烤成金橘色
    ctx.save();
    ctx.beginPath(); toastShapePath(ctx,w,h); ctx.clip();
    ctx.fillStyle = '#f5e6c4';
    ctx.fillRect(0,0,w,h);

    const gx = w*(0.5+(rng()-0.5)*0.2), gy = h*(0.45+(rng()-0.5)*0.1);
    ctx.save();
    ctx.translate(gx,gy);
    ctx.scale(w/h*0.82,1);
    const toasted = ctx.createRadialGradient(0,0,0,0,0,h*0.58);
    toasted.addColorStop(0,'rgba(226,150,56,0.92)');
    toasted.addColorStop(0.55,'rgba(232,168,76,0.75)');
    toasted.addColorStop(1,'rgba(240,206,140,0)');
    ctx.fillStyle = toasted;
    ctx.fillRect(-w,-h,w*2,h*2);
    ctx.restore();

    // 烤色不均的斑塊：每塊都是由數個柔邊漸層疊成，邊緣完全漸變（較濃的金橘 / 較淡的奶油）
    const blotchCols = ['205,118,34','226,150,56','236,176,88','246,230,196'];
    const blockN = Math.max(4, Math.floor(w*h/7000));
    for(let i=0;i<blockN;i++){
      const cx = rng()*w, cy = rng()*h;
      const bw = h*(0.14+rng()*0.30), bh = h*(0.10+rng()*0.22);
      const rot = (rng()-0.5)*1.2;
      const rgb = blotchCols[Math.floor(rng()*blotchCols.length)];
      const lobes = 3+Math.floor(rng()*2);
      for(let k=0;k<lobes;k++){
        toastSoftBlob(ctx,
          cx+(rng()-0.5)*bw*0.9, cy+(rng()-0.5)*bh*0.9,
          bw*(0.55+rng()*0.5), bh*(0.55+rng()*0.5),
          rot+(rng()-0.5)*0.8, rgb, 0.16+rng()*0.16);
      }
    }

    // 3) 氣孔：柔邊、低對比、形狀不規則（由 1~2 個重疊橢圓組成）
    const poreN = Math.floor(w*h/480);
    ctx.save();
    ctx.filter = 'blur(1.1px)';
    for(let i=0;i<poreN;i++){
      const cx = rng()*w, cy = rng()*h;
      const rx = Math.max(0.9, h*(0.007+Math.pow(rng(),3)*0.05));
      const ry = rx*(0.45+rng()*0.5);
      const rot = rng()*Math.PI;
      const alpha = 0.14+rng()*0.16;
      const parts = rng()<0.45 ? 2 : 1;
      for(let k=0;k<parts;k++){
        const ox = k ? (rng()-0.5)*rx*1.2 : 0, oy = k ? (rng()-0.5)*ry*1.2 : 0;
        const rr = k ? 0.6+rng()*0.4 : 1;
        ctx.beginPath();
        ctx.ellipse(cx+ox,cy+oy,rx*rr,ry*rr,rot+k*0.7,0,Math.PI*2);
        ctx.fillStyle = `rgba(172,118,58,${alpha.toFixed(2)})`;
        ctx.fill();
      }
      if(rx>1.8){
        // 很淡的上緣陰影與下緣微亮，只表現輕微凹陷
        ctx.beginPath();
        ctx.ellipse(cx,cy,rx,ry,rot,Math.PI*1.0,Math.PI*1.9);
        ctx.strokeStyle = 'rgba(120,74,30,0.16)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(cx,cy,rx,ry,rot,Math.PI*0.05,Math.PI*0.85);
        ctx.strokeStyle = 'rgba(255,244,214,0.22)';
        ctx.stroke();
      }
    }
    ctx.restore();
    // 細小麵包屑顆粒
    const crumbN = Math.floor(w*h/200);
    for(let i=0;i<crumbN;i++){
      ctx.fillStyle = rng()<0.6 ? `rgba(170,112,50,${(0.12+rng()*0.16).toFixed(2)})`
                                : `rgba(255,246,222,${(0.25+rng()*0.25).toFixed(2)})`;
      ctx.fillRect(rng()*w, rng()*h, 0.6+rng()*1.2, 0.6+rng()*1.2);
    }
    ctx.restore();

    // 4) 吐司邊：橘褐色、粗糙有顆粒，焦黃與黃橘交錯但過渡柔和
    const per = 2*(w+h)*1.1;
    ctx.save();
    ctx.beginPath();
    toastShapePath(ctx,w,h);
    toastInsetPath(ctx,w,h,t,dy);
    ctx.clip('evenodd');
    const cg = ctx.createLinearGradient(0,0,0,h);
    cg.addColorStop(0,'#d8883a'); cg.addColorStop(0.5,'#cf7a2c'); cg.addColorStop(1,'#bf6a22');
    ctx.fillStyle = cg;
    ctx.fillRect(0,0,w,h);
    // 焦褐 / 黃橘的柔邊色塊沿著吐司邊分布，彼此重疊處自然混色
    const crustCols = [['168,88,24',0.55],['236,168,76',0.60],['200,120,40',0.45],['244,190,100',0.40]];
    const sideInset = h*0.075 + t*0.5;      // 左右邊的中線位置
    const topY = h*0.03 + t*0.5 + dy*0.5, botY = h - h*0.03 - t*0.5 + dy*0.5;
    const blobN = Math.floor(per/(t*1.6));
    for(let i=0;i<blobN;i++){
      const r = rng()*2*(w+h);
      let x,y,horiz;
      if(r<w){ x=r; y=topY; horiz=true; }
      else if(r<w+h){ x=w-sideInset; y=r-w; horiz=false; }
      else if(r<2*w+h){ x=r-w-h; y=botY; horiz=true; }
      else { x=sideInset; y=r-2*w-h; horiz=false; }
      const along = t*(3+rng()*8), across = t*(1.4+rng()*1.8);
      const c = crustCols[Math.floor(rng()*crustCols.length)];
      toastSoftBlob(ctx, x+(rng()-0.5)*t*0.6, y+(rng()-0.5)*t*0.6,
        horiz?along:across, horiz?across:along, (rng()-0.5)*0.3, c[0], c[1]);
    }
    ctx.lineJoin = 'round';
    ctx.filter = 'blur(4px)';
    // 外緣偏深的焦邊
    ctx.beginPath(); toastInsetPath(ctx,w,h,t*0.1,dy*0.1);
    ctx.setLineDash([]);
    ctx.lineWidth = t*0.5;
    ctx.strokeStyle = 'rgba(140,72,18,0.35)';
    ctx.stroke();
    ctx.filter = 'none';
    // 粗糙顆粒
    const grainN = Math.floor(w*h/900);
    for(let i=0;i<grainN;i++){
      const r = rng();
      ctx.fillStyle = r<0.45 ? 'rgba(96,48,10,0.08)' : (r<0.8 ? 'rgba(244,184,92,0.10)' : 'rgba(255,226,160,0.10)');
      ctx.fillRect(rng()*w, rng()*h, 0.6+rng()*0.8, 0.6+rng()*0.8);
    }
    ctx.restore();

    // 外緣輪廓
    ctx.beginPath(); toastShapePath(ctx,w,h);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(130,68,18,0.45)';
    ctx.stroke();

    // 吐司邊與內部的交界：金橘色過渡，往內暈開
    ctx.save();
    ctx.beginPath(); toastInsetPath(ctx,w,h,t,dy); ctx.clip();
    ctx.beginPath(); toastInsetPath(ctx,w,h,t,dy);
    ctx.shadowColor = 'rgba(190,110,36,0.7)';
    ctx.shadowBlur = Math.max(4,t*0.9);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(226,150,60,0.9)';
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 夢境樣式：藍、粉、珊瑚橘交融的柔光夢幻天空 ---------- */
  // 霧狀柔邊色團：高斯式的緩慢衰減，邊緣完全消散
  function dreamFog(ctx,cx,cy,rx,ry,rot,rgb,alpha){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot);
    ctx.scale(rx,ry);
    const g = ctx.createRadialGradient(0,0,0,0,0,1);
    g.addColorStop(0,`rgba(${rgb},${alpha.toFixed(3)})`);
    g.addColorStop(0.2,`rgba(${rgb},${(alpha*0.82).toFixed(3)})`);
    g.addColorStop(0.4,`rgba(${rgb},${(alpha*0.5).toFixed(3)})`);
    g.addColorStop(0.6,`rgba(${rgb},${(alpha*0.24).toFixed(3)})`);
    g.addColorStop(0.8,`rgba(${rgb},${(alpha*0.07).toFixed(3)})`);
    g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(-1,-1,2,2);
    ctx.restore();
  }
  // 柔光點：整顆都是霧狀暈光，沒有清楚的亮核
  function dreamGlowDot(ctx,x,y,r,rgb,a){
    dreamFog(ctx,x,y,r*3.2,r*3.2,0,rgb,a*0.45);
    dreamFog(ctx,x,y,r*1.5,r*1.5,0,'255,255,255',a*0.6);
  }
  // 柔和的光絲（模糊的曲線）
  function dreamSoftLines(ctx,w,h,rng,count,alphaScale){
    // 用一串霧狀小色團沿曲線排開，頭尾淡出；完全不靠 filter，各瀏覽器都一樣柔
    const cols = ['255,255,255','255,190,230','170,215,255','255,205,180','210,190,255'];
    for(let i=0;i<count;i++){
      const x = rng()*w, y = rng()*h;
      const len = h*(0.25+Math.pow(rng(),1.6)*1.1);
      const ang = (rng()-0.5)*1.5;
      const x2 = x+Math.cos(ang)*len, y2 = y+Math.sin(ang)*len;
      const cx = (x+x2)/2+(rng()-0.5)*len*0.5, cy = (y+y2)/2+(rng()-0.5)*len*0.5;
      const c = cols[Math.floor(rng()*cols.length)];
      const rad = h*(0.025+rng()*0.04);
      const base = (0.10+rng()*0.12)*alphaScale;
      const n = Math.max(6, Math.ceil(len/(rad*0.6)));
      for(let k=0;k<=n;k++){
        const t = k/n, u = 1-t;
        const px = u*u*x+2*u*t*cx+t*t*x2, py = u*u*y+2*u*t*cy+t*t*y2;
        dreamFog(ctx,px,py,rad*1.6,rad,ang,c,base*Math.sin(Math.PI*t));
      }
    }
  }
  // 只畫出模糊陰影（本體移到畫布外）；不使用 ctx.filter，各瀏覽器都能柔化
  function dreamBlurText(ctx,ch,color,blur,strokeW){
    const m = ctx.getTransform();
    const D = 6000, det = m.a*m.d-m.b*m.c || 1;
    ctx.save();
    ctx.translate(-D*m.d/det, D*m.b/det);
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    ctx.shadowOffsetX = D;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = '#000';
    ctx.fillText(ch,0,0);
    if(strokeW){
      ctx.lineJoin = 'round';
      ctx.lineWidth = strokeW;
      ctx.strokeStyle = '#000';
      ctx.strokeText(ch,0,0);
    }
    ctx.restore();
  }
  function bgDream(ctx,w,h,rng){
    // 底色：淡紫 → 粉 → 天藍
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#b7a8f6');
    g.addColorStop(0.5,'#f6b3d8');
    g.addColorStop(1,'#8fb8fb');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

    // 大片色團：藍、粉、珊瑚、薰衣草、蜜桃、淺青，彼此柔和交疊
    const cols = ['82,150,255','255,118,198','255,108,92','170,140,255','255,186,152','110,205,255'];
    const blobN = Math.max(9, Math.floor(w*h/4200));
    for(let i=0;i<blobN;i++){
      const rgb = cols[Math.floor(rng()*cols.length)];
      const r = h*(0.45+rng()*0.7);
      dreamFog(ctx, rng()*w, rng()*h, r*(1.3+rng()*0.9), r, (rng()-0.5)*1.2, rgb, 0.55+rng()*0.35);
    }

    // 斜向流動的雲帶：由一串霧狀色團組成，邊緣自然消散，不會出現塊狀輪廓
    const bandCols = ['255,170,215','255,200,170','140,190,255','255,255,255','200,170,255'];
    for(let i=0;i<5;i++){
      const x = rng()*w*0.6, y = rng()*h;
      const len = w*(0.35+rng()*0.5), ang = -0.3+(rng()-0.5)*0.5;
      const bw = h*(0.12+rng()*0.22);
      const rgb = bandCols[Math.floor(rng()*bandCols.length)];
      const base = 0.10+rng()*0.08;
      const n = Math.ceil(len/(bw*0.5));
      for(let k=0;k<=n;k++){
        const t = k/n;
        dreamFog(ctx, x+Math.cos(ang)*len*t, y+Math.sin(ang)*len*t,
                 bw*1.8, bw*1.0, ang, rgb, base*(0.3+0.7*Math.sin(Math.PI*t)));
      }
    }

    // 提亮的柔光團（screen 疊色，像玻璃折射的亮處）
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const glowCols = ['255,200,230','190,220,255','255,215,190','255,255,255'];
    for(let i=0;i<5;i++){
      const r = h*(0.25+rng()*0.4);
      dreamFog(ctx, rng()*w, rng()*h, r*1.5, r, (rng()-0.5), glowCols[Math.floor(rng()*glowCols.length)], 0.30+rng()*0.25);
    }
    ctx.restore();

    // 撒上柔和的光點、散景與十字微光
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const dotCols = ['255,255,255','255,200,230','190,225,255','255,220,190'];
    const dotN = Math.max(4, Math.floor(w*h/4200));
    for(let i=0;i<dotN;i++){
      const r = Math.max(1.5, h*(0.014+Math.pow(rng(),2.2)*0.04));
      dreamGlowDot(ctx, rng()*w, rng()*h, r, dotCols[Math.floor(rng()*dotCols.length)], 0.30+rng()*0.35);
    }
    const bokehN = Math.max(2, Math.floor(w*h/14000));
    for(let i=0;i<bokehN;i++){
      const r = h*(0.07+rng()*0.10);
      dreamFog(ctx, rng()*w, rng()*h, r, r, 0, dotCols[Math.floor(rng()*dotCols.length)], 0.14+rng()*0.14);
    }
    ctx.restore();

    // 柔和的干擾光絲
    dreamSoftLines(ctx,w,h,rng,Math.max(4,Math.floor(w*h/6500)),1);
  }
  function dreamOverlay(ctx,w,h,rng){
    // 前景再飄一些很淡的光絲與光點，維持柔和的干擾
    dreamSoftLines(ctx,w,h,rng,Math.max(2,Math.floor(w*h/18000)),0.6);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const n = Math.max(2, Math.floor(w*h/12000));
    for(let i=0;i<n;i++){
      const r = Math.max(1.2, h*(0.012+Math.pow(rng(),2)*0.035));
      dreamGlowDot(ctx, rng()*w, rng()*h, r, rng()<0.5?'255,255,255':'255,205,235', 0.25+rng()*0.25);
    }
    ctx.restore();
  }
