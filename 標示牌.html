<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>標示牌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.08em;
}

html {
    background: #e5e7ea;
}

body {
    min-height: 100vh;
    background: #e5e7ea;
    color: #2b2f36;
    overflow-x: hidden;
}

/* 淺灰底色上的柔光 */
.blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
}
.b1 { width: 340px; height: 340px; background: #ffffff; top: -90px; left: -70px; opacity: .95; }
.b2 { width: 300px; height: 300px; background: #c6d0da; right: -90px; top: 38%; opacity: .75; }
.b3 { width: 320px; height: 320px; background: #dcd5cd; left: 8%; bottom: -110px; opacity: .75; }

.app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 15px calc(28px + env(safe-area-inset-bottom, 0px));
}

/* ========== 液態玻璃面板 ========== */
.glass {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,0.58), rgba(255,255,255,0.22));
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 30px;
    box-shadow:
        0 10px 34px rgba(60,72,90,0.14),
        inset 0 1.5px 1px rgba(255,255,255,0.95),
        inset 0 -1px 1px rgba(255,255,255,0.35);
}
.glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 32%);
    pointer-events: none;
}

.preview {
    padding: 16px;
    width: 100%;
    max-width: 600px;
    text-align: center;
}
.preview h3 {
    position: relative;
    font-size: 15px;
    font-weight: 700;
    color: #5a616b;
    margin-bottom: 12px;
}
canvas {
    display: block;
    margin: 0 auto;
}
#previewCanvas {
    position: relative;
    max-width: 100%;
    max-height: 60vh;
    border-radius: 20px;
    touch-action: none;
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 8px 22px rgba(60,72,90,0.18);
}

.control {
    padding: 20px;
    width: 100%;
    max-width: 400px;
}
.control > * {
    position: relative;
}

button {
    background: none;
    border: none;
    outline: none;
    cursor: pointer;
    font-family: inherit;
}

input {
    width: 100%;
    padding: 12px 14px;
    margin: 0 0 8px;
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 18px;
    font-size: 16px;
    color: #2b2f36;
    background: rgba(255,255,255,0.5);
    box-shadow: inset 0 2px 5px rgba(60,72,90,0.10), 0 1px 0 rgba(255,255,255,0.9);
    outline: none;
    transition: box-shadow .2s, background .2s;
}
input:focus {
    background: rgba(255,255,255,0.72);
    box-shadow: inset 0 2px 5px rgba(60,72,90,0.10), 0 0 0 3px rgba(120,140,165,0.28);
}

.color-group {
    margin: 12px 0;
}
.color-group p {
    font-size: 15px;
    margin-bottom: 8px;
    color: #4a515b;
}
.color-btn-wrap {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}
/* 玻璃珠色票 */
.color-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,0.85), rgba(255,255,255,0) 52%),
        var(--c);
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow:
        0 3px 8px rgba(60,72,90,0.25),
        inset 0 -3px 6px rgba(0,0,0,0.15);
    transition: transform .15s, box-shadow .15s;
}
.color-btn:active {
    transform: scale(0.9);
}
.color-btn.active {
    transform: scale(1.12);
    box-shadow:
        0 0 0 2px #2b2f36,
        0 4px 10px rgba(60,72,90,0.3),
        inset 0 -3px 6px rgba(0,0,0,0.15);
}

.custom-color {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
}
.custom-color label {
    font-size: 14px;
    color: #4a515b;
}
.custom-color input[type="color"] {
    width: 56px;
    height: 40px;
    padding: 4px;
    margin: 0;
    border-radius: 14px;
    cursor: pointer;
}

.preset {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 12px 0;
}
.preset button {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 14px;
    color: #3b424c;
    background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.35));
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow:
        0 3px 10px rgba(60,72,90,0.12),
        inset 0 1px 0 rgba(255,255,255,0.95);
    transition: transform .15s, background .2s;
}
.preset button:active {
    transform: scale(0.95);
    background: rgba(255,255,255,0.8);
}

/* 玻璃按鈕 */
.btn-glass {
    display: block;
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    color: #33393f;
    background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.38));
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow:
        0 6px 16px rgba(60,72,90,0.16),
        inset 0 1.5px 0 rgba(255,255,255,1),
        inset 0 -2px 4px rgba(255,255,255,0.4);
    transition: transform .15s, box-shadow .15s;
}
.btn-glass:active {
    transform: scale(0.97);
    box-shadow:
        0 2px 8px rgba(60,72,90,0.16),
        inset 0 1.5px 0 rgba(255,255,255,1);
}
.upload-btn,
.btn-red,
.btn-dark {
    color: #33393f;
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.78));
    border-color: rgba(255,255,255,1);
    box-shadow:
        0 6px 16px rgba(60,72,90,0.16),
        inset 0 1.5px 0 rgba(255,255,255,1),
        inset 0 -2px 4px rgba(220,225,232,0.5);
}
.upload-btn:active,
.btn-red:active,
.btn-dark:active {
    box-shadow:
        0 2px 8px rgba(60,72,90,0.16),
        inset 0 1.5px 0 rgba(255,255,255,1);
}

.actions {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    width: 100%;
    max-width: 400px;
}
.actions .btn-glass {
    margin-top: 0;
    padding: 10px;
    font-size: 14px;
    flex: 1;
}

#fileInput {
    display: none;
}

/* 儲存視窗 */
.save-mask {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(225,228,232,0.6);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
}
.save-mask.show {
    display: flex;
}
.save-mask img {
    max-width: 100%;
    max-height: 66vh;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 14px 40px rgba(60,72,90,0.3);
    -webkit-touch-callout: default;
    -webkit-user-select: auto;
    user-select: auto;
}
.save-mask p {
    color: #3b424c;
    font-size: 16px;
    margin: 18px 0 8px;
    text-align: center;
    line-height: 1.6;
}
.save-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 360px;
}
.save-actions .btn-glass {
    margin-top: 6px;
}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="app">
    <div class="preview glass">
        <h3>預覽</h3>
        <canvas id="previewCanvas"></canvas>
    </div>

    <div class="actions glass">
        <button class="btn-glass upload-btn" onclick="document.getElementById('fileInput').click()">上傳圖片</button>
        <button class="btn-glass btn-dark" onclick="downloadFinal()">下載圖片</button>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="control glass">
        <input id="text" value="營業中" oninput="liveUpdate()">

        <div class="color-group">
            <p>文字&amp;邊框顏色</p>
            <div class="color-btn-wrap">
                <button class="color-btn active" style="--c:#e53935" onclick="setColor('#e53935',this)"></button>
                <button class="color-btn" style="--c:#0061FE" onclick="setColor('#0061FE',this)"></button>
                <button class="color-btn" style="--c:#4CAF50" onclick="setColor('#4CAF50',this)"></button>
                <button class="color-btn" style="--c:#FF9800" onclick="setColor('#FF9800',this)"></button>
                <button class="color-btn" style="--c:#9C27B0" onclick="setColor('#9C27B0',this)"></button>
                <button class="color-btn" style="--c:#00BCD4" onclick="setColor('#00BCD4',this)"></button>
                <button class="color-btn" style="--c:#795548" onclick="setColor('#795548',this)"></button>
                <button class="color-btn" style="--c:#9E9E9E" onclick="setColor('#9E9E9E',this)"></button>
                <button class="color-btn" style="--c:#000000" onclick="setColor('#000000',this)"></button>
            </div>

            <div class="custom-color">
                <label>自訂顏色：</label>
                <input type="color" id="customColor" oninput="setColor(this.value,this)" onchange="setColor(this.value,this)">
            </div>
        </div>

        <div class="preset">
            <button onclick="set('營業中')">營業中</button>
            <button onclick="set('休息中')">休息中</button>
            <button onclick="set('本日公休')">本日公休</button>
            <button onclick="set('禁止進入')">禁止進入</button>
            <button onclick="set('請勿打擾')">請勿打擾</button>
            <button onclick="set('請勿攝影')">請勿攝影</button>
            <button onclick="set('歡迎參觀')">歡迎參觀</button>
            <button onclick="set('請先付款')">請先付款</button>
            <button onclick="set('禁帶外食')">禁帶外食</button>
            <button onclick="set('冷氣開放中')">冷氣開放中</button>
            <button onclick="set('錄影監視中')">錄影監視中</button>
        </div>

    </div>
</div>

<div class="save-mask" id="saveMask">
    <img id="saveImg" alt="標示牌照片">
    <p>長按圖片，選「加入照片」或「儲存圖片」</p>
    <div class="save-actions">
        <button class="btn-glass" onclick="directDownload()">下載檔案</button>
        <button class="btn-glass" onclick="closeMask()">關閉</button>
    </div>
</div>

<script>
const signCanvas = document.createElement('canvas');
const signCtx = signCanvas.getContext('2d');
let nowColor = "#e53935";

const FIX_WIDTH = 130;
const PADDING = 26;
const FONT_SIZE = 68;
const CHAR_GAP_NORMAL = 90;
const CHAR_GAP_SMALL = 76;
const BORDER = 6;
const RADIUS = 10;
const FONT_FAMILY = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';

let bgImage = null;
const previewCanvas = document.getElementById('previewCanvas');
const previewCtx = previewCanvas.getContext('2d');

let signX = 0, signY = 0;
let signScale = 1;
let isDragging = false;
let startX, startY;
let initialDistance = 0;

/* ---------- 預設背景：程式繪製的店面玻璃門（不依賴外部圖片，一定會顯示） ---------- */
function makeDefaultBg() {
    const W = 1200, H = 900;
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d');

    // 清爽奶油色背景
    let grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fdf3e7');
    grad.addColorStop(1, '#f6e8d3');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // 貓咪後方柔光暈
    grad = g.createRadialGradient(430, 430, 40, 430, 430, 430);
    grad.addColorStop(0, 'rgba(255,244,222,0.9)');
    grad.addColorStop(1, 'rgba(255,244,222,0)');
    g.fillStyle = grad;
    g.beginPath();
    g.arc(430, 430, 430, 0, Math.PI * 2);
    g.fill();

    // 地面陰影
    g.fillStyle = 'rgba(120,90,60,0.08)';
    g.beginPath();
    g.ellipse(430, 762, 230, 28, 0, 0, Math.PI * 2);
    g.fill();

    const catColor = '#eab676';
    const catColorDark = '#d99c5c';
    const belly = '#fbe9d2';
    const earInner = '#f6cfd2';
    const ink = '#5b4636';

    // 尾巴
    g.fillStyle = catColor;
    g.beginPath();
    g.moveTo(600, 700);
    g.quadraticCurveTo(760, 680, 742, 515);
    g.quadraticCurveTo(730, 415, 638, 438);
    g.quadraticCurveTo(702, 478, 692, 558);
    g.quadraticCurveTo(702, 660, 578, 690);
    g.closePath();
    g.fill();

    // 身體
    g.fillStyle = catColor;
    g.beginPath();
    g.ellipse(430, 620, 190, 150, 0, 0, Math.PI * 2);
    g.fill();

    // 肚子
    g.fillStyle = belly;
    g.beginPath();
    g.ellipse(430, 672, 108, 88, 0, 0, Math.PI * 2);
    g.fill();

    // 頭
    g.fillStyle = catColor;
    g.beginPath();
    g.arc(430, 430, 150, 0, Math.PI * 2);
    g.fill();

    // 耳朵
    function ear(cx, dir) {
        g.fillStyle = catColor;
        g.beginPath();
        g.moveTo(cx, 330);
        g.lineTo(cx + dir * 70, 228);
        g.lineTo(cx + dir * 122, 352);
        g.closePath();
        g.fill();
        g.fillStyle = earInner;
        g.beginPath();
        g.moveTo(cx + dir * 15, 320);
        g.lineTo(cx + dir * 55, 260);
        g.lineTo(cx + dir * 86, 336);
        g.closePath();
        g.fill();
    }
    ear(372, -1);
    ear(488, 1);

    // 虎斑紋
    g.strokeStyle = catColorDark;
    g.lineWidth = 9;
    g.lineCap = 'round';
    [[352, 300, 334, 258], [430, 278, 430, 232], [508, 300, 526, 258]].forEach(p => {
        g.beginPath();
        g.moveTo(p[0], p[1]);
        g.lineTo(p[2], p[3]);
        g.stroke();
    });

    // 瞇眼笑臉
    g.strokeStyle = ink;
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(370, 430);
    g.quadraticCurveTo(390, 408, 410, 430);
    g.stroke();
    g.beginPath();
    g.moveTo(450, 430);
    g.quadraticCurveTo(470, 408, 490, 430);
    g.stroke();

    // 鼻子
    g.fillStyle = '#e7869a';
    g.beginPath();
    g.moveTo(420, 450);
    g.lineTo(440, 450);
    g.lineTo(430, 465);
    g.closePath();
    g.fill();

    // 嘴巴
    g.strokeStyle = ink;
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(430, 465);
    g.quadraticCurveTo(430, 480, 414, 477);
    g.moveTo(430, 465);
    g.quadraticCurveTo(430, 480, 446, 477);
    g.stroke();

    // 鬍鬚
    g.strokeStyle = 'rgba(91,70,54,0.5)';
    g.lineWidth = 3;
    [[300, 445, 215, 434], [300, 460, 210, 460], [300, 475, 215, 490]].forEach(p => {
        g.beginPath();
        g.moveTo(p[0], p[1]);
        g.lineTo(p[2], p[3]);
        g.stroke();
    });
    [[560, 445, 645, 434], [560, 460, 650, 460], [560, 475, 645, 490]].forEach(p => {
        g.beginPath();
        g.moveTo(p[0], p[1]);
        g.lineTo(p[2], p[3]);
        g.stroke();
    });

    // 前腳
    g.fillStyle = catColor;
    g.beginPath(); g.ellipse(362, 756, 44, 30, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(470, 756, 44, 30, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = belly;
    g.beginPath(); g.ellipse(362, 762, 28, 15, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(470, 762, 28, 15, 0, 0, Math.PI * 2); g.fill();

    // 左側小盆栽，增添清新感（避開右側標示牌放置區）
    g.fillStyle = '#ddc9a8';
    g.beginPath();
    g.moveTo(90, 712); g.lineTo(190, 712); g.lineTo(176, 790); g.lineTo(106, 790);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(120,90,50,0.08)';
    g.beginPath(); g.ellipse(140, 794, 56, 8, 0, 0, Math.PI * 2); g.fill();
    const leafColor = '#9bc79e';
    [[140, 650, 20, 62, 0], [114, 672, 16, 48, -0.55], [168, 672, 16, 48, 0.55]].forEach(l => {
        g.fillStyle = leafColor;
        g.beginPath();
        g.ellipse(l[0], l[1], l[2], l[3], l[4], 0, Math.PI * 2);
        g.fill();
        g.fillStyle = 'rgba(255,255,255,0.22)';
        g.beginPath();
        g.ellipse(l[0] - l[2] * 0.25, l[1] - l[3] * 0.3, l[2] * 0.4, l[3] * 0.7, l[4], 0, Math.PI * 2);
        g.fill();
    });

    return c;
}

/* ---------- 版面配置 ---------- */
function clampSign() {
    const cw = previewCanvas.width, ch = previewCanvas.height;
    if (!cw) return;
    const maxH = ch * 0.9, maxW = cw * 0.9;
    if (signCanvas.height * signScale > maxH) signScale = maxH / signCanvas.height;
    if (signCanvas.width * signScale > maxW) signScale = maxW / signCanvas.width;
    const w = signCanvas.width * signScale;
    const h = signCanvas.height * signScale;
    signX = Math.min(Math.max(signX, 0), cw - w);
    signY = Math.min(Math.max(signY, 0), ch - h);
}

// 標示牌初始位置：高度約佔畫面一半，靠右置中
function placeSign() {
    const cw = previewCanvas.width, ch = previewCanvas.height;
    signScale = Math.min(1, (ch * 0.5) / signCanvas.height);
    const w = signCanvas.width * signScale;
    const h = signCanvas.height * signScale;
    signX = cw - w - cw * 0.08;
    signY = (ch - h) / 2;
    clampSign();
}

function setBackground(img) {
    bgImage = img;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const scale = Math.min(800 / iw, 600 / ih);
    previewCanvas.width = Math.max(1, Math.floor(iw * scale));
    previewCanvas.height = Math.max(1, Math.floor(ih * scale));
    placeSign();
    renderPreview();
}

/* ---------- 事件 ---------- */
previewCanvas.addEventListener('mousedown', startDrag);
previewCanvas.addEventListener('mousemove', drag);
previewCanvas.addEventListener('mouseup', endDrag);
previewCanvas.addEventListener('mouseleave', endDrag);
previewCanvas.addEventListener('touchstart', handleTouch, { passive: false });
previewCanvas.addEventListener('touchmove', handleTouch, { passive: false });
previewCanvas.addEventListener('touchend', endDrag);

// 螢幕座標 → 畫布座標（畫布被縮小顯示時也能對準）
function getPos(clientX, clientY) {
    const rect = previewCanvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (previewCanvas.width / rect.width),
        y: (clientY - rect.top) * (previewCanvas.height / rect.height)
    };
}

function refresh() {
    drawSign();
    clampSign();
    renderPreview();
}

// 確保中文字型載入完成後再重畫，避免顯示成預設字型
function ensureFont() {
    if (!document.fonts || !document.fonts.load) return;
    const t = document.getElementById('text').value || '營業中';
    document.fonts.load('700 ' + FONT_SIZE + 'px "Noto Sans TC"', t)
        .then(refresh)
        .catch(() => {});
}

function setColor(color, dom) {
    nowColor = color;
    document.querySelectorAll('.color-btn').forEach(item => item.classList.remove('active'));
    if (dom && dom.classList && dom.classList.contains('color-btn')) dom.classList.add('active');
    refresh();
}

function set(t) {
    document.getElementById('text').value = t;
    refresh();
    ensureFont();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawSign() {
    const txt = document.getElementById('text').value.trim();
    let chars = Array.from(txt);
    if (!chars.length) chars = ['\u3000'];
    const len = chars.length;
    const gap = len >= 5 ? CHAR_GAP_SMALL : CHAR_GAP_NORMAL;
    const textH = (len - 1) * gap + FONT_SIZE;
    const totalH = PADDING + textH + PADDING;

    signCanvas.width = FIX_WIDTH;
    signCanvas.height = totalH;
    signCtx.clearRect(0, 0, FIX_WIDTH, totalH);

    roundRect(signCtx, BORDER, BORDER, FIX_WIDTH - BORDER * 2, totalH - BORDER * 2, RADIUS);
    signCtx.fillStyle = "#fff";
    signCtx.fill();
    signCtx.strokeStyle = nowColor;
    signCtx.lineWidth = BORDER;
    signCtx.stroke();

    signCtx.fillStyle = nowColor;
    signCtx.textAlign = "center";
    signCtx.textBaseline = "middle";
    signCtx.font = `bold ${FONT_SIZE}px ${FONT_FAMILY}`;

    let sy = PADDING + FONT_SIZE / 2;
    chars.forEach((c, i) => {
        signCtx.fillText(c, FIX_WIDTH / 2, sy + i * gap);
    });
}

function renderPreview() {
    if (!previewCanvas.width) return;
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    previewCtx.imageSmoothingEnabled = true;
    previewCtx.imageSmoothingQuality = 'high';

    if (bgImage) {
        previewCtx.drawImage(bgImage, 0, 0, previewCanvas.width, previewCanvas.height);
    }
    const w = signCanvas.width * signScale;
    const h = signCanvas.height * signScale;
    previewCtx.drawImage(signCanvas, signX, signY, w, h);
}

let fontTimer = null;
function liveUpdate() {
    refresh();
    clearTimeout(fontTimer);
    fontTimer = setTimeout(ensureFont, 150);
}

function redrawSign() {
    refresh();
    ensureFont();
}

document.getElementById('fileInput').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
        setBackground(img);
        URL.revokeObjectURL(url);
    };
    img.onerror = function () {
        URL.revokeObjectURL(url);
        alert('這張圖片無法讀取，請換一張試試');
    };
    img.src = url;
    e.target.value = '';
});

function startDrag(e) {
    isDragging = true;
    const p = getPos(e.clientX, e.clientY);
    startX = p.x - signX;
    startY = p.y - signY;
}

function drag(e) {
    if (!isDragging) return;
    const p = getPos(e.clientX, e.clientY);
    signX = p.x - startX;
    signY = p.y - startY;
    renderPreview();
}

function endDrag() {
    isDragging = false;
    initialDistance = 0;
}

function getDistance(t1, t2) {
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function handleTouch(e) {
    e.preventDefault();
    const touches = e.touches;

    if (touches.length === 1) {
        const t = touches[0];
        const p = getPos(t.clientX, t.clientY);
        if (e.type === 'touchstart') {
            isDragging = true;
            startX = p.x - signX;
            startY = p.y - signY;
        } else if (e.type === 'touchmove' && isDragging) {
            signX = p.x - startX;
            signY = p.y - startY;
            renderPreview();
        }
    }

    if (touches.length === 2) {
        const dist = getDistance(touches[0], touches[1]);
        if (initialDistance > 0) {
            const scale = dist / initialDistance;
            signScale *= scale;
            if (signScale < 0.2) signScale = 0.2;
            if (signScale > 3) signScale = 3;
            renderPreview();
        }
        initialDistance = dist;
    }
}

/* ---------- 儲存到手機 ---------- */
let lastBlob = null;
let lastUrl = null;

function buildFinalCanvas() {
    const tempCanvas = document.createElement('canvas');
    let finalWidth, finalHeight;
    if (bgImage) {
        const iw = bgImage.naturalWidth || bgImage.width;
        const ih = bgImage.naturalHeight || bgImage.height;
        // 保持原圖尺寸；只有超過手機畫布上限(約1600萬像素)時才縮小
        const MAX_PIXELS = 16000000;
        const scale = Math.min(1, Math.sqrt(MAX_PIXELS / (iw * ih)));
        finalWidth = Math.floor(iw * scale);
        finalHeight = Math.floor(ih * scale);
    } else {
        finalWidth = previewCanvas.width;
        finalHeight = previewCanvas.height;
    }

    tempCanvas.width = finalWidth;
    tempCanvas.height = finalHeight;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.imageSmoothingEnabled = true;
    tempCtx.imageSmoothingQuality = 'high';

    if (bgImage) {
        tempCtx.drawImage(bgImage, 0, 0, finalWidth, finalHeight);
    }

    const ratio = finalWidth / previewCanvas.width;
    tempCtx.drawImage(
        signCanvas,
        signX * ratio,
        signY * ratio,
        signCanvas.width * signScale * ratio,
        signCanvas.height * signScale * ratio
    );
    return tempCanvas;
}

async function downloadFinal() {
    const canvas = buildFinalCanvas();
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) {
        alert('圖片產生失敗，請再試一次');
        return;
    }
    lastBlob = blob;

    const file = new File([blob], '標示牌.png', { type: 'image/png' });

    // 方法一：手機系統分享選單（iOS 選「儲存影像」、Android 可存到相簿/檔案）
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            await navigator.share({ files: [file], title: '標示牌' });
            return;
        } catch (err) {
            if (err && err.name === 'AbortError') return;
        }
    }

    // 方法二：備用 - 顯示圖片，讓使用者長按儲存（電腦則可直接下載）
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    document.getElementById('saveImg').src = lastUrl;
    document.getElementById('saveMask').classList.add('show');
}

function directDownload() {
    if (!lastUrl) return;
    const a = document.createElement('a');
    a.href = lastUrl;
    a.download = '標示牌.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
}

function closeMask() {
    document.getElementById('saveMask').classList.remove('show');
}

/* ---------- 初始化 ---------- */
drawSign();
setBackground(makeDefaultBg());
ensureFont();
</script>
