<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#b9e3fd" />
  <title>KARMAWEI_</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 1.2px;
    }

    /* 網頁外層：統一背景色，確保 Safari 上下絕無異色或白邊 */
    html, body {
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #b9e3fd;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 圓角矩形天空容器 */
    .sky-container {
      width: 100%;
      max-width: 480px;
      min-height: 85dvh;
      margin: 20px 16px;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 45%),
        radial-gradient(circle at 80% 60%, rgba(255, 255, 255, 0.9) 0%, transparent 50%),
        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 40%),
        linear-gradient(135deg, #a8d8fc 0%, #d8f0ff 50%, #eef6ff 100%);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 40px rgba(148, 163, 184, 0.25);
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-controls {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .controls-box {
      display: inline-flex;
      gap: 14px;
      padding: 10px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .btn {
      padding: 8px 18px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .btn:hover {
      background: #ffffff;
    }

    /* 網格與精巧縮小的卡片設定 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 400px;
      justify-items: center;
    }

    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--glass-shadow);
      width: 100%;
      max-width: 95px;
      transform: none !important;
      transition: none !important;
    }

    .card-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 2px;
      z-index: 2;
    }

    .icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      box-shadow: 0 2px 4px rgba(148, 163, 184, 0.15);
    }

    .icon-btn.delete:hover {
      background: var(--danger);
      color: white;
    }

    .card-img-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      margin-bottom: 5px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    /* Modal 視窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(148, 163, 184, 0.2);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-sub);
    }

    .form-group input[type="text"],
    .form-group input[type="url"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255, 255, 255, 0.85);
      outline: none;
      font-size: 0.9rem;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-row input {
      flex: 1;
    }

    .upload-btn {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .upload-btn:hover {
      background: #ffffff;
    }

    /* 圖片裁剪互動區樣式 */
    .crop-container {
      margin-top: 10px;
      padding: 12px;
      background: rgba(241, 245, 249, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      display: none;
    }
    .crop-container.active {
      display: block;
    }
    .crop-view {
      width: 130px;
      height: 130px;
      margin: 0 auto 10px auto;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid #3b82f6;
      background: #ffffff;
      cursor: grab;
      touch-action: none;
    }
    .crop-view:active {
      cursor: grabbing;
    }
    #cropImg {
      position: absolute;
      transform-origin: 0 0;
      user-select: none;
      pointer-events: none;
    }
    .zoom-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .zoom-control span {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 600;
    }
    .zoom-control input[type="range"] {
      flex: 1;
      accent-color: #3b82f6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--glass-border);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(148, 163, 184, 0.15);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 圓角矩形天空容器 -->
  <div class="sky-container">
    <div class="top-controls">
      <div class="controls-box">
        <button class="btn" id="addBtn">新增連結</button>
        <button class="btn" id="copyCodeBtn">複製代碼</button>
      </div>
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- 新增/編輯 Modal 視窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle" style="margin-bottom:16px;font-size:1.1rem;">新增連結</h2>
      <form id="cardForm">
        <input type="hidden" id="cardId">
        <div class="form-group">
          <label>名稱</label>
          <input type="text" id="inputName" required />
        </div>
        <div class="form-group">
          <label>網址</label>
          <input type="url" id="inputUrl" required />
        </div>
        <div class="form-group">
          <label>連結網址圖片 URL:</label>
          <div class="input-row">
            <input type="url" id="inputImg" placeholder="https://example.com/image.jpg" required />
            <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">📷 上傳圖片</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
          </div>
          
          <!-- 互動式圖片放大縮小與選取範圍工具 -->
          <div class="crop-container" id="cropContainer">
            <label style="margin-bottom:6px; text-align:center;">調整顯示範圍（拖曳移動、拉桿縮放）</label>
            <div class="crop-view" id="cropView">
              <img id="cropImg" alt="Crop Preview" />
            </div>
            <div class="zoom-control">
              <span>縮放</span>
              <input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1" />
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">取消</button>
          <button type="submit" class="btn">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 複製成功提示 Toast -->
  <div class="toast" id="toast">複製成功</div>

  <script>
    var defaultCards = [
      { id: '1', name: 'Google', url: 'https://www.google.com', img: 'https://www.google.com/favicon.ico' },
      { id: '2', name: 'GitHub', url: 'https://github.com', img: 'https://github.githubassets.com/favicons/favicon.png' }
    ];

    var cards = [];
    var cropImageObj = null;
    var cropState = { scale: 1, x: 0, y: 0, isDragging: false, startX: 0, startY: 0 };

    function loadData() {
      try {
        var saved = localStorage.getItem('karmawei_links_storage');
        if (saved) {
          var parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (err) {}
      return defaultCards;
    }

    function render() {
      var grid = document.getElementById('cardGrid');
      if (!grid) return;
      grid.innerHTML = '';
      
      if (!Array.isArray(cards)) {
        cards = defaultCards;
      }

      cards.forEach(function(card, index) {
        var el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = [
          '<div class="card-actions">',
            index > 0 ? '<button type="button" class="icon-btn" onclick="moveCard(' + index + ', -1)">◄</button>' : '',
            index < cards.length - 1 ? '<button type="button" class="icon-btn" onclick="moveCard(' + index + ', 1)">►</button>' : '',
            '<button type="button" class="icon-btn" onclick="editCard(\'' + card.id + '\')">✎</button>',
            '<button type="button" class="icon-btn delete" onclick="deleteCard(\'' + card.id + '\')">✕</button>',
          '</div>',
          '<div class="card-img-wrapper">',
            '<img class="card-img" src="' + card.img + '" alt="' + card.name + '" onerror="this.src=\'https://via.placeholder.com/48/ffffff/000000?text=Error\'">',
          '</div>',
          '<div class="card-title">' + card.name + '</div>'
        ].join('');
        grid.appendChild(el);
      });

      try {
        localStorage.setItem('karmawei_links_storage', JSON.stringify(cards));
      } catch (e) {
        alert('警告：儲存空間不足！');
      }
    }

    window.moveCard = function(index, direction) {
      var target = index + direction;
      if (target < 0 || target >= cards.length) return;
      var temp = cards[index];
      cards[index] = cards[target];
      cards[target] = temp;
      render();
    };

    window.deleteCard = function(id) {
      cards = cards.filter(function(c) { return c.id !== id; });
      render();
    };

    window.openModal = function(card) {
      var overlay = document.getElementById('modalOverlay');
      var title = document.getElementById('modalTitle');
      var idInput = document.getElementById('cardId');
      var nameInput = document.getElementById('inputName');
      var urlInput = document.getElementById('inputUrl');
      var imgInput = document.getElementById('inputImg');
      var form = document.getElementById('cardForm');
      var cropContainer = document.getElementById('cropContainer');

      if (!overlay || !form) return;

      overlay.classList.add('active');
      cropContainer.classList.remove('active');

      if (card) {
        title.textContent = '編輯連結';
        idInput.value = card.id;
        nameInput.value = card.name;
        urlInput.value = card.url;
        imgInput.value = card.img;
      } else {
        title.textContent = '新增連結';
        form.reset();
        idInput.value = '';
      }
    };

    window.closeModal = function() {
      var overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.classList.remove('active');
      document.getElementById('cropContainer').classList.remove('active');
    };

    window.editCard = function(id) {
      var card = cards.find(function(c) { return c.id === id; });
      if (card) openModal(card);
    };

    /* 圖片上傳與互動式裁切初始化 */
    document.getElementById('fileInput').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(event) {
          var img = new Image();
          img.onload = function() {
            cropImageObj = img;
            var cropContainer = document.getElementById('cropContainer');
            var cropImgEl = document.getElementById('cropImg');
            cropImgEl.src = img.src;
            cropContainer.classList.add('active');

            // 初始化縮放與置中
            var viewSize = 130;
            var initialScale = Math.max(viewSize / img.width, viewSize / img.height);
            cropState.scale = initialScale;
            document.getElementById('zoomRange').value = initialScale;
            cropState.x = (viewSize - img.width * initialScale) / 2;
            cropState.y = (viewSize - img.height * initialScale) / 2;
            updateCropTransform();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function updateCropTransform() {
      var cropImgEl = document.getElementById('cropImg');
      if (!cropImageObj) return;
      cropImgEl.style.width = cropImageObj.width + 'px';
      cropImgEl.style.height = cropImageObj.height + 'px';
      cropImgEl.style.transform = 'translate(' + cropState.x + 'px, ' + cropState.y + 'px) scale(' + cropState.scale + ')';
    }

    // 拖曳與觸控平移邏輯
    var cropView = document.getElementById('cropView');
    
    function startDrag(clientX, clientY) {
      cropState.isDragging = true;
      cropState.startX = clientX - cropState.x;
      cropState.startY = clientY - cropState.y;
    }
    function onDrag(clientX, clientY) {
      if (!cropState.isDragging) return;
      cropState.x = clientX - cropState.startX;
      cropState.y = clientY - cropState.startY;
      updateCropTransform();
    }
    function endDrag() {
      cropState.isDragging = false;
    }

    cropView.addEventListener('mousedown', function(e) { startDrag(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function(e) { onDrag(e.clientX, e.clientY); });
    window.addEventListener('mouseup', endDrag);

    cropView.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    });
    window.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) {
        onDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    });
    window.addEventListener('touchend', endDrag);

    // 縮放滑桿連動
    document.getElementById('zoomRange').addEventListener('input', function(e) {
      var newScale = parseFloat(e.target.value);
      var viewSize = 130;
      // 以中心點進行縮放
      var centerX = viewSize / 2;
      var centerY = viewSize / 2;
      var imgX = (centerX - cropState.x) / cropState.scale;
      var imgY = (centerY - cropState.y) / cropState.scale;
      
      cropState.scale = newScale;
      cropState.x = centerX - imgX * cropState.scale;
      cropState.y = centerY - imgY * cropState.scale;
      updateCropTransform();
    });

    document.getElementById('addBtn').onclick = function() { openModal(); };
    document.getElementById('cancelBtn').onclick = closeModal;

    document.getElementById('cardForm').onsubmit = function(e) {
      e.preventDefault();
      var id = document.getElementById('cardId').value;
      var name = document.getElementById('inputName').value;
      var url = document.getElementById('inputUrl').value;
      var imgUrl = document.getElementById('inputImg').value;

      // 如果有進行裁剪互動，透過 Canvas 產生最終 1:1 裁切圖片
      var cropContainer = document.getElementById('cropContainer');
      if (cropContainer.classList.contains('active') && cropImageObj) {
        var canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        var ctx = canvas.getContext('2d');
        var viewSize = 130;
        var ratio = 128 / viewSize;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 128, 128);

        ctx.save();
        ctx.scale(ratio, ratio);
        ctx.translate(cropState.x, cropState.y);
        ctx.scale(cropState.scale, cropState.scale);
        ctx.drawImage(cropImageObj, 0, 0);
        ctx.restore();

        imgUrl = canvas.toDataURL('image/jpeg', 0.85);
      }

      if (id) {
        var card = cards.find(function(c) { return c.id === id; });
        if (card) {
          card.name = name;
          card.url = url;
          card.img = imgUrl;
        }
      } else {
        cards.push({ id: Date.now().toString(), name, url, img: imgUrl });
      }
      render();
      closeModal();
    };

    document.getElementById('copyCodeBtn').onclick = function() {
      var html = [
'<!DOCTYPE html>',

'        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 40%),',
'        linear-gradient(135deg, #a8d8fc 0%, #d8f0ff 50%, #eef6ff 100%);',
'      border-radius: 36px; border: 1px solid rgba(255, 255, 255, 0.9);',
'      box-shadow: 0 20px 40px rgba(148, 163, 184, 0.25); padding: 28px 16px;',

  return [

'        <div class="card-img-wrapper"><img class="card-img" src="' + c.img + '" alt="' + c.name + '" onerror="this.src=\'https://via.placeholder.com/48/ffffff/000000?text=Error\'"></div>',

'      </a>'
  ].join('\n');
}).join('\n'),
'    </div>',
'  </div>',
'</body>',
'</html>'
      ].join('\n');

      navigator.clipboard.writeText(html).then(function() {
        var toast = document.getElementById('toast');
        if (toast) {
          toast.classList.add('show');
          setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }
      });
    };

    cards = loadData();
    render();
  </script>
</body>
</html>
