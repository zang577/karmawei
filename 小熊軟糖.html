<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小熊軟糖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字型：Noto Sans TC（SIL OFL 授權，可商用） -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{color-scheme:light;--ink:#4b4f57;--mute:#8b9098;--line:rgba(255,255,255,.8)}
*{box-sizing:border-box;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
background:radial-gradient(420px 420px at 12% 6%,#ffffff 0,transparent 70%),radial-gradient(480px 480px at 95% 30%,#dcdfe3 0,transparent 70%),radial-gradient(520px 520px at 10% 85%,#e4e6e9 0,transparent 70%),#efefee;background-attachment:fixed}
.wrap{width:100%;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 32px)}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.74),rgba(255,255,255,.36));backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(120,125,135,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(170,175,185,.25)}
#pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;padding:8px 10px 10px}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 8px}
.hd h1{margin:0;font-size:18px;font-weight:700}
.hd span{font-size:12px;color:var(--mute)}
#stage{position:relative;height:168px;border-radius:20px;background:linear-gradient(160deg,#fbfbfa,#e5e7ea);display:flex;justify-content:center;overflow:hidden;box-shadow:inset 0 2px 8px rgba(150,155,165,.18)}
#box{position:relative;height:100%;aspect-ratio:400/480}#box>*{position:absolute;left:0;top:0;width:100%;height:100%;display:block}#box svg{width:100%;height:100%;display:block}.kv{display:none}#box.gl .sv{display:none}
.bar{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:0 4px;white-space:nowrap;height:38px;border-radius:19px;border:1px solid var(--line);font:500 13px 'Noto Sans TC',sans-serif;color:var(--ink);cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(228,230,233,.7));box-shadow:0 3px 10px rgba(120,125,135,.18),inset 0 1px 0 #fff}
.btn.main{flex:1.25;background:linear-gradient(160deg,#6a6f79,#4b4f57);color:#fff;border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.97)}
.card{margin-top:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--ink)}
.bears{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.bears div{text-align:center;font-size:11px;color:var(--mute)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(100,105,115,.3),inset 0 -3px 5px rgba(0,0,0,.08)}
.sw.on{outline:2px solid #5a5f69;outline-offset:2px}
.bears .sw{width:30px;height:30px;margin-bottom:3px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{padding:7px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.5);font:500 13px 'Noto Sans TC',sans-serif;color:var(--ink);cursor:pointer}
.tab.on{background:#555a64;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.it{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(222,225,229,.6));padding:4px 4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:400 11px 'Noto Sans TC',sans-serif;color:var(--ink);box-shadow:0 2px 6px rgba(120,125,135,.14)}
.it svg{width:100%;flex:1;min-height:0}
.it.on{outline:2px solid #5a5f69;outline-offset:1px}
.pal{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.mut{font-size:12px;color:var(--mute);margin:10px 0 6px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:20px;font-size:13px;background:rgba(75,79,87,.92);color:#fff;transition:.3s;z-index:60;max-width:90%;text-align:center}
#toast.s{opacity:1;transform:translate(-50%,0)}
#md{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(220,222,226,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px}
#md.s{display:flex}
#md .glass{padding:16px;max-width:360px;width:100%;text-align:center}
#md img{width:100%;border-radius:16px;display:block;margin-bottom:10px;-webkit-touch-callout:default}
#md p{margin:0 0 10px;font-size:13px}
#stage{touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
#stage.drag{cursor:grabbing}
#rot{display:flex;gap:6px;flex:none}
#rot button{height:38px;min-width:38px;padding:0 8px;border-radius:19px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(228,230,233,.7));color:var(--ink);cursor:pointer;box-shadow:0 2px 6px rgba(120,125,135,.18)}
#rot button:active{transform:scale(.96)}
#rot.off{display:none}
#ldg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8b9098;font-size:13px;pointer-events:none}
#ldg svg{width:54px;height:54px;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#stage.ok #ldg{display:none}
#fbn{display:none;font-size:12px;color:var(--mute);margin:8px 2px 0}
.bar2{display:flex;gap:8px;margin-top:8px}
.lockrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin:0 0 10px}
.bgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
.bgs>button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.bgs>button.on{box-shadow:0 0 0 2.5px #4b4f57}
</style>
</head>
<body>
<div class="wrap">
  <section id="pv" class="glass">
        <div id="stage"><div id="box"><div id="s1" class="sv"></div><canvas id="k1" class="kv" width="800" height="960"></canvas><canvas id="cv" width="480" height="576"></canvas><div id="s2" class="sv"></div><canvas id="k2" class="kv" width="800" height="960"></canvas><canvas id="ca" width="480" height="576"></canvas><div id="s3" class="sv"></div><canvas id="k3" class="kv" width="800" height="960"></canvas><canvas id="ch" width="480" height="576"></canvas><div id="s4" class="sv"></div><canvas id="k4" class="kv" width="800" height="960"></canvas></div><div id="ldg"><svg viewBox="0 0 64 64"><circle cx="16" cy="16" r="9" fill="#f0c36a"/><circle cx="48" cy="16" r="9" fill="#f0c36a"/><circle cx="32" cy="36" r="22" fill="#f6cf7a"/><circle cx="24" cy="32" r="2.4" fill="#6b4a14"/><circle cx="40" cy="32" r="2.4" fill="#6b4a14"/><ellipse cx="32" cy="42" rx="5" ry="3.6" fill="#e9a94a"/></svg><span>小熊準備中…</span></div></div>
    <div class="bar"><div id="rot"><button onclick="rotBy(-45)" aria-label="向左轉"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true" style="display:block;margin:auto"><path d="M12 1.5v11L2 7z"/></svg></button><button onclick="rotTo(0)" aria-label="正面"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true" style="display:block;margin:auto"><circle cx="7" cy="7" r="5.2"/></svg></button><button onclick="rotBy(45)" aria-label="向右轉"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true" style="display:block;margin:auto"><path d="M2 1.5v11L12 7z"/></svg></button></div><button class="btn" onclick="undo()">上一步</button><button class="btn" onclick="redo()">下一步</button></div>
    <div class="bar"><button class="btn main" style="flex:1.6" onclick="save()">下載圖片</button><button class="btn" onclick="rnd()">隨機搭配</button><button class="btn" onclick="clr()">重置</button></div>
    <div id="fbn"></div>
  </section>

  <section class="card glass"><h2>軟糖顏色</h2><div class="bears" id="bears"></div></section>
  <section class="card glass"><h2>擺姿勢</h2><div id="poses" style="display:flex;flex-wrap:wrap;gap:8px"></div></section>

  <section class="card glass">
    <h2>服飾配件</h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div class="mut">配件顏色</div>
    <div class="pal" id="pal"></div>
  </section>
</div>

<section class="card glass" style="margin:12px"><h2>背景</h2><div class="bgs" id="bgs"></div></section>
<div id="md"><div class="glass"><img id="mi" alt="小熊軟糖"><p>長按圖片，選擇「加入照片」或「儲存圖片」即可存到手機相簿</p><button class="btn" style="width:100%" onclick="md.classList.remove('s')">關閉</button></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const mix=(h,t)=>{const n=parseInt(h.slice(1),16),f=t<0?0:255,p=Math.abs(t);return '#'+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(f-v)*p).toString(16).padStart(2,'0')).join('')};
const P=['#e5121f','#f58a12','#f6d62a','#8dc63f','#2a9fca','#a46fe0','#f3829e','#ffffff','#c3b091','#26262b','#9aa0a6','#3f63a6'];
const G='#f0c75e';
const BEAR=[['草莓','#e5121f',1],['橘子','#f58a12',1],['柳橙','#f7b01c',1],['檸檬','#f6d62a',1],['青蘋','#8dc63f',1],['藍莓','#2a9fca',1],['水蜜桃','#f3829e',1],['透明','#f0e08c',.89]];
const W_=y=>74*Math.sqrt(Math.max(0,1-((y-298)/104)**2));
const TP=(y0,y1,m=4,hem=14)=>{const L=[],R=[];for(let y=y0;y<=y1;y+=6){const w=W_(y)+m;L.push((200-w).toFixed(1)+' '+y);R.unshift((200+w).toFixed(1)+' '+y)}return 'M'+L.join(' L')+' Q200 '+(y1+hem)+' '+R[0]+' L'+R.join(' L')+' Q200 '+(y0-9)+' '+L[0]+'Z'};
const T=TP(213,346,5,16);
const SL=(c,ry=30)=>{const lg=ry>40,e=lg?[121,294]:[135,278],w=lg?58:62,q=(x0,x1,y1)=>`<path d="M${x0} 262 L${x1} ${y1}" stroke="${c}" stroke-opacity="1" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;return `<g class="sl">${q(149,e[0],e[1])}${q(251,400-e[0],e[1])}</g>`};
const H=(x,y,s,f)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 12 C-16 0 -12 -14 -2 -14 Q0 -13 0 -9 Q0 -13 2 -14 C12 -14 16 0 0 12Z" fill="${f}"/>`;
const ST=(x,y,r,f)=>`<polygon points="${[...Array(10)].map((_,i)=>{const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;return (x+q*Math.cos(a)).toFixed(1)+','+(y+q*Math.sin(a)).toFixed(1)}).join(' ')}" fill="${f}"/>`;
const AP=n=>[...Array(n)].map((_,i)=>{const t=(i+.5)/n,u=1-t;return[u*u*150+2*t*u*200+t*t*250,u*u*224+2*t*u*268+t*t*224]});
const CH='M150 224 Q200 268 250 224';
const SH=f=>[157,243].map(x=>`<g transform="translate(${x} 410) scale(.84) translate(${-x} -410)">${f(x)}</g>`).join('');

const CATS=[
{id:'hat',name:'帽子',vb:'90 0 220 125',items:[
['毛帽',(c,d,l)=>`<path d="M140 106 Q140 40 200 38 Q260 40 260 106Z" fill="${c}"/><path d="M170 52V94M200 40V94M230 52V94" stroke="${d}" stroke-opacity=".4" stroke-width="3"/><rect x="134" y="94" width="132" height="22" rx="11" fill="${d}"/><circle cx="200" cy="34" r="14" fill="${l}"/>`],
['高帽',(c,d,l)=>`<ellipse cx="200" cy="98" rx="76" ry="13" fill="${d}"/><rect x="158" y="28" width="84" height="72" rx="7" fill="${c}"/><rect x="158" y="76" width="84" height="15" fill="${l}"/>`],
['皇冠',(c)=>`<polygon points="148,102 154,50 178,76 200,40 222,76 246,50 252,102" fill="${G}"/><rect x="148" y="94" width="104" height="12" rx="5" fill="#e0aa3e"/><circle cx="200" cy="86" r="6" fill="${c}"/><circle cx="170" cy="88" r="4" fill="${c}"/><circle cx="230" cy="88" r="4" fill="${c}"/>`],
['派對帽',(c,d,l)=>`<clipPath id="pcl"><path d="M222 24 L248 106 L168 106Z"/></clipPath><path d="M222 24 L248 106 L168 106Z" fill="${c}"/><g clip-path="url(#pcl)" stroke="${c==='#ffffff'?'#c3c6cc':'#fff'}" stroke-width="6">${[0,1,2,3,4,5,6].map(i=>`<path d="M160 ${112-i*14.3}L260 ${81-i*14.3}"/>`).join('')}</g><circle cx="222" cy="22" r="10" fill="#fff"/>`],
['棒球帽',(c,d,l)=>`<path d="M142 102 Q148 46 205 46 Q256 50 258 102Z" fill="${c}"/><path d="M232 92 Q300 90 308 106 Q270 112 230 104Z" fill="${d}"/><circle cx="205" cy="46" r="6" fill="${d}"/>`],
['光環',()=>`<ellipse cx="200" cy="62" rx="42" ry="10" fill="none" stroke="${G}" stroke-width="8"/>`],
['三角錐',(c,d)=>`<path d="M200 22 L238 100 L162 100Z" fill="${c}"/><path d="M189 50 L211 50 L216 62 L184 62Z" fill="${c==='#ffffff'?'#c3c6cc':'#fff'}"/><path d="M176 80 L224 80 L229 91 L171 91Z" fill="${c==='#ffffff'?'#c3c6cc':'#fff'}"/><rect x="150" y="98" width="100" height="11" rx="4" fill="${d}"/>`]]},
{id:'hair',name:'髮飾',vb:'110 30 180 120',items:[
['蝴蝶結',(c,d)=>`<ellipse cx="203" cy="96" rx="27" ry="21" fill="${c}"/><ellipse cx="249" cy="96" rx="27" ry="21" fill="${c}"/><circle cx="226" cy="96" r="11" fill="${d}"/>`],
['小花',(c)=>[0,1,2,3,4].map(i=>`<circle cx="${250+14*Math.cos(i*1.2566)}" cy="${92+14*Math.sin(i*1.2566)}" r="9" fill="${c}"/>`).join('')+`<circle cx="250" cy="92" r="7" fill="#f6dc6c"/>`],
['耳機',(c,d)=>`<path d="M134 134 Q134 58 200 58 Q266 58 266 134" stroke="${d}" stroke-width="8" fill="none"/><rect x="120" y="116" width="24" height="46" rx="12" fill="${c}"/><rect x="256" y="116" width="24" height="46" rx="12" fill="${c}"/>`],
['星星髮夾',()=>ST(252,92,12,G)]]},
{id:'top',name:'上衣',vb:'60 195 280 190',items:[
['T恤',(c,d)=>SL(c)+`<path d="${T}" fill="${c}"/><path d="M178 216 Q200 238 222 216" stroke="${d}" stroke-width="4" fill="none"/>`],
['條紋衫',(c)=>SL(c)+`<path d="${T}" fill="${c}"/><g clip-path="url(#tc)" fill="#fff" fill-opacity=".75"><rect x="100" y="238" width="200" height="14"/><rect x="100" y="268" width="200" height="14"/><rect x="100" y="298" width="200" height="14"/><rect x="100" y="328" width="200" height="14"/></g>`],
['連帽衣',(c,d)=>`<ellipse cx="200" cy="218" rx="58" ry="24" fill="${d}"/>`+SL(c,50)+`<path d="${T}" fill="${c}"/><path d="M152 298 Q200 314 248 298 L254 332 Q200 352 146 332Z" fill="${d}" fill-opacity=".4"/><path d="M188 230V264M212 230V264" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`],
['背心',(c,d)=>`<path d="${TP(214,346,3,16)}" fill="${c}"/><path d="M180 214 L200 246 L220 214" fill="#fff" fill-opacity=".8"/>`],
['西裝',(c,d)=>SL(c,48)+`<path d="${T}" fill="${c}"/><path d="M178 214 L222 214 L200 296Z" fill="#fff"/><path d="M178 214 L200 296 L168 250Z M222 214 L200 296 L232 250Z" fill="${d}"/><circle cx="200" cy="318" r="4" fill="#fff"/>`],
['洋裝',(c,d)=>SL(c)+`<path d="${TP(213,306,5,0)}" fill="${c}"/><path d="M122 300 Q200 318 278 300 L304 392 Q200 420 96 392Z" fill="${c}"/><path d="M127 296 Q200 314 273 296 L275 310 Q200 328 125 310Z" fill="${d}"/>`]]},
{id:'bottom',name:'下著',vb:'80 320 240 110',items:[
['長褲',(c,d)=>`<path d="${TP(326,380,4,0)}" fill="${c}"/><path d="M200 372 V345" stroke="${d}" stroke-width="3"/>`],
['裙子',(c,d)=>`<path d="M128 332 Q200 350 272 332 L298 396 Q200 418 102 396Z" fill="${c}"/><path d="M160 344 L148 404M200 350 V412M240 344 L252 404" stroke="${d}" stroke-opacity=".5" stroke-width="3"/>`],
['牛仔褲',(c)=>`<path d="${TP(326,380,4,0)}" fill="${c}"/><path d="M200 334V376" stroke="#f0c75e" stroke-width="2.5"/><rect x="168" y="340" width="28" height="24" rx="7" fill="none" stroke="#f0c75e" stroke-width="2"/><rect x="204" y="340" width="28" height="24" rx="7" fill="none" stroke="#f0c75e" stroke-width="2"/>`]]},
{id:'shoe',name:'鞋子',vb:'100 380 200 56',items:[
['球鞋',(c)=>SH(x=>`<ellipse cx="${x}" cy="414" rx="40" ry="16" fill="${c}"/><ellipse cx="${x}" cy="424" rx="42" ry="7" fill="#fff"/><path d="M${x-14} 404l10 6M${x} 402l10 6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`)],
['涼鞋',(c,d)=>SH(x=>`<ellipse cx="${x}" cy="424" rx="40" ry="8" fill="${d}"/><path d="M${x-26} 418 Q${x} 394 ${x+26} 418" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>`)],
['膠質雨鞋',(c,d)=>SH(x=>`<rect x="${x-33}" y="382" width="66" height="30" rx="9" fill="${c}"/><ellipse cx="${x+3}" cy="414" rx="40" ry="12" fill="${c}"/><rect x="${x-35}" y="378" width="70" height="8" rx="4" fill="${d}"/>`)]]},
{id:'neck',name:'項鍊',vb:'135 210 130 70',items:[
['珍珠',(c)=>AP(11).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${c}" stroke="#cfcac3"/><circle cx="${p[0]-2}" cy="${p[1]-2}" r="2" fill="#fff"/>`).join('')],
['愛心',(c)=>`<path d="${CH}" stroke="${G}" stroke-width="3" fill="none"/>${H(200,252,1.3,c)}`],
['星星',(c)=>`<path d="${CH}" stroke="#bfc3ca" stroke-width="3" fill="none"/>${ST(200,254,13,c)}`],
['鑽石',(c,d,l)=>`<path d="${CH}" stroke="${G}" stroke-width="3" fill="none"/><polygon points="200,240 214,252 200,270 186,252" fill="${c}" fill-opacity=".85"/><polygon points="200,240 207,252 200,270 193,252" fill="${l}"/>`]]},
{id:'scarf',name:'領飾',vb:'125 205 150 125',items:[
['圍巾',(c,d)=>`<path d="M228 262 L250 316 Q254 326 244 328 L232 329 Q222 329 221 320 L212 270Z" fill="${d}"/><path d="M138 224 Q200 266 262 224 L264 248 Q200 290 136 248Z" fill="${c}"/><path d="M232 290 L252 288M236 304 L254 302" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>`],
['領結',(c,d)=>`<path d="M200 236 L166 218 L166 254Z M200 236 L234 218 L234 254Z" fill="${c}"/><rect x="190" y="226" width="20" height="20" rx="6" fill="${d}"/>`],
['領帶',(c,d)=>`<path d="M191 228 L209 228 L216 292 L200 308 L184 292Z" fill="${c}"/><rect x="190" y="222" width="20" height="14" rx="4" fill="${d}"/>`]]},
{id:'face',name:'臉部',vb:'130 110 140 100',items:[
['圓框眼鏡',(c)=>`<circle cx="172" cy="140" r="22" fill="#fff" fill-opacity=".2" stroke="${c}" stroke-width="4"/><circle cx="228" cy="140" r="22" fill="#fff" fill-opacity=".2" stroke="${c}" stroke-width="4"/><path d="M194 138 Q200 132 206 138M150 136 L136 130M250 136 L264 130" stroke="${c}" stroke-width="4" fill="none"/>`],

  let lr=$('lockrow');if(!lr){lr=document.createElement('label');lr.id='lockrow';lr.className='lockrow';$('grid').parentNode.insertBefore(lr,$('grid'));lr.addEventListener('change',e=>{st.lock=st.lock||{};st.lock[CATS[st.cat].id]=e.target.checked;persist()})}
  lr.innerHTML=`<input type="checkbox" ${(st.lock&&st.lock[CATS[st.cat].id])?'checked':''}> 隨機搭配時保留這一類`;
  const c=CATS[st.cat],a=st.col[c.id],cur=st.sel[c.id];
  $('grid').innerHTML=`<button class="it${cur==null?' on':''}" onclick="pick(-1)"><span style="flex:1;display:flex;align-items:center;font-size:15px;color:#8b9098">無</span><span>不穿戴</span></button>`+
    IX(c).map(i=>{const it=c.items[i];return ((c.id==='top'&&(i==4||i==5||i==9))||(c.id==='coat'&&i==7))?'':`<button class="it${cur==i?' on':''}" onclick="pick(${i})"><svg viewBox="${c.vb}" preserveAspectRatio="xMidYMid meet"><g stroke="${mix(a,-.35)}" stroke-opacity=".3" stroke-width="1.5">${it[1](a,mix(a,-.28),mix(a,.5))}</g></svg><span>${it[0]}</span></button>`}).join('');
  $('pal').innerHTML=P.map(p=>`<button class="sw${p==a?' on':''}" aria-label="顏色" style="background:radial-gradient(circle at 35% 30%,#fff,${p} 65%)" onclick="setCol('${p}')"></button>`).join('');
}
const IX=c=>{const a=c.items.map((_,i)=>i);if(c.id==='bottom')a.sort((x,y)=>((x==1||x==5)-(y==1||y==5))||x-y);return a};
const setBear=i=>{st.bear=i;ui()};
const setCat=i=>{st.cat=i;ui()};
const AUTO={};
const pick=i=>{const c=CATS[st.cat];st.sel[c.id]=i<0?null:i;if(i>=0){if(c.id==='suit'){st.sel.top=null;st.sel.bottom=null}else if(c.id==='top'||c.id==='bottom')st.sel.suit=null}if(c.id==='held'){if(i===4&&st.col.held===P[1]){st.col.held=P[7];AUTO.held=1}else if(i!==4&&st.col.held===P[7]&&AUTO.held){st.col.held=P[1];AUTO.held=0}}if(c.id==='top'&&i===15&&st.col.top===P[2])st.col.top=P[7];if(c.id==='hat'){if(i===2&&st.col.hat===P[2]){st.col.hat=P[4];AUTO.hat=1}else if(i!==2&&st.col.hat===P[4]&&AUTO.hat){st.col.hat=P[2];AUTO.hat=0}}if(c.id==='face'){if(i===2){if(st.col.face!==P[6])AUTO.face=1;st.col.face=P[6]}else if(st.col.face===P[6]&&AUTO.face){st.col.face='#26262b';AUTO.face=0}}if(c.id==='bottom'&&i===2&&st.col.bottom===P[3])st.col.bottom='#3f63a6';if(c.id==='hat'&&i===6&&st.col.hat===P[0])st.col.hat=P[1];if(c.id==='shoe'&&i===2&&st.col.shoe===P[4])st.col.shoe=P[2];ui()};
const setCol=p=>{AUTO[CATS[st.cat].id]=0;st.col[CATS[st.cat].id]=p;ui()};
function clr(){for(const k in AUTO)AUTO[k]=0;CATS.forEach(c=>st.sel[c.id]=null);st.pose=0;st.coatOpen=false;ui();toast('已重置')}
function rnd(){
  for(const k in AUTO)AUTO[k]=0;
  const L=st.lock||{},S=st.sel;
  st.bear=Math.random()*BEAR.length|0;
  CATS.forEach(c=>{if(L[c.id])return;if(Math.random()<.65){S[c.id]=Math.random()*c.items.length|0;if(c.id==='top'&&(S.top==4||S.top==5||S.top==9))S.top=0;if(c.id==='coat'&&S.coat==7)S.coat=0;st.col[c.id]=P[Math.random()*P.length|0]}else S[c.id]=null});
  if(S.suit!=null&&(S.top!=null||S.bottom!=null)){if(!L.suit&&(Math.random()<.5||L.top||L.bottom))S.suit=null;else{if(!L.top)S.top=null;if(!L.bottom)S.bottom=null}}
  if(S.hat!=null&&S.hair!=null){if(!L.hair)S.hair=null;else if(!L.hat)S.hat=null}
  if(S.neck!=null&&S.scarf!=null){if(!L.neck)S.neck=null;else if(!L.scarf)S.scarf=null}
  ui();toast('已隨機搭配完成')}

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),2400)}

const loadSvg=t=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t)});
async function makePng(tr){
  if(!bearOK)throw 0;
  let cv;
  if(!fbMode)cv=renderHi(tr);
  else{
    cv=document.createElement('canvas');cv.width=1200;cv.height=1440;
    const x=cv.getContext('2d');
    fillBg(x,1200,1440);
    x.imageSmoothingQuality='high';
    const [a,b,c,d]=await Promise.all(layersSvg().map(loadSvg));[a,$('cv'),b,$('ca'),c,$('ch'),d].forEach(m=>x.drawImage(m,0,0,1200,1440));
  }
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function save(){const tr=BG.k==='transp';
  try{
    const nm=tr?'小熊軟糖-透明背景.png':'小熊軟糖.png',b=await makePng(tr),f=new File([b],nm,{type:'image/png'});
    const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(ios&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'小熊軟糖'});toast('請在選單中點選「儲存影像」');return}
      catch(e){if(e.name==='AbortError')return}
    }
    const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();
    if(ios){$('mi').src=u;$('md').classList.add('s')}
    toast(tr?'透明背景 PNG 已儲存':'照片已儲存');
  }catch(e){toast('儲存失敗，請再試一次')}
}
document.body.insertAdjacentHTML('afterbegin','<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'+filt('jl',.92)+'<clipPath id="tc"><path d="'+T+'"/></clipPath></defs></svg>');
window.addEventListener('error',e=>{try{toast('發生錯誤：'+(e.message||'未知'))}catch(x){}});
const SKEY='bearGummyV1';let BG={k:'grad',c:'#ffffff'};st.lock={};
try{const r=JSON.parse(localStorage.getItem(SKEY)||'null');
  if(r&&r.v===1){
    if(Number.isInteger(r.b)&&r.b>=0&&r.b<BEAR.length)st.bear=r.b;
    CATS.forEach(c=>{const v=r.s&&r.s[c.id];st.sel[c.id]=(Number.isInteger(v)&&v>=0&&v<c.items.length)?v:null;const col=r.c&&r.c[c.id];if(typeof col==='string'&&/^#[0-9a-f]{3,8}$/i.test(col))st.col[c.id]=col});
    if(Number.isInteger(r.p)&&r.p>=0&&r.p<POSES.length)st.pose=r.p;
    st.coatOpen=!!r.o;
    if(r.bg&&typeof r.bg.k==='string'&&(r.bg.k==='grad'||r.bg.k==='transp'||r.bg.k==='custom'||/^#[0-9a-f]{6}$/i.test(r.bg.k))){BG.k=r.bg.k;if(typeof r.bg.c==='string'&&/^#[0-9a-f]{6}$/i.test(r.bg.c))BG.c=r.bg.c}
    if(r.lk&&typeof r.lk==='object')st.lock=r.lk;
  }}catch(e){}
ui();
requestAnimationFrame(()=>requestAnimationFrame(geoInit));
setTimeout(()=>$('stage').classList.add('ok'),6000);

let hist=[],redoS=[],lastS=null,undoing=false;const snap=()=>JSON.stringify({b:st.bear,s:st.sel,c:st.col,p:st.pose,o:st.coatOpen});
const _ui=ui;ui=function(){const k=snap();if(lastS!==null&&k!==lastS&&!undoing){hist.push(lastS);if(hist.length>50)hist.shift();redoS.length=0}lastS=k;_ui();pb();persist()};
function applySnap(j){const o=JSON.parse(j);st.bear=o.b;st.sel=o.s;st.col=o.c;st.pose=o.p;st.coatOpen=!!o.o;undoing=true;ui();undoing=false}
function undo(){if(!hist.length){toast('沒有可復原的動作');return}redoS.push(lastS);applySnap(hist.pop());toast('已回到上一步')}
function redo(){if(!redoS.length){toast('沒有可重做的動作');return}hist.push(lastS);applySnap(redoS.pop());toast('已回到下一步')}
function setOpen(v){st.coatOpen=v;ui()}
function setPose(i){st.pose=i;ui()}
function pb(){$('poses').innerHTML=POSES.map((p,i)=>`<button class="btn${i==st.pose?' main':''}" onclick="setPose(${i})">${p[0]}</button>`).join('')}
pb();

/* ===== 角度旋轉 ===== */
st.ang=0;
const normA=a=>{a=a%(2*Math.PI);if(a>Math.PI)a-=2*Math.PI;if(a<-Math.PI)a+=2*Math.PI;return a};
let angAnim=0;
function rotTo(t){
  if(fbMode)return;cancelAnimationFrame(angAnim);
  const a0=st.ang||0,d=normA(t-a0),t0=performance.now(),D=220;
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    if(k<1){st.ang=normA(a0+d*e);drawBear(true);angAnim=requestAnimationFrame(step)}
    else{st.ang=Math.abs(normA(t))<1e-6?0:normA(t);drawBear()}};
  angAnim=requestAnimationFrame(step);
}
function rotBy(deg){rotTo((st.ang||0)+deg*Math.PI/180)}
(function(){
  const sg=$('stage');let down=false,x0=0,a0=0,moved=false;
  sg.addEventListener('pointerdown',e=>{if(fbMode||e.target.closest('#rot'))return;down=true;moved=false;x0=e.clientX;a0=st.ang||0;cancelAnimationFrame(angAnim);try{sg.setPointerCapture(e.pointerId)}catch(_){}});
  sg.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-x0;if(!moved&&Math.abs(dx)<4)return;moved=true;sg.classList.add('drag');st.ang=normA(a0+dx*.014);drawBear(true)});
  const end=()=>{if(!down)return;down=false;sg.classList.remove('drag');if(moved){if(Math.abs(st.ang||0)<.1)st.ang=0;drawBear()}};
  sg.addEventListener('pointerup',end);sg.addEventListener('pointercancel',end);
})();
function syncFb(){const fb=!!fbMode;$('rot').classList.toggle('off',fb);const n=$('fbn');n.style.display=fb?'block':'none';if(fb)n.textContent='此裝置無法使用 3D 渲染，已改用簡易預覽，暫時無法旋轉角度。'}

/* ===== 下載背景 ===== */
const BGO=[['grad','預設漸層','linear-gradient(135deg,#fbfbfa,#e3e6ea)'],['transp','透明','conic-gradient(#cfd2d8 25%,#fff 0 50%,#cfd2d8 0 75%,#fff 0) 0 0/12px 12px'],['#ffffff','白色','#fff'],['#ffe1ea','粉色','#ffe1ea'],['#dcefff','淡藍','#dcefff'],['#e0f4de','淡綠','#e0f4de'],['#3b3e46','深灰','#3b3e46']];
function fillBg(x,W,H){const k=BG.k;if(k==='transp')return;if(k==='grad'){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fbfbfa');g.addColorStop(1,'#e3e6ea');x.fillStyle=g}else x.fillStyle=(k==='custom')?BG.c:k;x.fillRect(0,0,W,H)}
function bgPrev(){const k=BG.k,e=$('stage');e.style.background=k==='grad'?'':(k==='transp'?'conic-gradient(#d9dce1 25%,#fff 0 50%,#d9dce1 0 75%,#fff 0) 0 0/16px 16px':(k==='custom'?BG.c:k))}
function renderBG(){bgPrev();
  $('bgs').innerHTML=BGO.map(o=>`<button aria-label="${o[1]}" title="${o[1]}" class="${o[0]===BG.k?'on':''}" style="background:${o[2]}" onclick="setBG('${o[0]}')"></button>`).join('')+
  `<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)">自訂<input type="color" value="${BG.c||'#ffffff'}" oninput="setBGc(this.value)" style="width:34px;height:34px;border:none;background:none;padding:0"></label>`;
}
function setBG(k){BG.k=k;renderBG();persist();toast('背景：'+(BGO.find(o=>o[0]===k)||[0,'自訂'])[1])}
function setBGc(c){BG.k='custom';BG.c=c;bgPrev();persist();[...$('bgs').children].forEach(b=>{if(b.tagName==='BUTTON')b.classList.remove('on')})}

/* ===== 儲存上次搭配 ===== */
function persist(){try{localStorage.setItem(SKEY,JSON.stringify({v:1,b:st.bear,s:st.sel,c:st.col,p:st.pose,o:st.coatOpen,bg:BG,lk:st.lock}))}catch(e){}}
renderBG();
</script>
