<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KARMAWEI_</title>
  <!-- Cropper.js CSS (裁切工具) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #cbe4fd 0%, #e0f2fe 50%, #f0f9ff 100%);
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 10px 30px rgba(148, 163, 184, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 1.2px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    /* 藍天白雲柔和漸層背景與雲朵光暈 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.95) 0%, transparent 30%),
        radial-gradient(circle at 75% 30%, rgba(255, 255, 255, 0.75) 0%, transparent 40%),
        radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.8) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(186, 230, 253, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 10% 90%, rgba(255, 255, 255, 0.7) 0%, transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 960px;
      z-index: 1;
    }

    .top-controls {
      text-align: center;
      margin-bottom: 24px;
    }

    .controls-box {
      display: inline-flex;
      gap: 16px;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    /* 3D 擬物風格按鈕 */
    .btn {
      padding: 8px 22px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
