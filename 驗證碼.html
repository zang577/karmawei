  /* ---------- 文字繪製 ---------- */
  // 產生彩色雜訊圖樣，可當作 strokeStyle 讓文字外框帶有雜訊顆粒
  function makeNoisePattern(ctx, rng){
    const size = 48;
    const off = document.createElement('canvas');
    off.width = size; off.height = size;
    const octx = off.getContext('2d');
    const img = octx.createImageData(size, size);
    for(let i=0;i<size*size;i++){
      img.data[i*4]   = Math.floor(rng()*255);
      img.data[i*4+1] = Math.floor(rng()*255);
      img.data[i*4+2] = Math.floor(rng()*255);
      img.data[i*4+3] = 255;
    }
    octx.putImageData(img, 0, 0);
    return ctx.createPattern(off, 'repeat');
  }

  // 讓偏移量以「畫布像素」為準（不受文字旋轉／縮放／傾斜影響），讓光源方向保持一致
  function localOffset(ctx,dx,dy){
    const m = ctx.getTransform();
    const det = m.a*m.d-m.b*m.c || 1;
    return [(m.d*dx-m.c*dy)/det, (-m.b*dx+m.a*dy)/det];
  }
  function mixHex(hex,target,t){
    const p = v=>[parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)];
    const a=p(hex), b=p(target);
    return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
  }
  // 吐司文字上的少量光點：只落在「朝向光源（左上）」的字形邊緣，方向一致
  function toastGlints(ctx,ch,fontSize,rng){
    const r0 = rng();
    const count = r0<0.35 ? 0 : (r0<0.85 ? 1 : 2);
    if(!count) return;
    const size = Math.ceil(fontSize*2.4);
    const oc = document.createElement('canvas');
    oc.width = oc.height = size;
    const octx = oc.getContext('2d');
    octx.font = ctx.font;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(ch,size/2,size/2);
    let data;
    try{ data = octx.getImageData(0,0,size,size).data; }catch(e){ return; }
    const alphaAt = (x,y)=>{
      x=Math.round(x); y=Math.round(y);
      if(x<0||y<0||x>=size||y>=size) return 0;
      return data[(y*size+x)*4+3];
    };
    let [nx,ny] = localOffset(ctx,-1,-1);
    const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    const e = Math.max(2,fontSize*0.045);
    let placed = 0;
    for(let tries=0; tries<700 && placed<count; tries++){
      const px = rng()*size, py = rng()*size;
      if(alphaAt(px,py)>140 && alphaAt(px+nx*e,py+ny*e)<60){
        const gx = px-size/2 - nx*1.2, gy = py-size/2 - ny*1.2;
        const gr = fontSize*(0.04+rng()*0.04);
        const g = ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
        g.addColorStop(0,'rgba(255,252,236,0.95)');
        g.addColorStop(0.35,'rgba(255,240,200,0.55)');
        g.addColorStop(1,'rgba(255,230,180,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(gx,gy,gr,0,Math.PI*2);
        ctx.fill();
        placed++;
      }
    }
  }

  function drawStyledText(ctx,w,h,text,style,rng,fontOverride){
    const dprS = ctx.getTransform().a || 1;
    const noisePattern = style.noiseOutline ? makeNoisePattern(ctx, rng) : null;
    const isCJK = CJK_RE.test(text);
    const chosenFamily = fontOverride ? fontOverride.family : style.font;
    const weight = fontOverride ? fontOverride.weight : style.weight;
    // 以使用者選擇的字型為主；只有在該字型缺少某個字的字圖時，
    // 才用思源黑體（Noto Sans TC）作為備援字型補上該字
    const family = isCJK ? `${chosenFamily}, 'Noto Sans TC', sans-serif` : chosenFamily;
    const fontSize = h * (isCJK ? Math.min(style.sizeRatio, .40) : style.sizeRatio);
    ctx.font = `${weight} ${fontSize}px ${family}`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    const chars = Array.from(text);
    const spacing = fontSize*style.spacing;
    const widths = chars.map(ch => ctx.measureText(ch).width || fontSize*0.55);
    const seedPhase = rng()*10;

    // 版面分佈模式：預設大多數時候讓每個字各自獨立散開（撐滿版面），
    // 只有少數機率整體偏向某一邊或某個角落、呈現比較聚集的排版
    const fillMode = rng() < 0.8;
    let biasDir = null;
    if(!fillMode){
      const dirs = ['up','down','left','right','upperLeft','upperRight','lowerLeft','lowerRight'];
      biasDir = dirs[Math.floor(rng()*dirs.length)];
    }
    const spreadFactor = fillMode ? (1.30+rng()*0.30) : (0.90+rng()*0.22);

    const totalWidth = (widths.reduce((a,b)=>a+b*0.87,0) + widths[widths.length-1]*0.13 + spacing*(chars.length-1)*0.6) * spreadFactor;

    const edgeMargin = w*0.05;
    let x;
    if(fillMode){
      x = (w-totalWidth)/2;
    } else if(biasDir==='left' || biasDir==='upperLeft' || biasDir==='lowerLeft'){
      x = edgeMargin;
    } else if(biasDir==='right' || biasDir==='upperRight' || biasDir==='lowerRight'){
      x = Math.max(edgeMargin, w-totalWidth-edgeMargin);
    } else {
      x = (w-totalWidth)/2;
    }

    let cyCenter = h/2;
    if(!fillMode){
      if(biasDir==='up' || biasDir==='upperLeft' || biasDir==='upperRight') cyCenter = h*0.24;
      else if(biasDir==='down' || biasDir==='lowerLeft' || biasDir==='lowerRight') cyCenter = h*0.76;
    }

    // 第一輪：先算出每個字「理想中」的位置（水平仍依照文字順序推進，
    // 垂直方向依模式做聚集或大幅散開）
    const positions = [];
    chars.forEach((ch,i)=>{
      const cw = widths[i];
      const followsBias = fillMode || rng() < 0.5;
      const hDrift = followsBias ? (rng()-0.5)*fontSize*0.40 : (rng()-0.5)*fontSize*0.48;
      const cx = x + cw/2 + hDrift;
      const rawCy = fillMode
        ? cyCenter + (rng()-0.5)*h*0.62 + Math.sin(i*1.9+seedPhase)*h*0.12
        : (followsBias
            ? cyCenter + Math.sin(i*1.9+seedPhase)*fontSize*style.jitter*0.85 + (rng()-0.5)*fontSize*style.jitter*0.7
            : h*(0.14+rng()*0.72));
      const clampMargin = fontSize*0.5;
      const cy = Math.max(clampMargin, Math.min(h-clampMargin, rawCy));
      positions.push({ ch, cx, cy });
      x += (cw*(0.72+rng()*0.30) + spacing*(0.35+rng()*0.55)) * spreadFactor;
    });

    // 第二輪：強制水平方向維持輸入文字的先後順序（由左到右），
    // 避免亂數位移把字元順序打亂
    const minGap = fontSize*0.14;
    for(let i=1;i<positions.length;i++){
      if(positions[i].cx < positions[i-1].cx + minGap){
        positions[i].cx = positions[i-1].cx + minGap;
      }
    }
    const clampMargin = fontSize*0.5;
    positions.forEach(p=>{ p.cx = Math.max(clampMargin, Math.min(w-clampMargin, p.cx)); });

    // 第三輪：實際繪製每個字
    positions.forEach(p=>{
      const angle = (rng()-0.5)*2*(style.rot*Math.PI/180);
      const scaleX = 0.55+rng()*0.95;
      const scaleY = 0.58+rng()*0.92;
      const skew = (rng()-0.5)*0.5;

      ctx.save();
      ctx.translate(p.cx,p.cy);
      ctx.rotate(angle);
      ctx.transform(1,0,skew,1,0,0);
      ctx.scale(scaleX,scaleY);

      const pal = style.palette;
      const col = pal[Math.floor(rng()*pal.length)];

      if(style.color==='stroke'){
        ctx.lineWidth = fontSize*0.07;
        ctx.strokeStyle = col;
        ctx.lineJoin='round';
        ctx.strokeText(p.ch,0,0);
      } else if(style.color==='doubleOutline'){
        ctx.lineJoin='round';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = fontSize*(style.outlineWidthRatio || 0.16);
        ctx.strokeText(p.ch,0,0);
        if(style.paletteFill){
          ctx.strokeStyle = style.strokeColor || '#141414';
          ctx.lineWidth = fontSize*(style.innerOutlineWidthRatio || 0.09);
          ctx.strokeText(p.ch,0,0);
          ctx.fillStyle = col;
          ctx.fillText(p.ch,0,0);
        } else {
          ctx.strokeStyle = col;
          ctx.lineWidth = fontSize*(style.innerOutlineWidthRatio || 0.09);
          ctx.strokeText(p.ch,0,0);
          ctx.fillStyle = style.fillColor || '#ffffff';
          ctx.fillText(p.ch,0,0);
        }
      } else if(style.color==='woodEmboss'){
        // 木質：隨機浮雕。每個字隨機決定凸起或凹刻、深淺不一，光源固定來自左上方；
        // 浮雕的明暗色都比文字本身的顏色淺
        const raised = rng()<0.6;
        const d = fontSize*(0.02+rng()*0.04)*dprS;
        const [ox,oy] = localOffset(ctx,d*0.8,d*0.8);
        const shade = mixHex(col,'#ffffff',0.38);   // 比文字淺的「陰影」色
        const light = mixHex(col,'#ffffff',0.74);   // 更淺的「亮面」色
        ctx.lineJoin='round';
        if(raised){
          ctx.save(); ctx.translate(ox,oy);
          ctx.shadowColor=shade; ctx.shadowBlur=d*0.8;
          ctx.fillStyle=shade; ctx.fillText(p.ch,0,0); ctx.restore();
          ctx.save(); ctx.translate(-ox*0.6,-oy*0.6);
          ctx.fillStyle=light; ctx.fillText(p.ch,0,0); ctx.restore();
        } else {
          ctx.save(); ctx.translate(-ox,-oy);
          ctx.fillStyle=shade; ctx.fillText(p.ch,0,0); ctx.restore();
          ctx.save(); ctx.translate(ox*0.8,oy*0.8);
          ctx.fillStyle=light; ctx.fillText(p.ch,0,0); ctx.restore();
        }
        const lighter = mixHex(col,'#ffffff',0.12), darker = mixHex(col,'#000000',0.18);
        const [gx,gy] = localOffset(ctx,fontSize*0.45*dprS,fontSize*0.5*dprS);
        const g = ctx.createLinearGradient(-gx,-gy,gx,gy);
        g.addColorStop(0, raised?lighter:darker);
        g.addColorStop(1, raised?darker:lighter);
        ctx.fillStyle = g;
        ctx.fillText(p.ch,0,0);
      } else if(style.color==='toast'){
        // 吐司色系：每個字元是非常柔和、模糊的多色漸變（焦褐 → 焦糖 → 金黃），
        // 邊緣再疊一層模糊的同色暈光，讓顏色之間與字緣都柔和過渡
        const tones = ['#5a2e0c','#7a3e10','#a85a1a','#c4782a','#d99a48'];
        const ang = rng()*Math.PI*2, r = fontSize*(0.40+rng()*0.25);
        const g = ctx.createLinearGradient(-Math.cos(ang)*r,-Math.sin(ang)*r,Math.cos(ang)*r,Math.sin(ang)*r);
        const c1 = tones[Math.floor(rng()*3)];
        const c2 = tones[1+Math.floor(rng()*4)];
        const c3 = tones[Math.floor(rng()*tones.length)];
        g.addColorStop(0,c1);
        g.addColorStop(0.5,c2);
        g.addColorStop(1,c3);
        dreamBlurText(ctx,p.ch,'rgba(150,80,22,0.55)',fontSize*0.14,fontSize*0.03);
        // 最外層：奶油白外框（和焦褐字色形成明顯對比，又比黑色柔和）
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineWidth = fontSize*0.08;
        ctx.strokeStyle = '#fff3d6';
        ctx.strokeText(p.ch,0,0);
        ctx.restore();
        ctx.save();
        ctx.shadowColor = 'rgba(70,36,10,0.30)';
        ctx.shadowBlur = fontSize*0.10;
        ctx.shadowOffsetY = fontSize*0.03;
        ctx.fillStyle = g;
        ctx.fillText(p.ch,0,0);
        ctx.restore();
        toastGlints(ctx,p.ch,fontSize,rng);
      } else if(style.color==='dream'){
        // 夢境：文字邊緣像霧一樣暈開消散（皆以柔化陰影構成，不靠 filter）
        dreamBlurText(ctx,p.ch,'rgba(255,255,255,0.9)',fontSize*0.45,fontSize*0.10);
        dreamBlurText(ctx,p.ch,'rgba(255,255,255,0.7)',fontSize*0.22,fontSize*0.04);
        dreamBlurText(ctx,p.ch,col,fontSize*0.20,0);
        ctx.save();
        ctx.shadowColor = col;
        ctx.shadowBlur = fontSize*0.08;
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = col;
        ctx.fillText(p.ch,0,0);
        ctx.restore();
      } else if(style.color==='nightHalo'){
        // 黑色文字 + 灰白交錯、粗細不均的外框：每一層外框都有各自的位移與寬度，
        // 讓外框不規則地包覆文字，最外層再帶一點迷幻的紫藍光暈
        ctx.lineJoin='round';
        ctx.lineCap='round';
        const halo = [
          { w:.15, c:'rgba(255,255,255,0.30)', glow:'rgba(150,130,255,0.7)', blur:.10 },
          { w:.115, c:'#f4f5f8' },
          { w:.085, c:'#868a94' },
          { w:.055, c:'#e3e5ea' },
          { w:.03, c:'#5d616b' }
        ];
        halo.forEach(L=>{
          const dx=(rng()-0.5)*fontSize*0.05;
          const dy=(rng()-0.5)*fontSize*0.05;
          ctx.save();
          ctx.translate(dx,dy);
          if(L.glow){ ctx.shadowColor=L.glow; ctx.shadowBlur=fontSize*L.blur; }
          ctx.strokeStyle = L.c;
          ctx.lineWidth = fontSize*L.w*(0.82+rng()*0.36);
          ctx.strokeText(p.ch,0,0);
          ctx.restore();
        });
        ctx.fillStyle = col;
        ctx.fillText(p.ch,0,0);
        ctx.lineWidth = fontSize*0.012;
        ctx.strokeStyle = col;
        ctx.strokeText(p.ch,0,0);
      } else if(style.color==='trippy'){
        const tc = style.trippyColors || ['rgba(255,80,180,0.55)','rgba(80,200,255,0.55)'];
        ctx.save(); ctx.translate(fontSize*0.06, 0); ctx.fillStyle=tc[0]; ctx.fillText(p.ch,0,0); ctx.restore();
        ctx.save(); ctx.translate(-fontSize*0.06, 0); ctx.fillStyle=tc[1]; ctx.fillText(p.ch,0,0); ctx.restore();
        ctx.fillStyle = col;
        ctx.fillText(p.ch,0,0);
      } else if(style.color==='outline'){
        ctx.lineWidth = fontSize*(style.outlineWidthRatio || 0.06);
        ctx.strokeStyle = style.strokeColor;
        ctx.lineJoin='round';
        ctx.strokeText(p.ch,0,0);
        if(noisePattern){
          ctx.save();
          ctx.globalAlpha = 0.65;
          ctx.strokeStyle = noisePattern;
          ctx.strokeText(p.ch,0,0);
          ctx.restore();
        }
        let outlineFill = col;
        if(style.fillGradient && rng()<style.fillGradient){
          // 部分字元：白色混入淺藍的隨機漸層（角度、顏色、漸變位置各不相同）
          const ang = rng()*Math.PI*2, r = fontSize*(0.30+rng()*0.30);
          const blues = ['#9fd0f5','#b5dcfa','#8cc6f0','#c4e4fb','#a6d4f7'];
          const b1 = blues[Math.floor(rng()*blues.length)], b2 = blues[Math.floor(rng()*blues.length)];
          const g = ctx.createLinearGradient(-Math.cos(ang)*r,-Math.sin(ang)*r,Math.cos(ang)*r,Math.sin(ang)*r);
          g.addColorStop(0, rng()<0.5 ? '#ffffff' : b1);
          g.addColorStop(0.25+rng()*0.5, rng()<0.5 ? '#ffffff' : b1);
          g.addColorStop(1, b2);
          outlineFill = g;
        }
        ctx.fillStyle = outlineFill;
        ctx.fillText(p.ch,0,0);
      } else if(style.color==='neon'){
        if(style.glow){ ctx.shadowColor=col; ctx.shadowBlur=fontSize*0.22; }
        ctx.fillStyle = col;
        ctx.fillText(p.ch,0,0);
      } else if(style.color==='particleGlow'){
        const glow = style.glowColor || 'rgba(70,230,190,0.9)';
        const glowBright = style.glowBright || 'rgba(150,255,230,0.95)';
        ctx.lineJoin='round';
        // 由寬、淡、模糊逐層收斂到窄、亮、清楚的外框線，每層再加一點點
        // 隨機位移，打破完美對稱的同心圓感，做出融化、暈染不均勻的效果
        const haloLayers = [
          { blur: fontSize*0.30, width: fontSize*0.22, alpha:0.20, color:glow },
          { blur: fontSize*0.19, width: fontSize*0.15, alpha:0.30, color:glow },
          { blur: fontSize*0.10, width: fontSize*0.10, alpha:0.48, color:glow },
          { blur: fontSize*0.045, width: fontSize*0.055, alpha:0.85, color:glowBright }
        ];
        haloLayers.forEach(step=>{
          const dx=(rng()-0.5)*fontSize*0.035;
          const dy=(rng()-0.5)*fontSize*0.03 + fontSize*0.012;
          ctx.save();
          ctx.translate(dx,dy);
          ctx.filter = `blur(${step.blur}px)`;
          ctx.globalAlpha = step.alpha;
          ctx.strokeStyle = step.color;
          ctx.lineWidth = step.width;
          ctx.strokeText(p.ch,0,0);
          ctx.restore();
        });
        // 核心文字保留極輕微柔邊，避免與外圍光暈的銜接太生硬
        ctx.save();
        ctx.filter = `blur(${fontSize*0.018}px)`;
        ctx.globalAlpha = 1;
        ctx.fillStyle = col;
        ctx.fillText(p.ch,0,0);
        ctx.restore();
        // 顆粒質感：用雜訊圖樣直接畫在文字範圍內（fillText／strokeText
        // 只會在字形內部與外框線上留色，天然貼合字形不需額外裁切），
        // 以 overlay 混合模式自然融入填色與光暈，做出噴漆顆粒粗糙感
        if(noisePattern){
          ctx.save();
          ctx.globalCompositeOperation = 'overlay';
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = noisePattern;
          ctx.fillText(p.ch,0,0);
          ctx.filter = `blur(${fontSize*0.03}px)`;
          ctx.lineWidth = fontSize*0.16;
          ctx.strokeStyle = noisePattern;
          ctx.strokeText(p.ch,0,0);
          ctx.restore();
        }
      } else if(style.color==='alienGlow'){
        const dark = style.strokeColor || '#1b5e20';
        ctx.save();
        ctx.translate(fontSize*0.06, fontSize*0.06);
        ctx.fillStyle = dark;
        ctx.fillText(p.ch,0,0);
        ctx.restore();
        ctx.lineJoin='round';
        ctx.lineWidth = fontSize*0.05;
        ctx.strokeStyle = dark;
        ctx.strokeText(p.ch,0,0);
        ctx.shadowColor = col;
        ctx.shadowBlur = fontSize*0.2;
        ctx.fillStyle = col;
        ctx.fillText(p.ch,0,0);
        ctx.shadowBlur = 0;
      } else {
        let plainFill = col;
        if(style.gradientColors){
          // 每個字元隨機角度、隨機取 2~3 個相近色組成漸層
          const gc = style.gradientColors;
          const ang = rng()*Math.PI*2, r = fontSize*(0.30+rng()*0.30);
          const g = ctx.createLinearGradient(-Math.cos(ang)*r,-Math.sin(ang)*r,Math.cos(ang)*r,Math.sin(ang)*r);
          const n = 2+Math.floor(rng()*2);
          for(let k=0;k<n;k++){
            g.addColorStop(n===1?0:k/(n-1), gc[Math.floor(rng()*gc.length)]);
          }
          plainFill = g;
        }
        ctx.fillStyle = plainFill;
        ctx.fillText(p.ch,0,0);
      }
      ctx.restore();
    });
  }

  function roundedRectPath(ctx,w,h,r){
    ctx.beginPath();
    ctx.moveTo(r,0);
    ctx.arcTo(w,0,w,h,r);
    ctx.arcTo(w,h,0,h,r);
    ctx.arcTo(0,h,0,0,r);
    ctx.arcTo(0,0,w,0,r);
    ctx.closePath();
  }
  function roundedClip(ctx,w,h,r){
    roundedRectPath(ctx,w,h,r);
    ctx.clip();
  }
  function reapplyRoundedMask(ctx,w,h,r){
    ctx.save();
    ctx.globalCompositeOperation = 'destination-in';
    roundedRectPath(ctx,w,h,r);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();
  }

  // 整張圖做水平正弦波偏移，讓文字與背景一起產生典型驗證碼的扭曲波浪感，
  // 同時也會讓文字邊緣變得不規則、鋸齒化，加深 OCR 辨識難度
  function waveWarpCanvas(canvas, rng, ampPx, freq){
    const w = canvas.width, h = canvas.height;
    if(w<=0 || h<=0) return;
    const ctx = canvas.getContext('2d');
    let src;
    try{ src = ctx.getImageData(0,0,w,h); }catch(e){ return; }
    const dst = ctx.createImageData(w,h);
    const s = src.data, d = dst.data;
    const phase = rng()*Math.PI*2;
    for(let y=0;y<h;y++){
      const shift = Math.round(Math.sin(y*freq+phase)*ampPx);
      const row = y*w;
      for(let x=0;x<w;x++){
        let sx = x - shift;
        if(sx<0) sx=0; else if(sx>=w) sx=w-1;
        const si=(row+sx)*4, di=(row+x)*4;
        d[di]=s[si]; d[di+1]=s[si+1]; d[di+2]=s[si+2]; d[di+3]=s[si+3];
      }
    }
    ctx.putImageData(dst,0,0);
  }

  function addSaltPepperNoise(ctx,w,h,rng,lightColor,darkColor,count){
    for(let i=0;i<count;i++){
      const x=rng()*w, y=rng()*h, s=0.5+rng()*1.6;
      ctx.fillStyle = rng()<0.5 ? lightColor : darkColor;
      ctx.fillRect(x,y,s,s);
    }
  }

  function addToneWash(ctx,w,h,rng){
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'rgba(110,110,120,0.08)');
    g.addColorStop(0.5,'rgba(60,60,70,0.14)');
    g.addColorStop(1,'rgba(130,110,100,0.10)');
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }

  function render(canvas, text, style, seed, logicalW, logicalH, fontOverride){
    const dpr = Math.min(window.devicePixelRatio||1, 2.5);
    canvas.width = logicalW*dpr;
    canvas.height = logicalH*dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,logicalW,logicalH);
    const rng = mulberry32(seed);
    const radius = 0;

    ctx.save();
    roundedClip(ctx, logicalW, logicalH, radius);
    style.bg(ctx, logicalW, logicalH, rng);
    drawStyledText(ctx, logicalW, logicalH, text || ' ', style, rng, fontOverride);

    // 樣式專屬的疊加效果（例如雨滴線條、毛線纏繞），畫在文字上方
    if(style.overlay){
      style.overlay(ctx, logicalW, logicalH, rng);
    }

    // 低對比度色調混合，讓純黑白二值化門檻不容易切乾淨
    addToneWash(ctx, logicalW, logicalH, rng);

    // 椒鹽雜訊：黑白像素混合灑落，破壞單純二值化的效果（方格筆記等樣式跳過，保持乾淨）
    if(!style.noSpeckle){
      const lightSpeck = 'rgba(255,255,255,0.6)';
      const darkSpeck = 'rgba(12,14,16,0.45)';
      addSaltPepperNoise(ctx, logicalW, logicalH, rng, lightSpeck, darkSpeck, Math.floor((logicalW*logicalH)/(style.speckleDiv||340)));
    }
    ctx.restore();

    // 整張圖做輕微波浪扭曲，讓文字與雜訊邊緣一起變形、不規則化
    // （格紋、方格筆記等需要維持直線的樣式跳過這一步）
    if(!style.noWarp){
      const ampPx = Math.max(1, Math.min(canvas.height*0.016, 7));
      const freq = (Math.PI*2*2.2)/Math.max(canvas.height,1);
      waveWarpCanvas(canvas, rng, ampPx, freq);
      reapplyRoundedMask(ctx, logicalW, logicalH, radius);
    }
  }

  /* ---------- 應用程式狀態與互動邏輯 ---------- */
  const mainCanvas = document.getElementById('mainCanvas');
  const styleRow = document.getElementById('styleRow');
  const fontGrid = document.getElementById('fontGrid');
  const textInput = document.getElementById('textInput');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  const state = {
    styleIdx: 0,
    fontIdx: 0,
    seed: Math.floor(Math.random()*1e9),
    text: textInput.value
  };

  const fontPreloadEl = document.getElementById('fontPreload');

  function currentStyle(){ return STYLES[state.styleIdx]; }
  function currentFont(){ return FONTS[state.fontIdx]; }

  // 用隱藏的 DOM 文字節點強迫瀏覽器實際排版該文字，這是觸發網頁字型
  // 真正下載最穩定相容的做法（比單獨呼叫 Font Loading API 更可靠，
  // 尤其是大型、分區塊下載的中文字型）
  function preloadFontViaDOM(family, weight, text){
    const span = document.createElement('span');
    span.style.fontFamily = family;
    span.style.fontWeight = weight;
    span.textContent = text;
    fontPreloadEl.appendChild(span);
  }

  async function ensureFontsLoaded(){
    const style = currentStyle();
    const font = currentFont();
    const text = state.text || ' ';
    const isCJK = CJK_RE.test(text);

    fontPreloadEl.innerHTML = '';
    preloadFontViaDOM(font.family, font.weight, text);
    preloadFontViaDOM(style.font, style.weight, 'Aa');
    if(isCJK){
      preloadFontViaDOM("'Noto Sans TC', sans-serif", 700, text);
    }

    if(document.fonts && document.fonts.load){
      const specs = [
        [`${font.weight} 32px ${font.family}`, text],
        [`${style.weight} 32px ${style.font}`, 'Aa']
      ];
      if(isCJK){
        specs.push([`700 32px 'Noto Sans TC', sans-serif`, text]);
      }
      await Promise.all(specs.map(([spec,txt])=>{
        try{ return document.fonts.load(spec, txt); }catch(e){ return Promise.resolve(); }
      })).catch(()=>{});
    }
    if(document.fonts && document.fonts.ready){
      try{ await document.fonts.ready; }catch(e){}
    }
    // 多等一個畫面更新週期，確保剛下載好的字型已經能被 canvas 讀取到
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  }

  async function renderMain(){
    await ensureFontsLoaded();
    const rect = mainCanvas.parentElement.getBoundingClientRect();
    render(mainCanvas, state.text, currentStyle(), state.seed, rect.width, rect.height, currentFont());
  }

  function buildStyleButtons(){
    STYLES.forEach((style, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'style-btn' + (idx===0 ? ' active' : '');
      btn.setAttribute('aria-label', style.name);
      btn.dataset.idx = idx;

      const icon = document.createElement('canvas');
      icon.width = 64; icon.height = 40;
      btn.appendChild(icon);
      const label = document.createElement('span');
      label.textContent = style.name;
      btn.appendChild(label);

      styleRow.appendChild(btn);

      // 等字型準備好後再畫縮圖圖示（一律使用該風格自帶的字型，
      // 這樣不管目前選了什麼文字字型，按鈕圖示都還是能辨識出該風格）
      requestAnimationFrame(()=>{
        const iw = icon.clientWidth || 66, ih = icon.clientHeight || 41;
        render(icon, 'Aa', style, 1234+idx*77, iw, ih);
      });

      btn.addEventListener('click', ()=>{
        state.styleIdx = idx;
        state.seed = Math.floor(Math.random()*1e9);
        document.querySelectorAll('.style-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderMain();
      });
    });
  }

  function buildFontButtons(){
    FONTS.forEach((font, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'font-btn' + (idx===0 ? ' active' : '');
      btn.setAttribute('aria-label', font.label);

      const fname = document.createElement('div');
      fname.className = 'fname';
      fname.textContent = font.label;
      fname.style.fontFamily = font.family;
      fname.style.fontWeight = font.weight;
      btn.appendChild(fname);

      fontGrid.appendChild(btn);

      btn.addEventListener('click', ()=>{
        state.fontIdx = idx;
        document.querySelectorAll('.font-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderMain();
      });
    });
  }

  // 保險機制：如果有字型是在背景才完成下載，一旦瀏覽器回報完成，
  // 就重新繪製一次，確保畫面最終一定會用上正確的字型
  if(document.fonts && document.fonts.addEventListener){
    document.fonts.addEventListener('loadingdone', ()=>{ renderMain(); });
  }

  let debounceTimer;
  textInput.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=>{
      state.text = textInput.value.trim() || ' ';
      renderMain();
    }, 120);
  });

  shuffleBtn.addEventListener('click', ()=>{
    state.seed = Math.floor(Math.random()*1e9);
    renderMain();
  });

  downloadBtn.addEventListener('click', ()=>{
    mainCanvas.toBlob(async (blob)=>{
      if(!blob) return;
      const fileName = `captcha-${Date.now()}.png`;
      const file = new File([blob], fileName, { type:'image/png' });

      if(navigator.canShare && navigator.canShare({ files:[file] })){
        try{
          await navigator.share({ files:[file], title:'驗證碼圖片' });
          return;
        }catch(err){ /* 使用者取消分享，改用直接下載 */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  });

  window.addEventListener('resize', ()=>{ renderMain(); });

  async function preloadAllFonts(){
    if(!(document.fonts && document.fonts.load)) return;
    const specs = [];
    STYLES.forEach(s => specs.push([`${s.weight} 32px ${s.font}`, 'Aa']));
    FONTS.forEach(f => specs.push([`${f.weight} 32px ${f.family}`, f.sampleText || 'Aa']));
    specs.push([`700 32px 'Noto Sans TC', sans-serif`, '歲月靜好']);
    await Promise.all(specs.map(([spec,txt])=>{
      try{ return document.fonts.load(spec, txt); }catch(e){ return Promise.resolve(); }
    })).catch(()=>{});
  }

  let built = false;
  function boot(){
    if(!built){
      buildStyleButtons();
      buildFontButtons();
      built = true;
    }
    renderMain();
    document.querySelectorAll('.style-btn').forEach((btn,idx)=>{
      const iw = btn.querySelector('canvas').clientWidth || 66;
      const ih = btn.querySelector('canvas').clientHeight || 41;
      render(btn.querySelector('canvas'), 'Aa', STYLES[idx], 1234+idx*77, iw, ih);
    });
  }

  // 先用備援字型畫一次，讓畫面不會空白，
  // 接著主動預先載入所有網頁字型（並帶入實際樣本字，確保中文字型子集真的有下載），
  // 載入完成後再重新繪製一次正確的畫面。
  boot();
  preloadAllFonts().then(boot);
})();
</script>
</body>
</html>
