<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KARMAWEI_</title>
  <style>
    :root {
      --bg-color: #f2f4f7;
      --glass-bg: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
      --text-main: #2c3e50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 15% 15%, rgba(219, 234, 254, 0.55) 0%, transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(243, 244, 246, 0.75) 0%, transparent 35%);
      pointer-events: none;
      z-index: 0;
    }
    .container { width: 100%; max-width: 880px; z-index: 1; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (min-width: 520px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 20px; } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }
    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: var(--glass-shadow);
      transform: none !important;
      transition: none !important;
    }
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      margin-bottom: 4px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
    }
    .card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .card-title {
      font-size: 0.78rem; font-weight: 600; text-align: center;
      width: 100%; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; padding: 0 2px;
    }
  </style>
</head>
