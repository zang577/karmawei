<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KARMAWEI_</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #cbe4fd 0%, #e0f2fe 50%, #f0f9ff 100%);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 8px 24px rgba(148, 163, 184, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      --text-main: #334155;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 1.2px;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 確保藍天白雲背景無縫覆蓋 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 60%, rgba(255, 255, 255, 0.9) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 35%),
        radial-gradient(ellipse at 10% 70%, rgba(255, 255, 255, 0.8) 0%, transparent 30%),
        linear-gradient(135deg, #b9e3fd 0%, #d8f0ff 50%, #eef6ff 100%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 960px;
      z-index: 1;
    }

    .top-controls {
      text-align: center;
      margin-bottom: 24px;
    }

    .controls-box {
      display: inline-flex;
      gap: 16px;
      padding: 10px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .btn {
      padding: 6px 18px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .btn:hover {
      background: #ffffff;
    }

    /* 極致小巧卡片網格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
      justify-items: center;
    }

    @media (min-width: 480px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(5, 1fr); } }

    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--glass-shadow);
      width: 100%;
      max-width: 95px;
    }

    .card-actions {
      position: absolute;
      top: 3px;
      right: 3px;
      display: flex;
      gap: 1px;
      z-index: 2;
    }

    .icon-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 8px;
    }

    .icon-btn.delete:hover {
      background: var(--danger);
      color: white;
    }

    .card-img-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      margin-bottom: 4px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(148, 163, 184, 0.2);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-sub);
    }

    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255, 255, 255, 0.85);
      outline: none;
      font-size: 0.85rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--glass-border);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(148, 163, 184, 0.15);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-controls">
      <div class="controls-box">
        <button class="btn" id="addBtn">新增連結</button>
        <button class="btn" id="copyCodeBtn">複製代碼</button>
      </div>
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle" style="margin-bottom:14px;font-size:1rem;">新增連結</h2>
      <form id="cardForm">
        <input type="hidden" id="cardId">
        <div class="form-group">
          <label>名稱</label>
          <input type="text" id="inputName" required />
        </div>
        <div class="form-group">
          <label>網址</label>
          <input type="url" id="inputUrl" required />
        </div>
        <div class="form-group">
          <label>圖片網址</label>
          <input type="url" id="inputImg" placeholder="請輸入圖片網址" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">取消</button>
          <button type="submit" class="btn">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">複製成功</div>

  <script>
    // 預設的範例資料（兜底方案）
    var defaultCards = [
      { id: '1', name: 'Google', url: 'https://www.google.com', img: 'https://www.google.com/favicon.ico' },
      { id: '2', name: 'GitHub', url: 'https://github.com', img: 'https://github.githubassets.com/favicons/favicon.png' }
    ];

    var cards = [];

    // 極致防呆的資料載入機制：確保資料絕對可用
    function loadData() {
      try {
        var saved = localStorage.getItem('generator_cards_final');
        if (saved) {
          var parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (err) {
        // 即使 localStorage 損壞或被封鎖，也忽略錯誤
      }
      // 如果讀取失敗或資料為空，則使用預設資料
      return defaultCards;
    }

    function render() {
      // 確保 DOM 元素存在，防止拋錯
      var grid = document.getElementById('cardGrid');
      if (!grid) return;
      grid.innerHTML = '';
      
      // 確保 cards 是陣列
      if (!Array.isArray(cards)) {
        cards = defaultCards;
      }

      cards.forEach(function(card, index) {
        var el = document.createElement('div');
        el.className = 'card';
        // 使用原生 onclick，省去脆弱的事件繫結邏輯
        el.innerHTML = [
          '<div class="card-actions">',
            index > 0 ? '<button type="button" class="icon-btn" onclick="moveCard(' + index + ', -1)">◄</button>' : '',
            index < cards.length - 1 ? '<button type="button" class="icon-btn" onclick="moveCard(' + index + ', 1)">►</button>' : '',
            '<button type="button" class="icon-btn" onclick="editCard(\'' + card.id + '\')">✎</button>',
            '<button type="button" class="icon-btn delete" onclick="deleteCard(\'' + card.id + '\')">✕</button>',
          '</div>',
          '<div class="card-img-wrapper">',
            '<img class="card-img" src="' + card.img + '" alt="' + card.name + '" onerror="this.src=\'https://via.placeholder.com/48/ffffff/000000?text=Error\'">',
          '</div>',
          '<div class="card-title">' + card.name + '</div>'
        ].join('');
        grid.appendChild(el);
      });

      // 極致防呆的資料儲存
      try {
        localStorage.setItem('generator_cards_final', JSON.stringify(cards));
      } catch (e) {}
    }

    // 將函式掛載到 window，確保內聯 onclick 抓得到
    window.moveCard = function(index, direction) {
      var target = index + direction;
      if (target < 0 || target >= cards.length) return;
      var temp = cards[index];
      cards[index] = cards[target];
      cards[target] = temp;
      render();
    };

    window.deleteCard = function(id) {
      cards = cards.filter(function(c) { return c.id !== id; });
      render();
    };

    window.openModal = function(card) {
      var overlay = document.getElementById('modalOverlay');
      var title = document.getElementById('modalTitle');
      var idInput = document.getElementById('cardId');
      var nameInput = document.getElementById('inputName');
      var urlInput = document.getElementById('inputUrl');
      var imgInput = document.getElementById('inputImg');
      var form = document.getElementById('cardForm');

      if (!overlay || !form) return;

      overlay.classList.add('active');

      if (card) {
        title.textContent = '編輯連結';
        idInput.value = card.id;
        nameInput.value = card.name;
        urlInput.value = card.url;
        imgInput.value = card.img;
      } else {
        title.textContent = '新增連結';
        form.reset();
        idInput.value = '';
      }
    };

    window.closeModal = function() {
      var overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.classList.remove('active');
    };

    window.editCard = function(id) {
      var card = cards.find(function(c) { return c.id === id; });
      if (card) openModal(card);
    };

    // 繫結靜態按鈕事件
    document.getElementById('addBtn').onclick = function() { openModal(); };
    document.getElementById('cancelBtn').onclick = closeModal;

    document.getElementById('cardForm').onsubmit = function(e) {
      e.preventDefault();
      var id = document.getElementById('cardId').value;
      var name = document.getElementById('inputName').value;
      var url = document.getElementById('inputUrl').value;
      var img = document.getElementById('inputImg').value;

      if (id) {
        var card = cards.find(function(c) { return c.id === id; });
        if (card) {
          card.name = name;
          card.url = url;
          card.img = img;
        }
      } else {
        cards.push({ id: Date.now().toString(), name, url, img });
      }
      render();
      closeModal();
    };

    window.copyCode = function() {
      var html = [
'<!DOCTYPE html>',
'<html lang="zh-TW">',
'<head>',
'  <meta charset="UTF-8" />',
'  <meta name="viewport" content="width=device-width, initial-scale=1.0" />',
'  <title>KARMAWEI_</title>',
'  <style>',
'    :root {',
'      --bg-gradient: linear-gradient(135deg, #cbe4fd 0%, #e0f2fe 50%, #f0f9ff 100%);',
'      --glass-bg: rgba(255, 255, 255, 0.75);',
'      --glass-border: rgba(255, 255, 255, 0.95);',
'      --glass-shadow: 0 8px 24px rgba(148, 163, 184, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);',
'      --text-main: #334155;',
'    }',
'    * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 1.2px; }',
'    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }',
'    body {',
'      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;',
'      background: var(--bg-gradient); background-attachment: fixed; background-size: cover; color: var(--text-main);',
'      display: flex; flex-direction: column; align-items: center; padding: 24px 16px; position: relative;',
'    }',
'    body::before {',
'      content: \'\'; position: fixed; inset: 0;',
'      background: ',
'        radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.95) 0%, transparent 40%),',
'        radial-gradient(ellipse at 80% 60%, rgba(255, 255, 255, 0.9) 0%, transparent 45%),',
'        radial-gradient(ellipse at 50% 90%, rgba(255, 255, 255, 0.85) 0%, transparent 35%),',
'        radial-gradient(ellipse at 10% 70%, rgba(255, 255, 255, 0.8) 0%, transparent 30%),',
'        linear-gradient(135deg, #b9e3fd 0%, #d8f0ff 50%, #eef6ff 100%);',
'      pointer-events: none; z-index: 0;',
'    }',
'    .container { max-width: 960px; margin: 0 auto; z-index: 1; position: relative; width: 100%; }',
'    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 500px; margin: 0 auto; justify-items: center; }',
'    @media (min-width: 480px) { .grid { grid-template-columns: repeat(4, 1fr); } }',
'    @media (min-width: 768px) { .grid { grid-template-columns: repeat(5, 1fr); } }',
'    .card {',
'      background: var(--glass-bg); backdrop-filter: blur(20px);',
'      border-radius: 12px; border: 1px solid var(--glass-border);',
'      padding: 6px 4px; display: flex; flex-direction: column; align-items: center;',
'      text-decoration: none; color: var(--text-main); box-shadow: var(--glass-shadow);',
'      width: 100%; max-width: 95px;',
'      transform: none !important; transition: none !important;',
'    }',
'    .card-img-wrapper {',
'      width: 48px; height: 48px; border-radius: 8px; margin-bottom: 4px;',
'      overflow: hidden; background: rgba(255,255,255,0.8);',
'      border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;',
'    }',
'    .card-img { width: 100%; height: 100%; object-fit: cover; }',
'    .card-title { font-size: 0.7rem; font-weight: 600; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }',
'  </style>',
'</head>',
'<body>',
'  <div class="container">',
'    <div class="grid">',
cards.map(function(c) {
  return [
'      <a href="' + c.url + '" target="_blank" class="card">',
'        <div class="card-img-wrapper"><img class="card-img" src="' + c.img + '" alt="' + c.name + '" onerror="this.src=\'https://via.placeholder.com/48/ffffff/000000?text=Error\'"></div>',
'        <div class="card-title">' + c.name + '</div>',
'      </a>'
  ].join('\n');
}).join('\n'),
'    </div>',
'  </div>',
'</body>',
'</html>'
      ].join('\n');

      navigator.clipboard.writeText(html).then(function() {
        var toast = document.getElementById('toast');
        if (toast) {
          toast.classList.add('show');
          setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }
      });
    };

    // 立即初始化資料並渲染
    cards = loadData();
    render();
  </script>
</body>
</html>
